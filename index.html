/* --- Popover ancorado (desktop) ou sheet (mobile) --- */
let popAtual = null;
function abrirPop(anchor, op){
  fecharPop(); fecharMenu();
  if(window.innerWidth < 768){
    // camada própria, por cima de qualquer formulário aberto (não fecha o sheet de baixo)
    const sh = document.createElement('div');
    sh.className = 'sheet pop-sheet';
    sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.setAttribute('aria-label', op.titulo || 'Editar');
    sh.innerHTML = '<div class="grab"></div><div class="sheet-h"><h2>' + esc(op.titulo || '') + '</h2>' +
      '<button type="button" class="icon-btn" data-pop-fechar aria-label="Fechar">' + ic('x',18) + '</button></div><div class="sheet-b"></div>';
    $('#popRoot').appendChild(sh);
    $('#scrimPop').classList.add('on');
    setTimeout(() => sh.classList.add('on'), 10);
    sh.querySelector('[data-pop-fechar]').addEventListener('click', () => fecharPop());
    const corpo = $('.sheet-b', sh);
    popAtual = {modo:'sheet', el:corpo, casca:sh, op, anchor};
    agendarHist();
    op.render(corpo);
    if(!ehToque()) focarPrimeiro(corpo);
    return corpo;
  }
  const el = document.createElement('div');
  el.className = 'pop';
  el.setAttribute('role','dialog'); el.setAttribute('aria-label', op.titulo || 'Editar');
  $('#popRoot').appendChild(el);
  popAtual = {modo:'pop', el, op, anchor};
  agendarHist();
  op.render(el);
  posicionarPop();
  const fora = ev => { if(popAtual && popAtual.el === el && !el.contains(ev.target) && !(anchor && anchor.contains(ev.target))) fecharPop(); };
  setTimeout(() => document.addEventListener('pointerdown', fora, true), 0);
  popAtual.fora = fora;
  focarPrimeiro(el);
  return el;
}
function posicionarPop(){
  if(!popAtual || popAtual.modo !== 'pop') return;
  const el = popAtual.el, a = popAtual.anchor;
  const r = a && document.contains(a) ? a.getBoundingClientRect() : {left:window.innerWidth/2 - 150, right:window.innerWidth/2 + 150, top:120, bottom:120};
  const w = el.offsetWidth, hh = el.offsetHeight;
  let x = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  let y = r.bottom + 6;
  if(y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 6);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function fecharPop(semFoco){
  if(!popAtual) return;
  const p = popAtual; popAtual = null;
  if(p.modo === 'sheet'){
    const sh = p.casca;
    sh.classList.remove('on'); sh.style.transform = ''; sh.style.pointerEvents = 'none';
    $('#scrimPop').classList.remove('on');
    setTimeout(() => sh.remove(), 230);
  }
  else { document.removeEventListener('pointerdown', p.fora, true); p.el.remove(); }
  agendarHist();
  if(p.op.aoFechar) p.op.aoFechar();
  if(semFoco === true) return;
  const alvo = p.anchor && document.contains(p.anchor) ? p.anchor : (p.op.sel ? $(p.op.sel) : null);
  if(alvo) alvo.focus({preventScroll:true});
}
function focarPrimeiro(el){
  setTimeout(function(){
    const f = el.querySelector('[data-autofoco]') || el.querySelector('input,textarea,select,button:not([disabled])');
    if(f) f.focus({preventScroll:true});
  }, 40);
}

/* --- Menu contextual: popover ancorado no desktop; sheet de ações (itens de 48px) no celular --- */
let menuAtual = null;
function abrirMenu(anchor, itens, opts){
  opts = opts || {};
  fecharMenu(); fecharPop();
  const folha = ehCelular();
  let lista = itens;
  if(folha){
    // ações destrutivas separadas no fim
    const perigo = itens.filter(m => m !== '-' && m.variante === 'dngr');
    if(perigo.length){
      lista = itens.filter(m => perigo.indexOf(m) === -1);
      while(lista.length && lista[lista.length - 1] === '-') lista.pop();
      lista = lista.concat(['-'], perigo);
    }
  }
  const cab = folha && lista[0] && lista[0].titulo ? lista[0].titulo : null;
  const html = (cab ? lista.slice(1) : lista).map(function(m){
    if(m === '-') return '<hr>';
    if(m.titulo) return '<div class="mt">' + esc(m.titulo) + '</div>';
    return '<button type="button" role="menuitem" class="' + (m.variante || '') + '" data-mi="' + esc(m.id) + '"' + (m.desabilitado ? ' disabled' : '') + '>' +
      (m.cor ? '<span class="dot" style="background:' + esc(m.cor) + ';border-radius:50%"></span>' : m.icone ? ic(m.icone, folha ? 19 : 16) : '') +
      '<span class="t">' + esc(m.label) + '</span>' + (m.marcado ? '<span class="ck">' + ic('check',16) + '</span>' : '') + '</button>';
  }).join('');
  const el = document.createElement('div');
  el.setAttribute('role','menu');
  if(folha){
    el.className = 'sheet menu-sheet';
    el.setAttribute('aria-label', cab || 'Ações');
    el.innerHTML = '<div class="grab"></div><div class="sheet-h"><h2>' + esc(cab || 'Ações') + '</h2><button type="button" class="icon-btn" data-menu-fechar aria-label="Fechar">' + ic('x',18) + '</button></div>' +
      '<div class="sheet-b">' + html + '</div>';
    $('#menuRoot').appendChild(el);
    $('#scrimMenu').classList.add('on');
    setTimeout(() => el.classList.add('on'), 10);
    menuAtual = {el, fora:null, anchor, sheet:true};
  }else{
    el.className = 'menu';
    el.innerHTML = html;
    $('#menuRoot').appendChild(el);
    const w = el.offsetWidth, hh = el.offsetHeight;
    const r = anchor && document.contains(anchor) ? anchor.getBoundingClientRect()
      : {left:window.innerWidth/2 - w/2, top:window.innerHeight/3, bottom:window.innerHeight/3};
    el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    let y = r.bottom + 6;
    if(y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 6);
    el.style.top = y + 'px';
    const fora = ev => { if(!el.contains(ev.target)) fecharMenu(); };
    setTimeout(() => document.addEventListener('pointerdown', fora, true), 0);
    menuAtual = {el, fora, anchor};
  }
  agendarHist();
  el.addEventListener('click', function(e){
    if(e.target.closest('[data-menu-fechar]')){ fecharMenu(); return; }
    const b = e.target.closest('[data-mi]'); if(!b || b.disabled) return;
    const m = itens.find(x => x !== '-' && x.id === b.dataset.mi);
    fecharMenu(true);
    if(opts.sel) state.ui.focar = opts.sel;
    if(m && m.acao) m.acao();
  });
  el.addEventListener('keydown', function(e){
    const bs = $$('button[data-mi]:not([disabled])', el), i = bs.indexOf(document.activeElement);
    if(e.key === 'ArrowDown'){ e.preventDefault(); (bs[i+1] || bs[0]).focus(); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); (bs[i-1] || bs[bs.length-1]).focus(); }
    if(e.key === 'Tab'){ fecharMenu(); }
  });
  if(!ehToque()) setTimeout(() => { const f = el.querySelector('button[data-mi]:not([disabled])'); if(f) f.focus({preventScroll:true}); }, 0);
}
function fecharMenu(semFoco){
  if(!menuAtual) return;
  const m = menuAtual; menuAtual = null;
  if(m.fora) document.removeEventListener('pointerdown', m.fora, true);
  if(m.sheet){
    m.el.classList.remove('on'); m.el.style.transform = ''; m.el.style.pointerEvents = 'none';
    $('#scrimMenu').classList.remove('on');
    setTimeout(() => m.el.remove(), 230);
  }else m.el.remove();
  agendarHist();
  if(!semFoco && !ehToque() && m.anchor && document.contains(m.anchor)) m.anchor.focus({preventScroll:true});
}

/* --- Tooltip (menu compacto e botões só com ícone). No toque não aparece: o rótulo fica no aria-label. --- */
let tipTimer = null, ultimoPonteiro = 'mouse';
function precisaTip(el){
  if(!el || !el.dataset.tip || ultimoPonteiro !== 'mouse') return false;
  if(el.dataset.tipSempre) return true;
  const l = el.querySelector('.lbl');
  return !!l && getComputedStyle(l).display === 'none';
}
function mostrarTip(el){
  const t = $('#tip');
  t.textContent = el.dataset.tip;
  const r = el.getBoundingClientRect();
  const lateral = !!el.closest('.sidebar');
  t.style.left = '0px'; t.style.top = '0px';
  t.classList.add('on');
  const w = t.offsetWidth, hh = t.offsetHeight;
  if(lateral){ t.style.left = (r.right + 8) + 'px'; t.style.top = (r.top + r.height/2 - hh/2) + 'px'; }
  else { t.style.left = Math.max(6, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 6)) + 'px'; t.style.top = (r.top - hh - 6 < 4 ? r.bottom + 6 : r.top - hh - 6) + 'px'; }
}
function esconderTip(){ clearTimeout(tipTimer); $('#tip').classList.remove('on'); }
/* =========================================================================
   MÓDULO 12 — CAMPOS: peças editáveis (iguais em lista, kanban e card)
   Clicar num campo abre só o editor dele; o card abre apenas pelo título.
   ========================================================================= */
const ehData = cid => cid === 'dataLembrete' || cid === 'dataEntrega';
function attrEdit(it, cid){ return ' data-edit="' + cid + '" data-id="' + it.id + '"'; }
function recDe(it, cid){
  const alvo = ehLembrete(it) && cid === 'dataLembrete' ? getItem(it.origemId) : it;
  return alvo && alvo.recorrencia ? (alvo.recorrencia[cid] || null) : null;
}
function chipVazio(it, cid, modo){
  const nome = nomeCampo(cid);
  const def = campoDef(cid);
  // data vazia em lista/foco: "Sem data" discreto, mas clicável (abre o seletor)
  if(modo === 'lista' && (ehData(cid) || (def && def.tipo === 'data'))) return chipSemData(it, cid);
  const txt = modo === 'lista' ? '—' : '+ ' + (ehData(cid) ? rotuloCurto(cid) : nome);
  return '<button type="button" class="fc vazio"' + attrEdit(it, cid) + ' aria-label="Definir ' + esc(nome) + '">' + esc(txt) + '</button>';
}
function chipSemData(it, cid){
  return '<button type="button" class="fc sem-data"' + attrEdit(it, cid) + ' aria-label="' + esc(nomeCampo(cid)) + ': sem data. Definir">' + ic('calendar', 12) + '<span class="v">Sem data</span></button>';
}
function chipData(it, cid, modo, iso, rec){
  const sev = severidade(iso), nome = nomeCampo(cid);
  const icone = sev === 'venc' ? 'alert' : sev === 'hoje' ? 'clock' : 'calendar';
  const desc = nome + ': ' + fmtCompleta(iso) + (sev ? ' (' + fmtRelativa(iso) + ')' : '') + (rec ? '. Repete: ' + descreverRec(rec) : '');
  return '<button type="button" class="fc sev-' + sev + '"' + attrEdit(it, cid) + ' aria-label="' + esc(desc) + '. Alterar" title="' + esc(desc) + '">' +
    ic(icone, 12) + (modo === 'kanban' ? '<span class="rot">' + esc(ehData(cid) ? rotuloCurto(cid) : nome) + '</span>' : '') +
    '<span class="v">' + esc(fmtCurta(iso)) + (sev ? ' · ' + esc(fmtRelativa(iso)) : '') + '</span>' +
    (rec ? '<span class="rec">' + ic('repeat', 11) + '</span>' : '') + '</button>';
}
/** Devolve {k, h}: k = meta | titulo | bloco | chip | barra. modo: kanban (cards) | lista (células) | card (detalhe). */
function pecaCampo(it, cid, modo){
  const def = campoDef(cid);
  if(!def || !campoAplica(def, it)) return null;
  const nome = def.nome;
  switch(cid){
    case 'titulo':
      if(modo === 'card') return null;
      return {k:'titulo', h:'<button type="button" class="c-title" data-act="abrir-item" data-id="' + it.id + '" aria-label="Abrir ' + esc(rotuloTipo(it).toLowerCase()) + ': ' + esc(it.titulo) + '">' + destaque(it.titulo) + '</button>'};
    case 'tipo': {
      const h = '<span class="c-tipo' + (ehLembrete(it) ? ' lemb' : '') + '">' + (ehLembrete(it) ? ic('bell', 12) : '') + '<span class="v">' + esc(rotuloTipo(it)) + '</span></span>' +
        (ehProxima(it) ? ' <span class="c-prox" title="Próxima ação do projeto">' + ic('play', 11) + 'Próxima</span>' : '');
      return {k: modo === 'card' ? 'chip' : 'meta', h};
    }
    case 'projetoId': {
      const p = getItem(it.projetoId);
      const txt = p ? p.titulo : 'Sem projeto';
      const rot = esc(nome + ': ' + txt + (ehLembrete(it) ? ' (segue a origem)' : '') + '. Alterar');
      if(modo === 'card') return {k:'chip', h:'<button type="button" class="fc' + (p ? '' : ' vazio') + '"' + attrEdit(it, cid) + ' aria-label="' + rot + '">' + ic('folder', 12) + '<span class="v">' + esc(txt) + '</span></button>'};
      return {k:'meta', h:'<button type="button" class="c-proj' + (p ? '' : ' vazio') + '"' + attrEdit(it, cid) + ' aria-label="' + rot + '">' + ic('folder', 12) + '<span class="v">' + destaque(txt) + '</span></button>'};
    }
    case 'descricao': case 'textoLembrete': {
      // no lembrete, a "descrição" é o texto do lembrete (guardado na origem)
      const valor = it[cid] || '';
      const rotulo = ehLembrete(it) && cid === 'descricao' ? nomeCampo('textoLembrete') : nome;
      const dica = cid === 'textoLembrete' || ehLembrete(it) ? 'Do que você quer se lembrar' : 'Descrição do que precisa fazer';
      if(modo === 'card') return {k:'bloco', h:'<textarea class="inp" data-field="' + cid + '" data-id="' + it.id + '" rows="3" placeholder="' + dica + '" aria-label="' + esc(rotulo) + '" autocapitalize="sentences">' + esc(valor) + '</textarea>'};
      if(!valor) return modo === 'lista' ? {k:'chip', h:chipVazio(it, cid, modo)} : null;
      return {k:'bloco', h:'<button type="button" class="c-desc"' + attrEdit(it, cid) + ' aria-label="' + esc(rotulo) + ': ' + esc(valor.slice(0,80)) + '. Editar">' +
        (cid === 'textoLembrete' ? '<span class="c-tipo lemb" style="display:inline-flex;margin-right:4px;vertical-align:-1px">' + ic('bell',11) + '</span>' : '') + destaque(valor) + '</button>'};
    }
    case 'status': {
      const s = statusPorId(it.tipo, it.status); if(!s) return null;
      return {k:'chip', h:'<button type="button" class="fc st" style="--c:' + esc(s.cor) + '"' + attrEdit(it, cid) + ' aria-label="' + (it.tipo === 'projeto' ? 'Status do projeto' : 'Status da tarefa') + ': ' + esc(s.nome) + '. Alterar"><span class="v">' + esc(s.nome) + '</span></button>'};
    }
    case 'categoriaId': {
      const c = getCat(it.categoriaId);
      if(!c) return {k:'chip', h:chipVazio(it, cid, modo)};
      return {k:'chip', h:'<button type="button" class="fc"' + attrEdit(it, cid) + ' aria-label="' + esc(nome) + ': ' + esc(c.nome) + '. Alterar"><span class="dot" style="background:' + esc(c.cor) + '"></span><span class="v">' + esc(c.nome) + '</span></button>'};
    }
    case 'dataLembrete': case 'dataEntrega':
      return {k:'chip', h: it[cid] ? chipData(it, cid, modo, it[cid], recDe(it, cid)) : chipVazio(it, cid, modo)};
    case 'progresso': {
      const pr = progresso(it);
      const barra = '<span class="prog" role="progressbar" aria-label="Progresso das tarefas" aria-valuenow="' + pr.pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pr.pct + '%"></i></span><span class="prog-lbl">' + pr.feitas + '/' + pr.total + ' tarefas</span>';
      if(modo === 'card' || !pr.total) return {k:'barra', h:'<div class="prog-wrap">' + barra + '</div>'};
      // clicar no progresso abre/fecha as tarefas do projeto logo abaixo
      const aberto = state.ui.expandidos.has(it.id);
      return {k:'barra', h:'<button type="button" class="prog-wrap" data-act="expandir" data-id="' + it.id + '" aria-expanded="' + aberto + '" aria-label="' + (aberto ? 'Recolher' : 'Mostrar') + ' as ' + pr.total + ' tarefas de ' + esc(it.titulo) + '">' + barra + ic('chevD', 14, 'chev') + '</button>'};
    }
    case 'proximaAcao': {
      if(concluido(it) || it.secao !== 'projetos') return null;
      const t = proximaAcao(it);
      if(!t) return {k:'chip', h:'<button type="button" class="fc alerta"' + attrEdit(it, cid) + ' aria-label="Projeto sem próxima ação. Definir">' + ic('alert', 12) + '<span class="v">Sem próxima ação</span></button>'};
      return {k:'chip', h:'<button type="button" class="fc prox"' + attrEdit(it, cid) + ' aria-label="Próxima ação: ' + esc(t.titulo) + '. Trocar">' + ic('play', 12) +
        (modo === 'kanban' ? '<span class="rot">Próxima:</span>' : '') + '<span class="v">' + destaque(t.titulo) + '</span></button>'};
    }
    case 'ultimaAtualizacao': {
      const u = ultimaAtualizacao(it);
      if(!u) return modo === 'kanban' ? null : {k:'bloco', h:'<span class="muted">—</span>'};
      const deOutra = u.de.id !== it.id;
      return {k:'bloco', h:'<p class="c-ult" title="' + esc(tempoCompleto(u.a.em)) + '">' + ic(u.a.kind === 'comentario' ? 'msg' : 'history', 11).replace('<svg ','<svg style="display:inline;vertical-align:-1px;margin-right:3px" ') +
        (deOutra ? '<b>' + esc(u.de.titulo) + ':</b> ' : '') + esc(resumoAtividade(u.a)) + ' <span class="tm">· ' + esc(tempoRelativo(u.a.em)) + '</span></p>'};
    }
    case 'comentarios': {
      const n = contaComentarios(it);
      if(!n && modo === 'kanban') return null;
      return {k:'chip', h:'<span class="fc estatico" aria-label="' + n + ' comentário(s)">' + ic('msg', 12) + n + '</span>'};
    }
    case 'ultimoComentario': {
      const c = ultimoComentario(it);
      if(!c) return modo === 'kanban' ? null : {k:'bloco', h:'<span class="muted">—</span>'};
      return {k:'bloco', h:'<p class="c-ult">“' + esc(c.texto) + '” <span class="tm" title="' + esc(tempoCompleto(c.em)) + '">· ' + esc(tempoRelativo(c.em)) + '</span></p>'};
    }
  }
  // campos personalizados
  const v = (it.extras || {})[cid];
  if(v == null || v === '') return {k:'chip', h:chipVazio(it, cid, modo)};
  if(def.tipo === 'data') return {k:'chip', h:chipData(it, cid, modo, v, null)};
  const txt = def.tipo === 'numero' ? Number(v).toLocaleString('pt-BR') : String(v);
  return {k:'chip', h:'<button type="button" class="fc"' + attrEdit(it, cid) + ' aria-label="' + esc(nome + ': ' + txt) + '. Alterar">' +
    (modo === 'kanban' ? '<span class="rot">' + esc(nome) + ':</span>' : '') + '<span class="v">' + esc(txt) + '</span></button>'};
}

/* --- Editores inline --- */
function abrirEditorCampo(anchor, id, cid){
  const it = getItem(id); if(!it) return;
  const sel = '[data-edit="' + cid + '"][data-id="' + id + '"]';
  const nome = nomeCampo(cid);
  switch(cid){
    case 'status': if(ehLembrete(it)) return;      // lembrete não tem status
      return abrirMenu(anchor, [{titulo: it.tipo === 'projeto' ? 'Status do projeto' : 'Status da tarefa'}].concat(
      listaStatus(it.tipo).map(s => ({id:s.id, label:s.nome, cor:s.cor, marcado:s.id === it.status, acao:() => setStatus(id, s.id)}))), {sel});
    case 'proximaAcao': return escolherProxima(anchor, id);
    case 'statusProjeto': {
      const p = getItem(it.projetoId); if(!p) return;
      return abrirMenu(anchor, [{titulo:'Status do projeto'}].concat(
        listaStatus('projeto').map(s => ({id:s.id, label:s.nome, cor:s.cor, marcado:s.id === p.status, acao:() => setStatusProjetoDeTarefa(id, s.id)}))), {sel});
    }
    case 'categoriaId': return abrirMenu(anchor, [{titulo:nome}, {id:'sem', label:'Sem categoria', marcado:!it.categoriaId, acao:() => alterar(id, {categoriaId:null})}]
      .concat(categorias().map(c => ({id:c.id, label:c.nome, cor:c.cor, marcado:c.id === it.categoriaId, acao:() => alterar(id, {categoriaId:c.id})})))
      .concat(['-', {id:'ger', label:'Gerenciar categorias', icone:'gear', acao:() => irPara('#/config')}]), {sel});
    case 'projetoId': return menuProjeto(anchor, it, sel);
    case 'descricao':
      if(ehLembrete(it)) return popTexto(anchor, {titulo:nomeCampo('textoLembrete'), valor:it.descricao, multi:true, sel, salvar:v => definirTextoLembrete(id, v)});
      return popTexto(anchor, {titulo:nome, valor:it.descricao, multi:true, sel, salvar:v => alterar(id, {descricao:v})});
    case 'textoLembrete': return popTexto(anchor, {titulo:nome, valor:it.textoLembrete || '', multi:true, sel, salvar:v => definirTextoLembrete(id, v)});
    case 'dataLembrete': {
      if(ehLembrete(it)) return abrirReagendar(anchor, it, sel);
      // o texto do lembrete entra junto com a data (ele só existe quando há data)
      return abrirDatePicker(anchor, {titulo:nome, valor:it[cid], rec:recDe(it, cid), sel,
        dicaRec:'Com repetição, concluir o lembrete já agenda o próximo.',
        texto:{rotulo:nomeCampo('textoLembrete'), valor:it.textoLembrete || '', salvar:v => { if(it.dataLembrete) definirTextoLembrete(id, v); else it.textoLembrete = v; }},
        limpar: lembreteDe(id) ? {rotulo:'Cancelar lembrete', acao:() => removerLembrete(id)} : null,
        escolher:v => definirData(id, cid, v), recorrer:r => setRecorrencia(id, cid, r)});
    }
    case 'dataEntrega':
      return abrirDatePicker(anchor, {titulo:nome, valor:it[cid], rec:recDe(it, cid), sel,
        dicaRec:'Ao concluir, o item reabre com a próxima data de entrega.',
        escolher:v => definirData(id, cid, v), recorrer:r => setRecorrencia(id, cid, r)});
  }
  const def = campoDef(cid); if(!def || def.sistema || def.exibicao) return;
  const val = (it.extras || {})[cid];
  if(def.tipo === 'selecao') return abrirMenu(anchor, [{titulo:def.nome}].concat(def.opcoes.map(o => ({id:'o-' + o, label:o, marcado:val === o, acao:() => alterarExtra(id, cid, o)})))
    .concat(['-', {id:'limpar', label:'Limpar', icone:'x', desabilitado: val == null, acao:() => alterarExtra(id, cid, null)}]), {sel});
  if(def.tipo === 'data') return abrirDatePicker(anchor, {titulo:def.nome, valor:val, sel, escolher:v => alterarExtra(id, cid, v)});
  return popTexto(anchor, {titulo:def.nome, valor: val == null ? '' : String(val), numero:def.tipo === 'numero', sel,
    salvar:v => alterarExtra(id, cid, def.tipo === 'numero' ? (v === '' || isNaN(Number(v)) ? null : Number(v)) : v)});
}
function menuProjeto(anchor, it, sel){
  const itens = [{titulo:nomeCampo('projetoId')}];
  const atual = getItem(it.projetoId);
  if(atual) itens.push({id:'abrir', label:'Abrir “' + atual.titulo + '”', icone:'arrowR', acao:() => irPara('#/projetos/' + atual.id)});
  if(ehLembrete(it)){ itens.push({id:'info', label:'Segue o projeto da origem', icone:'info', desabilitado:true}); return abrirMenu(anchor, itens, {sel}); }
  if(atual) itens.push('-');
  itens.push({id:'sem', label:'Sem projeto', marcado:!it.projetoId, acao:() => alterar(it.id, {projetoId:null})});
  if(atual && concluido(atual)) itens.push({id:'concl', label:atual.titulo + ' (concluído)', icone:'folder', marcado:true, desabilitado:true});
  projetosVinculaveis().forEach(p => itens.push({id:p.id, label:p.titulo, icone:'folder', marcado:p.id === it.projetoId, acao:() => alterar(it.id, {projetoId:p.id})}));
  abrirMenu(anchor, itens, {sel});
}
function fecharPopCom(fn){ const s = popAtual && popAtual.op.sel; fecharPop(true); if(s) state.ui.focar = s; fn(); }
function popTexto(anchor, o){
  abrirPop(anchor, {titulo:o.titulo, sel:o.sel, render:function(el){
    el.innerHTML = '<div class="pop-t">' + esc(o.titulo) + '</div>' +
      (o.multi ? '<textarea class="inp" rows="4" id="ptx" data-autofoco aria-label="' + esc(o.titulo) + '">' + esc(o.valor) + '</textarea>'
               : '<input class="inp" id="ptx" data-autofoco aria-label="' + esc(o.titulo) + '"' + (o.numero ? ' type="number" inputmode="decimal"' : '') + ' value="' + esc(o.valor) + '">') +
      '<p class="hint">' + (o.multi ? 'Ctrl+Enter salva' : 'Enter salva') + ' · Esc cancela</p>' +
      '<div class="dp-foot"><button type="button" class="btn blk" id="ptxC">Cancelar</button><button type="button" class="btn prim blk" id="ptxS">Salvar</button></div>';
    const tx = $('#ptx', el);
    const salvar = () => { const v = o.multi ? tx.value : tx.value.trim(); fecharPopCom(() => o.salvar(v)); };
    $('#ptxS', el).onclick = salvar;
    $('#ptxC', el).onclick = () => fecharPop();
    tx.addEventListener('keydown', e => { if(e.key === 'Enter' && (!o.multi || e.ctrlKey || e.metaKey)){ e.preventDefault(); salvar(); } });
  }});
}

/* --- Date picker com atalhos e recorrência --- */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/**
 * o: {titulo, valor, escolher(v), rec, recorrer(r), dicaRec, sel, semLimpar (sem "Sem data"),
 *     proxima (mostra atalho da próxima ocorrência), texto:{rotulo, valor, salvar(v)}, limpar:{rotulo, acao()}}
 */
function abrirDatePicker(anchor, o){
  let mes = (o.valor || hojeISO()).slice(0,7);
  let foco = o.valor || hojeISO();
  let rec = o.rec ? clone(o.rec) : null;
  let raiz = null;
  let textoAtual = o.texto ? (o.texto.valor || '') : '';
  const escolher = function(v){
    // o texto digitado vale junto com a data, mesmo sem ter saído do campo
    if(o.texto && textoAtual.trim() !== (o.texto.valor || '').trim()){ o.texto.salvar(textoAtual.trim()); o.texto.valor = textoAtual.trim(); }
    fecharPopCom(() => o.escolher(v));
  };
  const podeLimpar = !o.semLimpar && !o.limpar;
  function desenhar(focarDia){
    const el = raiz, h = hojeISO();
    const prim = parseISO(mes + '-01');
    const ini = addDias(mes + '-01', -((prim.getDay() + 6) % 7));
    let dias = '';
    for(let i = 0; i < 42; i++){
      const d = addDias(ini, i), dd = parseISO(d);
      const cls = 'dp-d' + (d.slice(0,7) !== mes ? ' fora' : '') + (d === h ? ' hj' : '') + (d === o.valor ? ' sel' : '');
      dias += '<button type="button" class="' + cls + '" data-dia="' + d + '" tabindex="' + (d === foco ? 0 : -1) + '" aria-label="' + esc(dd.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})) + (d === h ? ', hoje' : '') + '"' + (d === o.valor ? ' aria-pressed="true"' : '') + '>' + dd.getDate() + '</button>';
    }
    // atalhos (no celular viram botões grandes em 2 colunas): Hoje, Amanhã, Próxima semana… e "Sem data"
    const atalhos = [['Hoje',h],['Amanhã',addDias(h,1)],['Próx. segunda',proxSegunda(h)],['Em 1 semana',addDias(h,7)],['Em 1 mês',addMeses(h,1)]];
    if(!podeLimpar) atalhos.splice(2, 0, ['Em 3 dias', addDias(h,3)]);
    const sub = iso => '<small>' + esc(parseISO(iso).toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})) + '</small>';
    const freq = rec ? rec.freq : '';
    let recHTML = '';

      recHTML = '<div class="dp-sec"><div class="dp-row"><label for="dpRec">' + ic('repeat',13) + ' Repetir</label><select class="inp" id="dpRec">' +
        [['','Não repete'],['diaria','Todo dia'],['semanal','Toda semana'],['mensal','Todo mês'],['personalizada','Personalizada…']]
          .map(x => '<option value="' + x[0] + '"' + (x[0] === freq ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div>';
      if(freq === 'personalizada'){
        recHTML += '<div class="dp-row" style="margin-top:8px"><label for="dpN">A cada</label><input class="inp" type="number" min="1" max="99" id="dpN" value="' + (rec.intervalo || 1) + '" style="max-width:72px">' +
          '<select class="inp" id="dpU" aria-label="Unidade">' + [['dia','dia(s)'],['semana','semana(s)'],['mes','mês(es)']].map(x => '<option value="' + x[0] + '"' + (x[0] === rec.unidade ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div>';
        if(rec.unidade === 'semana'){
          recHTML += '<div class="dp-dias" role="group" aria-label="Dias da semana">' + [1,2,3,4,5,6,0].map(d =>
            '<button type="button" data-dow="' + d + '" aria-pressed="' + ((rec.diasSemana || []).indexOf(d) !== -1) + '" aria-label="' + NOMES_DIA[d] + '">' + NOMES_DIA[d].charAt(0).toUpperCase() + '</button>').join('') + '</div>';
        }
      }
      recHTML += '<p class="hint">' + ic('info',13) + '<span>' + (rec ? esc(descreverRec(rec)) + '. ' : '') + esc(o.dicaRec || '') + '</span></p></div>';
    }
    let proxHTML = '';
    if(o.proxima && rec){
      const px = proximaOcorrencia(o.valor || h, rec);
      proxHTML = '<button type="button" class="btn prim blk" data-dia="' + px + '" style="margin-bottom:10px">' + ic('repeat',15) + 'Próxima: ' +
        esc(parseISO(px).toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})) + ' (' + esc(fmtRelativa(px)) + ')</button>';
    }
    const textoHTML = o.texto ? '<div class="dp-sec"><label class="flabel" for="dpTxt">' + esc(o.texto.rotulo) + '</label>' +
      '<textarea class="inp" id="dpTxt" rows="2" placeholder="Do que você quer se lembrar" autocapitalize="sentences">' + esc(textoAtual) + '</textarea></div>' : '';
    el.innerHTML = '<div class="pop-t">' + esc(o.titulo) + '</div>' + proxHTML +
      '<div class="dp-at">' + atalhos.map(a => '<button type="button" data-dia="' + a[1] + '">' + a[0] + sub(a[1]) + '</button>').join('') +
        (podeLimpar ? '<button type="button" class="sem" data-sem-data' + (o.valor ? '' : ' disabled') + '>Sem data</button>' : '') + '</div>' +
      '<div class="dp-nav"><button type="button" class="icon-btn sm" data-nav="-1" aria-label="Mês anterior">' + ic('chevL',16) + '</button>' +
        '<strong aria-live="polite">' + MESES[prim.getMonth()].charAt(0).toUpperCase() + MESES[prim.getMonth()].slice(1) + ' de ' + prim.getFullYear() + '</strong>' +
        '<button type="button" class="icon-btn sm" data-nav="1" aria-label="Próximo mês">' + ic('chevR',16) + '</button></div>' +
      '<div class="dp-grid" role="group" aria-label="Dias">' + ['S','T','Q','Q','S','S','D'].map(d => '<span class="dp-dow" aria-hidden="true">' + d + '</span>').join('') + dias + '</div>' +
      '<div class="dp-row" style="margin-top:10px"><label for="dpDig">Digitar data</label><input class="inp" type="date" id="dpDig" value="' + esc(o.valor || '') + '"></div>' +
      recHTML + textoHTML +
      '<div class="dp-foot">' + (o.limpar ? '<button type="button" class="btn dngr blk" id="dpLimpa">' + esc(o.limpar.rotulo) + '</button>' : '') +
      '<button type="button" class="btn blk" id="dpFecha">Fechar</button></div>';
    if(focarDia){ const b = el.querySelector('.dp-grid [data-dia="' + foco + '"]'); if(b) b.focus(); }
  }
  function mudouRec(){ o.recorrer(rec); desenhar(); }
  abrirPop(anchor, {titulo:o.titulo, sel:o.sel, render:function(el){
    raiz = el;
    desenhar();
    el.addEventListener('click', function(e){
      const d = e.target.closest('[data-dia]'); if(d){ escolher(d.dataset.dia); return; }
      if(e.target.closest('[data-sem-data]')){ escolher(null); return; }
      const n = e.target.closest('[data-nav]');
      if(n){ const m = addMeses(mes + '-01', Number(n.dataset.nav)); mes = m.slice(0,7); foco = m; desenhar(); el.querySelector('[data-nav="' + n.dataset.nav + '"]').focus(); return; }
      const w = e.target.closest('[data-dow]');
      if(w && rec){ const v = Number(w.dataset.dow); rec.diasSemana = rec.diasSemana || []; const i = rec.diasSemana.indexOf(v); if(i === -1) rec.diasSemana.push(v); else rec.diasSemana.splice(i,1); mudouRec(); const b = el.querySelector('[data-dow="' + v + '"]'); if(b) b.focus(); return; }
      if(e.target.closest('#dpLimpa')){ fecharPopCom(() => o.limpar.acao()); return; }
      if(e.target.closest('#dpFecha')){ fecharPop(); }
    });
    el.addEventListener('input', function(e){ if(e.target.id === 'dpTxt') textoAtual = e.target.value; });
    el.addEventListener('change', function(e){
      if(e.target.id === 'dpTxt'){ o.texto.salvar(e.target.value.trim()); return; }
      if(e.target.id === 'dpDig'){ if(isoValido(e.target.value)) escolher(e.target.value); return; }
      if(e.target.id === 'dpRec'){
        const f = e.target.value;
        rec = !f ? null : f === 'personalizada' ? {freq:'personalizada', intervalo:1, unidade:'semana', diasSemana:[parseISO(o.valor || hojeISO()).getDay()]} : {freq:f};
        mudouRec(); const s = el.querySelector('#dpRec'); if(s) s.focus(); return;
      }
      if(e.target.id === 'dpN' && rec){ rec.intervalo = Math.max(1, Math.min(99, Number(e.target.value) || 1)); mudouRec(); const s = el.querySelector('#dpN'); if(s) s.focus(); return; }
      if(e.target.id === 'dpU' && rec){ rec.unidade = e.target.value; if(rec.unidade !== 'semana') delete rec.diasSemana; mudouRec(); const s = el.querySelector('#dpU'); if(s) s.focus(); }
    });
    el.addEventListener('keydown', function(e){
      const b = e.target.closest('.dp-grid [data-dia]'); if(!b) return;
      const passo = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}[e.key];
      let novo = null;
      if(passo) novo = addDias(b.dataset.dia, passo);
      if(e.key === 'PageUp') novo = addMeses(b.dataset.dia, -1);
      if(e.key === 'PageDown') novo = addMeses(b.dataset.dia, 1);
      if(e.key === 'Home') novo = addDias(b.dataset.dia, -((parseISO(b.dataset.dia).getDay() + 6) % 7));
      if(e.key === 'End') novo = addDias(b.dataset.dia, 6 - ((parseISO(b.dataset.dia).getDay() + 6) % 7));
      if(!novo) return;
      e.preventDefault();
      foco = novo; mes = novo.slice(0,7);
      desenhar(true);
    });
  }});
}

   MÓDULO 13 — CARD, LINHA E KANBAN

const ehDesktop = () => window.matchMedia('(min-width:1024px)').matches;
/** Botão compacto de conclusão (círculo). No lembrete, conclui o lembrete (com a cor dele). */
function btnConcluir(it){
  if(!it.tipo) return '';
  const t = esc(it.titulo), feito = concluido(it), lemb = ehLembrete(it);
  const acao = feito ? (lemb ? 'Reabrir lembrete' : 'Reabrir') : (lemb ? 'Concluir lembrete' : 'Concluir');
  return '<button type="button" class="chk' + (feito ? ' feito' : lemb ? ' lemb' : '') + '" data-act="concluir" data-id="' + it.id + '" aria-label="' + acao + ': ' + t + '" data-tip="' + acao + '" data-tip-sempre="1">' + ic('check', 13) + '</button>';
}
function btnMenu(it){
  return '<button type="button" class="icon-btn sm" data-act="menu-item" data-id="' + it.id + '" aria-label="Mais ações: ' + esc(it.titulo) + '">' + ic('more', 16) + '</button>';
}
function linhaMotivo(m, cls){
  if(!m) return '';
  const sev = severidade(m.iso);
  return '<div class="' + cls + ' sev-' + sev + '" title="' + esc(fmtCompleta(m.iso)) + '">' + ic(sev === 'venc' ? 'alert' : 'clock', 12) + esc(textoMotivo(m)) + '</div>';
}
/** Campo sem valor (nos cards, os vazios viram um único atalho "+ Campos"). */
function campoVazio(it, cid){
  const def = campoDef(cid);
  if(!def || def.exibicao || !campoAplica(def, it)) return false;
  if(cid === 'titulo' || cid === 'status' || cid === 'descricao' || cid === 'textoLembrete') return false;
  if(cid === 'projetoId') return it.tipo === 'tarefa' && !it.projetoId && !ehLembrete(it);
  if(def.sistema) return !it[cid];
  const v = (it.extras || {})[cid];
  return v == null || v === '';
}
/** Card: tipo → projeto → título → descrição → demais campos (ordem definida no layout). */
function cardHTML(it, ctx){
  let corpo = '', grupoAtual = null, buf = [];
  const vazios = [];
  const flush = () => {
    if(!buf.length) return;
    corpo += grupoAtual === 'meta' ? '<div class="c-meta">' + buf.join('<span class="c-sep" aria-hidden="true">·</span>') + '</div>' : '<div class="c-chips">' + buf.join('') + '</div>';
    buf = []; grupoAtual = null;
  };
  layoutVisivel(ctx.layout).forEach(function(cid){
    if(campoVazio(it, cid)){ vazios.push(cid); return; }
    const p = pecaCampo(it, cid, 'kanban'); if(!p) return;
    if(p.k === 'titulo'){ flush(); corpo += '<div class="c-trow">' + btnConcluir(it) + p.h + '</div>'; return; }
    if(p.k === 'meta' || p.k === 'chip'){ if(grupoAtual !== p.k) flush(); grupoAtual = p.k; buf.push(p.h); }
    else { flush(); corpo += p.h; }
  });
  if(vazios.length){
    if(grupoAtual !== 'chip') flush();
    grupoAtual = 'chip';
    const rot = vazios.length === 1 ? (ehData(vazios[0]) ? rotuloCurto(vazios[0]) : nomeCampo(vazios[0])) : 'Campos';
    buf.push('<button type="button" class="fc vazio" data-act="campos-vazios" data-id="' + it.id + '" data-campos="' + vazios.join(',') + '" aria-label="Preencher: ' + esc(vazios.map(nomeCampo).join(', ')) + '">' + ic('plus', 12) + esc(rot) + '</button>');
  }
  flush();
  // GTD: projeto sem próxima ação avisa no card mesmo com o campo oculto no layout
  if(semProxima(it) && layoutVisivel(ctx.layout).indexOf('proximaAcao') === -1) corpo += alertaProxima(it);
  const pe = ctx.rodape ? ctx.rodape(it) : '';
  const art = '<article class="card' + (ehLembrete(it) ? ' lemb' : '') + (concluido(it) ? ' done' : '') + '"' + (ctx.arrastavel ? ' data-drag-id="' + it.id + '"' : '') +
    ' aria-label="' + esc(rotuloTipo(it) + ': ' + it.titulo) + '">' + linhaMotivo(ctx.motivo, 'c-motivo') + (ctx.topo || '') + corpo +
    (pe ? '<div class="c-foot">' + pe + '</div>' : '') + (pe ? '' : btnMenu(it).replace('class="icon-btn sm"', 'class="icon-btn sm c-menu"')) + '</article>';
  return art + (it.tipo === 'projeto' && state.ui.expandidos.has(it.id) ? subsHTML(it) : '');
}
function alertaProxima(p){
  return '<button type="button" class="c-alerta" data-edit="proximaAcao" data-id="' + p.id + '" aria-label="Projeto sem próxima ação. Definir">' + ic('alert', 13) + '<span>Sem próxima ação — projeto parado. Definir</span></button>';
}
/** Tarefas do projeto abertas abaixo do card, ligadas visualmente a ele (a próxima ação primeiro). */
function tarefasDoProjeto(p){
  const ts = ordenar(filtraConcluidos(subtarefas(p.id).filter(t => !ehLembrete(t))), 'entrega-asc');
  const px = proximaAcao(p);
  return px ? [px].concat(ts.filter(t => t !== px)) : ts;
}
function subsHTML(p){
  const ts = tarefasDoProjeto(p);
  return '<div class="subs" role="group" aria-label="Tarefas de ' + esc(p.titulo) + '">' +
    (ts.length ? ts.map(t => linhaFoco(t, {semProjeto:true, cls:'sub'})).join('') : '<p class="vazio-sub">Nenhuma tarefa.</p>') + '</div>';
}
/**
 * Linha do modo Foco (também usada nas tarefas expandidas e em Concluídos): concluir, projeto, título, datas e status.
 * o: {semProjeto, cls, semMenu, semStatus, arrastavel (ordem personalizada), extraMeta}
 */
function linhaFoco(it, o){
  o = o || {};
  const proj = it.tipo === 'tarefa' && it.projetoId ? getItem(it.projetoId) : null;
  let topo = '';
  if(ehLembrete(it)){
    topo = '<div class="fr-proj lemb">' + ic('bell', 12) + '<span class="v">Lembrete' + (proj && !o.semProjeto ? ' · ' + esc(proj.titulo) : '') + '</span></div>';
  }else if(proj && !o.semProjeto){
    topo = '<div class="fr-proj"><button type="button" class="c-proj" data-edit="projetoId" data-id="' + it.id + '" aria-label="Projeto: ' + esc(proj.titulo) + '. Alterar">' + ic('folder', 12) + '<span class="v">' + destaque(proj.titulo) + '</span></button>' +
      (ehProxima(it) ? '<span class="c-prox" title="Próxima ação do projeto">' + ic('play', 11) + 'Próxima</span>' : '') + '</div>';
  }else if(ehProxima(it)){
    topo = '<div class="fr-proj"><span class="c-prox" title="Próxima ação do projeto">' + ic('play', 11) + 'Próxima ação</span></div>';
  }
  const meta = [];
  const dCampos = ehLembrete(it) ? ['dataLembrete'] : ['dataEntrega', 'dataLembrete'];
  dCampos.forEach(function(cid){
    if(!campoAtivo(cid)) return;
    if(!it[cid]){
      // entrega vazia: "Sem data" discreto e clicável (abre o seletor) — só em itens abertos
      if(cid === 'dataEntrega' && !concluido(it) && !o.semMenu) meta.push(chipSemData(it, cid));
      return;
    }
    if(cid === 'dataLembrete' && !ehLembrete(it) && lembreteDe(it.id)) return;   // já representado pelo card de lembrete
    meta.push(chipData(it, cid, 'kanban', it[cid], recDe(it, cid)));
  });
  const st = o.semStatus ? null : pecaCampo(it, 'status', 'kanban'); if(st) meta.push(st.h);
  if(it.tipo === 'projeto'){
    const pr = progresso(it); if(pr.total) meta.push('<span class="fc estatico">' + ic('checkSq', 12) + pr.feitas + '/' + pr.total + '</span>');
    if(semProxima(it)) meta.push('<button type="button" class="fc alerta" data-edit="proximaAcao" data-id="' + it.id + '" aria-label="Projeto sem próxima ação. Definir">' + ic('alert', 12) + '<span class="v">Sem próxima ação</span></button>');
  }
  if(o.extraMeta) meta.push(o.extraMeta);
  const arrasta = o.arrastavel && !concluido(it);
  return '<div class="foco-row' + (o.cls ? ' ' + o.cls : '') + (ehLembrete(it) ? ' lemb' : '') + (concluido(it) ? ' done' : '') + '" role="listitem"' + (arrasta ? ' data-foco-id="' + it.id + '"' : '') + '>' +
    (arrasta ? '<span class="fr-hdl" aria-hidden="true">' + ic('grip', 12) + '</span>' : '') + btnConcluir(it) +
    '<div class="fr-corpo">' + topo + '<button type="button" class="fr-tit" data-act="abrir-item" data-id="' + it.id + '">' + destaque(it.titulo) + '</button>' +
    (meta.length ? '<div class="fr-meta">' + meta.join('') + '</div>' : '') + '</div>' + (o.semMenu ? '' : btnMenu(it)) + '</div>';
}
/** Modo Foco: lista por prazo, com adição rápida, arrastar para ordenar (ordem personalizada) e grupo de concluídas. */
function focoHTML(sec, itens, o){
  o = o || {};
  const faixa = it => (o.faixaFn ? o.faixaFn(it) : faixaItem(it)) || 'semdata';
  const abertos = itens.filter(i => !concluido(i)), feitos = itens.filter(concluido);
  const blocos = FAIXAS.concat([['semdata','Sem data']]).map(f => ({chave:f[0], nome:f[1], itens:abertos.filter(i => faixa(i) === f[0])})).filter(g => g.itens.length);
  const lista = its => '<div class="foco-lista" role="list" data-foco-sec="' + sec + '">' + its.map(it => linhaFoco(it, {semProjeto:o.semProjeto, arrastavel:true})).join('') + '</div>';
  const add = o.semAdicionar ? '' : '<div class="foco-add"><span class="mais" aria-hidden="true">' + ic('plus', 18) + '</span><label class="sr-only" for="focoAdd">' + esc(o.placeholder || 'Adicionar tarefa') + '</label>' +
    '<input id="focoAdd" data-sec="' + sec + '" placeholder="' + esc(o.placeholder || 'Adicionar tarefa') + '" autocomplete="off" enterkeyhint="done" autocapitalize="sentences"></div>';
  const manual = (state.prefs[sec] || {}).ordem === 'manual';
  const ordemInfo = abertos.length > 1 ? '<p class="foco-ordem">' + ic(manual ? 'grip' : 'info', 13) +
    (manual ? '<span>Ordem personalizada.</span><button type="button" class="btn sm ghost" data-act="sheet-ordem" data-sec="' + sec + '">Alterar ordem</button>'
            : '<span>' + (ehToque() ? 'Segure e arraste' : 'Arraste') + (sec === 'projetos' ? ' um projeto' : ' uma tarefa') + ' para definir a sua ordem.</span>') + '</p>' : '';
  const corpo = blocos.map(g => grupo(sec, 'foco-' + g.chave, g.nome, lista(g.itens), g.itens.length)).join('') +
    (feitos.length ? grupo(sec, 'foco-feitas', 'Concluídas', '<div class="foco-lista" role="list">' + feitos.map(it => linhaFoco(it, {semProjeto:o.semProjeto})).join('') + '</div>', feitos.length) : '');
  return '<div class="foco">' + add + (corpo ? ordemInfo + corpo : vazio('sparkle', 'Tudo em dia 🎉', o.vazio || 'Nenhuma tarefa aberta por aqui.')) + '</div>';
}
/** Larguras das colunas: [mínimo em px, trilha do grid]. Com quebra de linha, os mínimos encolhem para caber na tela. */
function larguraCol(cid, quebra){
  // [mínimo sem quebra, mínimo com quebra, peso]: o título tem prioridade de espaço
  const T = {titulo:[170,180,2.8], descricao:[160,120,2], textoLembrete:[160,120,1.8], projetoId:[110,88,1.1], status:[112,84,.9], categoriaId:[100,76,.8],
    dataLembrete:[112,86,.9], dataEntrega:[112,86,.9], tipo:[96,92,.5], proximaAcao:[140,110,1.1], progresso:[120,90,.8], comentarios:[48,40,.3], ultimoComentario:[160,120,1.6], ultimaAtualizacao:[170,120,1.6]};
  const d = campoDef(cid);
  const t = T[cid] || (d && d.tipo === 'numero' ? [84,64,.5] : d && d.tipo === 'data' ? [112,92,.9] : [96,80,1]);
  const min = quebra ? t[1] : t[0];
  return [min, 'minmax(' + min + 'px,' + t[2] + 'fr)'];
}
function chaveOrdem(cid){
  const m = {titulo:'titulo', status:'status', categoriaId:'categoria', projetoId:'projeto', dataLembrete:'lemb', dataEntrega:'entrega', progresso:'progresso', comentarios:'comentarios', tipo:'tipo', ultimaAtualizacao:'atualizacao'};
  if(m[cid]) return m[cid];
  const d = campoDef(cid);
  return d && !d.sistema && !d.exibicao ? 'x:' + cid : null;
}
/** Largura útil da área de conteúdo (para decidir se a grade cabe na tela). */
function larguraUtil(){
  const v = $('#view'); if(!v) return window.innerWidth;

}
/** O que o item criado por "+ Adicionar" herda naquela coluna/grupo. */
function heranca(sec, col){
  const r = state.ui.rota, b = {};
  if(sec === 'projetos'){ b.tipo = 'projeto'; b.secao = 'projetos'; if(statusPorId('projeto', col)) b.status = col; else if(getCat(col)) b.categoriaId = col; }
  else if(sec === 'projeto'){ const p = getItem(r.id); Object.assign(b, {tipo:'tarefa', secao:'tarefas', projetoId:p ? p.id : null}); if(statusPorId('tarefa', col)) b.status = col; }
  else if(sec === 'tarefas'){
    // em Tarefas, a entrega padrão é o dia de hoje (no agrupamento por faixa, o primeiro dia da faixa; em "Sem data", nenhuma)
    Object.assign(b, {tipo:'tarefa', secao:'tarefas', dataEntrega:hojeISO()});
    const ag = state.prefs.tarefas.agrupar === 'nenhum' ? 'status' : state.prefs.tarefas.agrupar;

/**
 * Lista responsiva. Grade de colunas no desktop quando cabe; senão (ou no mobile), lista de cards — sem rolagem lateral.
 * conteudo: {itens} ou {grupos:[{chave, nome, itens, sempre}]}. ctx: {motivoFn, acaoLinha, rodape, vazioGrupo, podeAdicionar(chave), addFlat}
 */
function listaHTML(sec, conteudo, ctx){
  ctx = ctx || {};
  const quebra = state.prefs.listaQuebra;
  const grupos = conteudo.grupos ? conteudo.grupos.filter(g => g.itens.length || g.sempre || (ctx.podeAdicionar && state.ui.addCol && state.ui.addCol.sec === sec && state.ui.addCol.col === g.chave)) : null;
  const addAberto = col => state.ui.addCol && state.ui.addCol.sec === sec && state.ui.addCol.col === col;
  const rodapeAdd = (col, nome) => addAberto(col) ? '<div class="add-row">' + rascunhoHTML(sec, col, nome) + '</div>'
    : (ctx.podeAdicionar && ctx.podeAdicionar(col)) || (col === '__todos' && ctx.addFlat) ? '<div class="add-row">' + botaoAdicionar(sec, col, 'add-grupo') + '</div>' : '';
  // colunas que não se aplicam a nenhuma linha desta visão ficam de fora (ex.: Progresso em Tarefas)
  const todosItens = grupos ? grupos.reduce((a, g) => a.concat(g.itens), []) : conteudo.itens;
  const cols = layoutVisivel('lista').filter(cid => cid === 'titulo' || !todosItens.length || todosItens.some(it => campoAplica(campoDef(cid), it)));
  const acoesW = ctx.acaoLinha ? 128 : 40;
  const extras = acoesW + cols.length * 10 + 26;
  const util = larguraUtil(), L = state.prefs.larguras || {};
  // larguras definidas pelo usuário: exatas; com quebra de linha, reduzidas em proporção se não couberem na tela
  const fixos = cols.reduce((s, c) => s + (L[c] || 0), 0);
  const minsLivres = cols.reduce((s, c) => s + (L[c] ? 0 : larguraCol(c, quebra)[0]), 0);
  const fator = quebra && fixos && fixos + minsLivres + extras > util ? Math.max(.1, (util - minsLivres - extras) / fixos) : 1;
  const larg = cols.map(function(c){
    if(!L[c]) return larguraCol(c, quebra);
    const w = Math.max(56, Math.floor(L[c] * fator));
    return [w, w + 'px'];
  });
  const minw = larg.reduce((s, l) => s + l[0], 0) + extras;
  // grade só quando há espaço; com quebra de linha, se não couber, vira cards (tudo visível, sem rolagem lateral)
  const usarGrade = ehDesktop() && (!quebra || minw <= util);
  if(!usarGrade){
    const card = it => cardHTML(it, {layout:'lista', motivo: ctx.motivoFn ? ctx.motivoFn(it) : null, rodape:ctx.rodape});
    const bloco = (its, col, nome) => (its.length ? '<div class="cards">' + its.map(card).join('') + '</div>' : (addAberto(col) ? '' : '<p class="muted" style="padding:4px 6px">' + esc(ctx.vazioGrupo || 'Nada aqui') + '</p>')) + rodapeAdd(col, nome);
    const corpo = grupos ? grupos.map(g => grupo(sec, g.chave, g.nome, bloco(g.itens, g.chave, g.nome), g.itens.length)).join('') : bloco(conteudo.itens, '__todos', 'lista');
    return '<div class="lista-m' + (quebra ? ' quebra' : '') + '">' + corpo + '</div>';
  }
  const gtc = larg.map(l => l[1]).concat([acoesW + 'px']).join(' ');
  const p = state.prefs[sec] || {};
  const head = '<div class="lhead">' + cols.map(function(cid, i){
    const k = chaveOrdem(cid), nome = nomeCampo(cid);
    const ativa = k && p.ordem && p.ordem.indexOf(k + '-') === 0;
    const rot = k && p.ordem ? '<button type="button" data-act="ord-col" data-sec="' + sec + '" data-o="' + esc(k) + '" aria-label="Ordenar por ' + esc(nome) + '">' + esc(nome) + (ativa ? ic(/-desc$/.test(p.ordem) ? 'arrowD' : 'arrowU', 12) : '') + '</button>' : esc(nome);
    const w = state.prefs.larguras[cid];
    return '<div>' + rot + '<span class="rsz" data-rsz="' + esc(cid) + '" data-i="' + i + '" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Largura da coluna ' + esc(nome) + ' (setas ajustam, Delete restaura)"' +
      (w ? ' aria-valuenow="' + w + '"' : '') + ' title="Arraste para ajustar · duplo clique restaura"></span></div>';
  }).join('') + '<div class="lacoes"><span class="sr-only">Ações</span></div></div>';
  const linha = function(it, sub){
    const m = ctx.motivoFn && !sub ? ctx.motivoFn(it) : null;
    const cells = cols.map(function(cid){
      const pc = pecaCampo(it, cid, 'lista');
      let h = pc ? pc.h : '';
      if(cid === 'titulo') h = '<div class="c-trow">' + btnConcluir(it) + '<div style="flex:1;min-width:0">' + h + linhaMotivo(m, 'cell-motivo') +
        (ehProxima(it) && cols.indexOf('tipo') === -1 ? '<span class="c-prox" style="margin-top:3px">' + ic('play', 11) + 'Próxima</span>' : '') +
        (semProxima(it) && cols.indexOf('proximaAcao') === -1 ? alertaProxima(it) : '') + '</div></div>';
      return '<div class="lcell">' + h + '</div>';
    }).join('');
    const acao = ctx.acaoLinha && !sub ? ctx.acaoLinha(it) : '';
    let h = '<div class="lrow' + (sub ? ' sub' : '') + (ehLembrete(it) ? ' lemb' : '') + (concluido(it) ? ' done' : '') + '">' + cells + '<div class="lcell lacoes">' + acao + btnMenu(it) + '</div></div>';
    if(!sub && it.tipo === 'projeto' && state.ui.expandidos.has(it.id)){
      const ts = tarefasDoProjeto(it);
      h += ts.length ? ts.map(t => linha(t, true)).join('') : '<div class="lrow sub"><div class="lcell muted">Nenhuma tarefa neste projeto.</div></div>';
    }
    return h;
  };
  const bloco = (its, col, nome) => (its.length ? its.map(it => linha(it)).join('') : (addAberto(col) ? '' : '<p class="muted" style="padding:10px 12px">' + esc(ctx.vazioGrupo || 'Nada aqui') + '</p>')) + (rodapeAdd(col, nome) ? '<div style="padding:0 12px">' + rodapeAdd(col, nome) + '</div>' : '');
  const corpo = grupos ? grupos.map(g => grupo(sec, g.chave, g.nome, bloco(g.itens, g.chave, g.nome), g.itens.length)).join('') : bloco(conteudo.itens, '__todos', 'lista');
  return '<div class="lista-wrap"><div class="lista' + (quebra ? ' quebra' : '') + '" style="--minw:' + minw + 'px;--gtc:' + gtc + '">' + head + corpo + '</div></div>';
}
function grupo(sec, chave, titulo, corpo, n){
  const col = ((state.prefs[sec] && state.prefs[sec].colapsados) || []).indexOf(chave) !== -1;

/**
 * Kanban. cols: [{chave, nome, cor, itens}]. ctx: {dropKind, statusTipo (colunas = status editáveis), motivoFn, semAdicionar, podeAdicionar(chave)}
 */
function kanbanHTML(sec, cols, ctx){
  const colunas = cols.map(function(c){
    const cards = c.itens.map(it => cardHTML(it, {layout:'kanban', arrastavel:true, motivo: ctx.motivoFn ? ctx.motivoFn(it) : null})).join('');

        (c.foraPeriodo ? '<span class="fora-periodo" title="Faixa fora do período do filtro: só aparecem aqui os cards que você acabou de mover">fora do período</span>' : '') +
        '<span class="cnt">' + c.itens.length + '</span></div>';
    const addAberto = state.ui.addCol && state.ui.addCol.sec === sec && state.ui.addCol.col === c.chave;
    const pode = !ctx.semAdicionar && (!ctx.podeAdicionar || ctx.podeAdicionar(c.chave));
    // "+ Adicionar" abre um card-rascunho na coluna, já mostrando o que o item vai herdar
    const rasc = addAberto ? rascunhoHTML(sec, c.chave, c.nome) : '';
    const pe = !addAberto && pode ? botaoAdicionar(sec, c.chave) : '';
    // coluna de conclusão: concluídos ficam ocultos; o link liga o filtro "Ver concluídos" desta seção
    const temFiltro = state.prefs[sec] && 'concluidos' in state.prefs[sec];
    const nConc = temFiltro && ctx.statusTipo && c.chave === statusFinal(ctx.statusTipo).id ? contaConcluidos(sec) : 0;
    const linkConc = nConc ? '<button type="button" class="kcol-conc" data-act="tog-concl" data-sec="' + sec + '" aria-pressed="' + state.prefs[sec].concluidos + '">' + ic('checkSq', 14) +
      (state.prefs[sec].concluidos ? 'Ocultar concluídos' : 'Ver ' + nConc + ' concluído' + (nConc > 1 ? 's' : '')) + '</button>' : '';
    return '<div class="kcol" data-drop="1" data-drop-kind="' + esc(ctx.dropKind || '') + '" data-drop-col="' + esc(c.chave) + '" role="group" aria-label="' + esc(c.nome) + '">' +
      head + '<div class="kcol-body">' + (cards || (rasc || linkConc ? '' : '<p class="muted" style="padding:6px 4px 10px">Nada aqui</p>')) + rasc + linkConc + '</div>' + (pe ? '<div class="kcol-foot">' + pe + '</div>' : '') + '</div>';
  }).join('');
  // celular: abas fixas com nome e contagem de cada coluna (tocar leva à coluna); os pontos reforçam a posição
  const abas = '<div class="ktabs" role="tablist" aria-label="Colunas">' + cols.map((c, i) => '<button type="button" role="tab" data-act="ktab" data-i="' + i + '" aria-current="' + (i === 0) + '">' +
    (c.cor ? '<span class="cdot" style="background:' + esc(c.cor) + '"></span>' : '') + esc(c.nome) + '<span class="cnt">' + c.itens.length + '</span></button>').join('') + '</div>';
  const dots = cols.map((c, i) => '<i class="' + (i === 0 ? 'on' : '') + '"></i>').join('');
  return abas + '<div class="kdots" aria-hidden="true">' + dots + '</div>' +
    '<div class="kanban">' + colunas + '</div>';
}

/** Ordens da seção, com "Personalizada" quando já existe uma ordem arrastada no Foco. */
function opcoesOrdem(sec){
  const l = (ORDENS[sec] || []).slice(), p = state.prefs[sec];

const AGRUPAR = {

function rotuloOrdem(sec){
  if(state.prefs[sec].ordem === 'manual') return 'Personalizada';
  const o = (ORDENS[sec] || []).find(x => x[0] === state.prefs[sec].ordem);
  if(o) return o[1];
  const k = (state.prefs[sec].ordem || '').replace(/-(asc|desc)$/, '');
  const cid = ['titulo','status','categoriaId','projetoId','dataLembrete','dataEntrega','progresso','comentarios','tipo','ultimaAtualizacao'].find(c => chaveOrdem(c) === k) || (k.indexOf('x:') === 0 ? k.slice(2) : null);
  return cid ? nomeCampo(cid) + (/-desc$/.test(state.prefs[sec].ordem) ? ' (decrescente)' : '') : 'Personalizada';

function rotuloAgrupar(sec){ const a = (AGRUPAR[sec] || []).find(x => x[0] === state.prefs[sec].agrupar); return a ? a[1] : 'Status'; }

function btnVisao(sec){

function ferramentas(sec){

   MÓDULO 15 — FILTROS
   ========================================================================= */
function contaFiltrosHoje(){
  const p = state.prefs.hoje;
  return (p.periodo !== 'hoje-vencidos' ? 1 : 0) + (p.datas.length !== 2 ? 1 : 0) + (p.tipos.length !== 3 ? 1 : 0) + (p.categorias.length ? 1 : 0);
}
function contaFiltros(sec){
  const p = state.prefs[sec]; if(!p) return 0;
  let n = 0;
  ['tipos','statusF','categorias','projetosF'].forEach(k => { if(p[k] && p[k].length) n++; });
  if(p.dtIni || p.dtFim) n++;
  if(sec === 'tarefas' && p.vinculo !== 'todas') n++;
  if(sec === 'tarefas' && p.lembF !== 'todas') n++;
  return n;
}
function chipX(acao, attrs, rot){ return '<button type="button" class="x" data-act="' + acao + '" ' + attrs + ' aria-label="Remover filtro ' + esc(rot) + '">' + ic('x',11) + '</button>'; }
function chipsFiltrosHoje(){
  const p = state.prefs.hoje, out = [];
  const perNome = (PERIODOS.find(x => x[0] === p.periodo) || PERIODOS[0])[1];
  const perTxt = p.periodo === 'personalizado' ? (p.custIni ? fmtCurta(p.custIni) : '…') + ' a ' + (p.custFim ? fmtCurta(p.custFim) : '…') : perNome;
  out.push('<span class="chip">' + ic('calendar',12) + 'Período: ' + esc(perTxt) + (p.periodo !== 'hoje-vencidos' ? chipX('rm-filtro','data-sec="hoje" data-f="periodo"','período') : '') + '</span>');

function aplicaFiltros(arr, sec){
  const p = state.prefs[sec];
  return arr.filter(function(it){
    if(p.tipos && p.tipos.length && p.tipos.indexOf(it.tipo || 'sem') === -1) return false;
    if(p.statusF && p.statusF.length && p.statusF.indexOf(it.status) === -1) return false;
    if(p.categorias && p.categorias.length && p.categorias.indexOf(it.categoriaId || 'sem') === -1) return false;
    if(p.projetosF && p.projetosF.length && p.projetosF.indexOf(it.projetoId || 'sem') === -1) return false;
    if(sec === 'tarefas' && p.lembF === 'lemb' && !ehLembrete(it)) return false;
    if(sec === 'tarefas' && p.lembF === 'comuns' && ehLembrete(it)) return false;
    if(p.dtIni || p.dtFim){
      const ds = [it.dataLembrete, it.dataEntrega].filter(Boolean);
      if(!ds.some(d => (!p.dtIni || d >= p.dtIni) && (!p.dtFim || d <= p.dtFim))) return false;
    }
    return true;
  });
}

/* ---------- ENTRADA (triagem + Futuro) ---------- */
function rodapeTriagem(it){
  const t = esc(it.titulo);
  return '<span class="muted">Transformar em</span>' +
    '<button type="button" class="btn-acao" data-act="triagem" data-id="' + it.id + '" data-tipo="tarefa" aria-label="Transformar “' + t + '” em tarefa">' + ic('checkSq',14) + 'Tarefa</button>' +
    '<button type="button" class="btn-acao" data-act="triagem" data-id="' + it.id + '" data-tipo="projeto" aria-label="Transformar “' + t + '” em projeto">' + ic('folder',14) + 'Projeto</button>' +
    '<button type="button" class="btn-acao" data-act="futuro" data-id="' + it.id + '" aria-label="Classificar “' + t + '” no Futuro">' + ic('archive',14) + 'Futuro</button>' +
    '<button type="button" class="btn-acao" data-act="descartar" data-id="' + it.id + '" aria-label="Descartar “' + t + '” (vai para a lixeira por ' + DIAS_LIXEIRA + ' dias)">' + ic('trash',14) + 'Descartar</button>' +
    '<span class="sp"></span>' + btnMenu(it);
}
function viewEntrada(){
  if(state.prefs.entrada.aba === 'futuro') return viewFuturo();
  const lista = filtraBusca(items().filter(i => i.secao === 'entrada')).sort((a,b) => a.criadoEm < b.criadoEm ? 1 : -1);
  const nf = contadores().futuro;
  if(!lista.length){
    if(state.ui.busca.trim().length >= 2) return vazio('search', 'Nada na triagem com essa busca', '', btnLimparBusca());
    return vazio('inbox', 'Entrada zerada 🎉', 'Capture uma ideia e faça a triagem depois, com calma.',
      '<button type="button" class="btn prim" data-act="captura">' + ic('plus',15) + 'Capturar item</button>' +
      (nf ? '<button type="button" class="btn" data-act="aba-entrada" data-v="futuro">' + ic('archive',15) + 'Ver Futuro (' + nf + ')</button>' : ''));
  }
  const toque = ehToque();
  // no primeiro uso com toque, o primeiro card "espia" para os lados para mostrar o gesto
  const espiar = toque && !state.prefs.dicas.swipe;
  const cards = lista.map((it, i) =>
    '<div class="swipe-wrap"><div class="swipe-bg" aria-hidden="true"><span>' + ic('split',14) + 'Triagem</span><span>Futuro' + ic('archive',14) + '</span></div>' +
    '<div class="swipe-el' + (espiar && i === 0 ? ' espiar' : '') + '" data-swipe-id="' + it.id + '">' + cardHTML(it, {layout:'lista', topo:'<div class="c-meta">' + ic('clock',12) + 'Capturado ' + esc(tempoRelativo(it.criadoEm)) + '</div>', rodape:rodapeTriagem}) + '</div></div>').join('');
  if(espiar){ state.prefs.dicas.swipe = true; persistirPrefs(); }
  return 
    '<p class="hint" style="margin:0 0 10px">' + ic('info',13) + '<span>' + (toque ? 'Deslize o card para a direita para fazer a triagem ou para a esquerda para classificar no Futuro — ou use os botões do card. Dá para desfazer.' : 'Transforme cada item em tarefa ou projeto, classifique no Futuro ou descarte (fica ' + DIAS_LIXEIRA + ' dias na lixeira).') + '</span></p>' +
    '<div class="cards lista-m">' + cards + '</div>';

function acaoFuturo(it){
  return it.tipo
    ? '<button type="button" class="btn-acao" data-act="ativar" data-id="' + it.id + '" aria-label="Ativar “' + esc(it.titulo) + '” em ' + (it.tipo === 'projeto' ? 'Projetos' : 'Tarefas') + '">' + ic('arrowR',14) + 'Ativar</button>'

function viewFuturo(){
  const p = state.prefs.entrada;
  const lista = ordenar(filtraBusca(aplicaFiltros(items().filter(i => i.secao === 'futuro'), 'entrada')), p.ordem);
  if(!lista.length){
    if(contaFiltros('entrada') || state.ui.busca.trim().length >= 2) return vazio('filter', 'Nada no Futuro com esses filtros', '', (contaFiltros('entrada') ? btnLimparFiltros('entrada') : '') + (state.ui.busca ? btnLimparBusca() : ''));
    return vazio('archive', 'Nada no Futuro', 'Use “Classificar no Futuro” em qualquer item para tirá-lo do radar sem perdê-lo.',
      '<button type="button" class="btn" data-act="aba-entrada" data-v="triagem">' + ic('inbox',15) + 'Voltar para a triagem</button>');
  }
  const ctx = {acaoLinha:acaoFuturo, rodape: it => acaoFuturo(it) + '<span class="sp"></span>' + btnMenu(it)};
  const intro = '<p class="hint" style="margin:0 0 10px">' + ic('info',13) + '<span>Itens que você não vai ver agora. Ative quando chegar a hora.</span></p>';
  if(p.agrupar === 'categoria'){

    return intro + listaHTML('entrada', {grupos}, ctx);
  }
  return intro + listaHTML('entrada', {itens:lista}, ctx);
}

/* ---------- HOJE ---------- */
function viewHoje(){
  const p = state.prefs.hoje;
  const lista = ordenar(filtraBusca(itensHoje()), p.ordem, ctxOrdem('hoje', {motivo:motivoHoje}));
  if(!lista.length){
    if(state.ui.busca.trim().length >= 2) return vazio('search', 'Nada em Hoje com essa busca', '', btnLimparBusca());
    const semFiltroExtra = p.datas.length === 2 && p.tipos.length === 3 && !p.categorias.length;
    return vazio('sparkle', semFiltroExtra ? 'Nada para hoje 🎉' : 'Nada com esses filtros', semFiltroExtra ? 'Nenhum item com data no período selecionado.' : 'Tente ampliar o período ou remover filtros.',
      (p.periodo !== 'prox7' ? '<button type="button" class="btn prim" data-act="set-periodo" data-v="prox7">' + ic('calendar',15) + 'Ver os próximos 7 dias</button>' : '') + (contaFiltrosHoje() ? btnLimparFiltros('hoje') : ''));
  }
  const porFaixa = f => lista.filter(it => faixaDe(motivoHoje(it).iso) === f);
  if(p.visao === 'foco'){
    // no Foco, o que acabou de ser concluído desce para "Concluídas" em vez de sumir
    const feitos = items().filter(it => state.ui.recemConcluidos.has(it.id) && concluido(it) && ativo(it) && motivoHoje(it));
    return focoHTML('hoje', lista.concat(feitos), {faixaFn: it => faixaDe(motivoHoje(it).iso), placeholder:'Adicionar tarefa para hoje'});
  }
  if(p.visao === 'kanban'){
    const cols = FAIXAS.map(f => ({chave:f[0], nome:f[1], itens:porFaixa(f[0]), foraPeriodo:!faixaNoPeriodo(f[0])}));
    return '<p class="hint" style="margin:0 0 8px">' + ic('info',13) + '<span>Arraste um card para outra faixa para reagendar a data que o trouxe para cá. Cards movidos para fora do período continuam visíveis até você sair da tela.</span></p>' +
      kanbanHTML('hoje', cols, {dropKind:'faixa', motivoFn:motivoHoje, podeAdicionar: k => k !== 'vencidos'});
  }
  return listaHTML('hoje', {grupos: FAIXAS.map(f => ({chave:f[0], nome:f[1], itens:porFaixa(f[0])}))}, {motivoFn:motivoHoje, podeAdicionar: k => k !== 'vencidos'});
}
