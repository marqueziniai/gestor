/* =========================================================================
   MÓDULO 21 — RENDER E INICIALIZAÇÃO
   ========================================================================= */
function aplicarTema(){
  const t = state.prefs.tema;
  const escuro = t === 'escuro' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
  // barra do sistema (PWA/celular) na cor do app, mesmo com o tema escolhido à mão
  $$('meta[name="theme-color"]').forEach(m => m.setAttribute('content', escuro ? '#0b0c0f' : '#f6f7f9'));
}
/** Kanban no celular: pontos e abas acompanham a coluna visível. */
function ligaDots(kb){
  const dots = kb.previousElementSibling && kb.previousElementSibling.classList.contains('kdots') ? kb.previousElementSibling : null;
  const abas = dots && dots.previousElementSibling && dots.previousElementSibling.classList.contains('ktabs') ? dots.previousElementSibling : null;
  if(!dots) return;
  let ultimo = -1;
  const upd = function(){
    const cols = Array.from(kb.children); if(!cols.length) return;
    const centro = kb.scrollLeft + kb.clientWidth/2;
    let melhor = 0, dist = Infinity;
    cols.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - centro); if(d < dist){ dist = d; melhor = i; } });
    if(melhor === ultimo) return;
    ultimo = melhor;
    Array.from(dots.children).forEach((d, i) => d.classList.toggle('on', i === melhor));
    if(abas){
      Array.from(abas.children).forEach((b, i) => b.setAttribute('aria-current', String(i === melhor)));
      const b = abas.children[melhor];
      if(b) abas.scrollTo({left: b.offsetLeft - (abas.clientWidth - b.offsetWidth) / 2, behavior:'smooth'});
    }
  };
  kb.addEventListener('scroll', upd, {passive:true});
  upd();
}
/** Descrições e comentários cortados ganham um "mais" discreto (só quando há mesmo texto escondido). */
function marcarTruncados(raiz){
  $$('.c-desc, .c-ult', raiz || $('#view')).forEach(function(el){
    el.classList.toggle('trunc', el.scrollHeight > el.clientHeight + 2);
  });
}
function renderView(){
  const vp = $('#view');
  const kb0 = $('.kanban', vp), kl = kb0 ? kb0.scrollLeft : 0;
  const lw0 = $('.lista-wrap', vp), ll = lw0 ? lw0.scrollLeft : 0;
  vp.innerHTML = viewHTML();
  const kb = $('.kanban', vp); if(kb){ kb.scrollLeft = kl; ligaDots(kb); }
  const lw = $('.lista-wrap', vp); if(lw) lw.scrollLeft = ll;
  const inp = $('#addColInput'); if(inp) inp.focus({preventScroll:true});
  $$('textarea.inp-title, #view [data-composer]').forEach(autoTam);
  marcarTruncados(vp);
}
function render(){
  if(ptrPressionado && Date.now() - ptrDesde < 1500){ renderPendente = true; return; }
  renderPendente = false;
  // quebrar linhas vale para todas as seções e visões (e para menus e o menu lateral)
  document.documentElement.classList.toggle('quebra', !!state.prefs.listaQuebra);
  const ativoEl = document.activeElement;
  const emOverlay = ativoEl && ativoEl.closest && ativoEl.closest('#popRoot,#menuRoot,#sheetRoot');
  const sel = state.ui.focar || (!emOverlay ? seletorDe(ativoEl) : null);
  const escopo = ativoEl && ativoEl.closest ? (ativoEl.closest('#panel') ? '#panel' : ativoEl.closest('#view') ? '#view' : ativoEl.closest('#topbar') ? '#topbar' : ativoEl.closest('#sidebar') ? '#sidebar' : null) : null;
  state.ui.focar = null;
  renderSidebar(); renderBottombar(); renderTopbar(); renderView(); renderPanel();
  atualizaSheet();
  $$('#panel textarea.inp-title, #panel [data-composer]').forEach(autoTam);
  document.documentElement.style.setProperty('--tb-h', $('#topbar').offsetHeight + 'px');   // abas do kanban grudam logo abaixo
  if(sel){
    let alvo = null;
    try{ alvo = (escopo && $(escopo + ' ' + sel)) || $(sel); }catch(err){ alvo = null; }
    if(alvo && alvo !== document.activeElement && !(popAtual || menuAtual)) alvo.focus({preventScroll:true});
  }
  // microinteração de concluir: anima o círculo do item recém-concluído
  if(state.ui.animarChk){
    const id = state.ui.animarChk; state.ui.animarChk = null;
    $$('.chk[data-id="' + id + '"]').forEach(function(b){ b.classList.remove('anim'); void b.offsetWidth; b.classList.add('anim'); });
  }
}
function aoMudarHash(){
  const antes = state.ui.rota;
  state.ui.rota = parseHash();
  if(antes.view !== state.ui.rota.view || antes.id !== state.ui.rota.id){
    state.ui.recemConcluidos.clear(); state.ui.fixadosHoje = {}; state.ui.addCol = null; window.scrollTo(0, 0);
    $('#topbar').classList.remove('recolhida');
    if(state.ui.rota.view !== 'concluidos') state.ui.buscaConcl = '';
  }
  if(!state.ui.rota.item) state.ui.painelEmpurrado = false;
  state.ui.editandoCmt = null;
  fecharMenu(true); fecharPop(true); esconderTip();
  render();
}
/** Teclado virtual (visualViewport): expõe altura visível e deslocamento para o painel e os sheets. */
function ajustaTeclado(){
  const vv = window.visualViewport; if(!vv) return;
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  const raiz = document.documentElement.style;
  raiz.setProperty('--kb', kb + 'px');
  raiz.setProperty('--vv-h', Math.round(vv.height) + 'px');
  raiz.setProperty('--vv-top', Math.round(vv.offsetTop) + 'px');
  document.documentElement.classList.toggle('teclado', kb > 80);
}
/** Celular: ao rolar para baixo, ferramentas e chips da topbar recolhem; ao rolar para cima, voltam. */
function ligaRecolherTopbar(){
  let ultimoY = window.scrollY, acumulado = 0, trava = 0;
  window.addEventListener('scroll', function(){
    const y = window.scrollY, tb = $('#topbar');
    const dy = y - ultimoY; ultimoY = y;
    if(!ehCelular() || Date.now() < trava){ return; }
    if(y < 40){ if(tb.classList.contains('recolhida')){ tb.classList.remove('recolhida'); trava = Date.now() + 260; } acumulado = 0; return; }
    // página curta não recolhe (evita o vaivém quando a altura muda)
    if(document.documentElement.scrollHeight - window.innerHeight < 220) return;
    acumulado = (Math.sign(dy) === Math.sign(acumulado) ? acumulado : 0) + dy;
    if(acumulado > 28 && !tb.classList.contains('recolhida')){ tb.classList.add('recolhida'); trava = Date.now() + 260; acumulado = 0; }
    else if(acumulado < -28 && tb.classList.contains('recolhida')){ tb.classList.remove('recolhida'); trava = Date.now() + 260; acumulado = 0; }
  }, {passive:true});
}
function boot(){
  carregar();
  persistirPrefs();
  aplicarTema();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(state.prefs.tema === 'auto') aplicarTema(); });
  nuvemLerRetornoEmail();   // link de recuperação de senha: tira os tokens do endereço antes do roteamento
  if(!location.hash) history.replaceState(null, '', '#/hoje');
  state.ui.rota = parseHash();
  window.addEventListener('hashchange', aoMudarHash);
  window.addEventListener('popstate', aoPopState);          // "voltar" do sistema fecha sheet, menu e popover
  document.addEventListener('pointerdown', e => { ptrPressionado = true; ptrDesde = Date.now(); ultimoPonteiro = e.pointerType || 'mouse'; esconderTip(); }, true);
  const solta = () => { ptrPressionado = false; if(renderPendente){ renderPendente = false; setTimeout(render, 0); } };
  document.addEventListener('pointerup', solta, true);
  document.addEventListener('pointercancel', solta, true);
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
  document.addEventListener('touchmove', e => { if(ptr && ptr.ativo) e.preventDefault(); }, {passive:false});
  let faixaLarg = window.innerWidth >= 1024 ? 2 : window.innerWidth >= 768 ? 1 : 0, larguraAnt = window.innerWidth, tmr = null;
  window.addEventListener('resize', function(){
    clearTimeout(tmr);
    tmr = setTimeout(function(){
      const f = window.innerWidth >= 1024 ? 2 : window.innerWidth >= 768 ? 1 : 0;
      if(f !== faixaLarg){ faixaLarg = f; fecharPop(true); fecharMenu(true); render(); }
      else { posicionarPop(); if(Math.abs(window.innerWidth - larguraAnt) > 24 && !popAtual && !menuAtual) render(); }   // a lista decide se a grade cabe
      larguraAnt = window.innerWidth;
    }, 150);
  });
  $('#fab').innerHTML = ic('plus', 26);
  $('#fab').addEventListener('click', sheetCaptura);
  $('#scrim').addEventListener('click', function(){ if(sheetAtual) fecharSheet(); else if(state.ui.rota.item) fecharPainel(); });
  $('#scrimPop').addEventListener('click', () => fecharPop());
  $('#scrimMenu').addEventListener('click', () => fecharMenu());
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', ajustaTeclado);
    window.visualViewport.addEventListener('scroll', ajustaTeclado);
    ajustaTeclado();
  }
  ligaRecolherTopbar();
  render();
  registrarServiceWorker();
  nuvemIniciar();
}
/** PWA: funciona offline e abre em tela cheia quando instalado (só em http/https; aberto como arquivo, não há service worker). */
function registrarServiceWorker(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  // dentro de um iframe (pré-visualização de editores como o Lovable) não registra: evita servir cópia velha no preview
  let emIframe = true;
  try{ emIframe = window.self !== window.top; }catch(e){}
  if(emIframe) return;
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker não registrado', err));
}
document.addEventListener('DOMContentLoaded', boot);
</script>
