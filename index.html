function lerLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function carregar(){
  let d = null, p = null;
  try{ d = JSON.parse(lerLS(LS_DADOS) || 'null'); }catch(e){ d = null; }
  try{ p = JSON.parse(lerLS(LS_PREFS) || 'null'); }catch(e){ p = null; }
  state.prefs = lerPrefs(p);
  if(d && Array.isArray(d.items) && Array.isArray(d.categorias)) state.dados = migrarDados(d, Number(lerLS(LS_VER) || 1));
  else state.dados = dadosExemplo();
  normalizarDados();
  persistir();
}
function lerPrefs(p){
  if(!p || [2,3,4].indexOf(p.versao) === -1){
    const n = prefsPadrao();
    if(p && p.tema) n.tema = p.tema;
    return n;
  }
  if(p.versao < 4) migrarPrefsV4(p);
  const n = mescla(p, prefsPadrao());
  n.larguras = Object.assign({}, p.larguras || {});
  return n;
}
/** Preferências até a v3: "acomp" vira "lemb"; quebra de linha e ordem por entrega na página do projeto passam a ser o padrão. */
function migrarPrefsV4(p){
  const troca = v => v === 'acomp' ? 'lemb' : v;
  if(p.hoje) ['datas','tipos'].forEach(k => { if(Array.isArray(p.hoje[k])) p.hoje[k] = p.hoje[k].map(troca); });
  Object.keys(p).forEach(k => { const s = p[k]; if(s && typeof s === 'object' && typeof s.ordem === 'string') s.ordem = s.ordem.replace(/^acomp-/, 'lemb-'); });
  if(p.tarefas && p.tarefas.acompF) p.tarefas.lembF = p.tarefas.acompF === 'acomp' ? 'lemb' : p.tarefas.acompF;
  if(p.projeto && p.projeto.ordem === 'status-asc') p.projeto.ordem = 'entrega-asc';
  const L = p.larguras || {};
  [['dataAcompanhamento','dataLembrete'],['textoAcompanhamento','textoLembrete']].forEach(function(r){ if(L[r[0]]){ L[r[1]] = L[r[0]]; delete L[r[0]]; } });
  p.listaQuebra = true;
  p.versao = 4;
}
function migrarDados(d, versao){
  if(versao < 2) d = migrarDaVersao1(d);
  if(versao < 3) d = migrarParaV3(d);
  return d;
}
/** v2 → v3: "acompanhamento" vira "lembrete" (campos, subtipo, recorrência, títulos, estrutura e layouts). */
function migrarParaV3(d){
  const ren = {dataAcompanhamento:'dataLembrete', textoAcompanhamento:'textoLembrete'};
  const nomes = {dataAcompanhamento:['Data Acompanhamento','Data Lembrete'], textoAcompanhamento:['Texto do acompanhamento','Texto do lembrete']};
  d.items.forEach(function(it){
    Object.keys(ren).forEach(function(k){ if(k in it){ it[ren[k]] = it[k]; delete it[k]; } });
    if(it.recorrencia && 'dataAcompanhamento' in it.recorrencia){ it.recorrencia.dataLembrete = it.recorrencia.dataAcompanhamento; delete it.recorrencia.dataAcompanhamento; }
    if(it.subtipo === 'acompanhamento') it.subtipo = 'lembrete';
  });
  // "Acompanhar: X" vira o próprio título da origem (o tipo Lembrete já aparece no card)
  d.items.forEach(function(it){
    if(it.subtipo !== 'lembrete' || !/^Acompanhar: /.test(it.titulo)) return;
    it.titulo = it.titulo.replace(/^Acompanhar: /, '');
  });
  // o histórico passa a falar em lembrete
  const troca = s => typeof s !== 'string' ? s : s.replace(/Data Acompanhamento/g, 'Data Lembrete').replace(/Texto do acompanhamento/g, 'Texto do lembrete')
    .replace(/([Tt])arefa de acompanhamento criada/g, (m, t) => (t === 'T' ? 'L' : 'l') + 'embrete criado')
    .replace(/[Tt]arefa de acompanhamento/g, m => m[0] === 'T' ? 'Lembrete' : 'lembrete').replace(/Acompanhar: /g, '').replace(/Acompanhamentos/g, 'Lembretes')
    .replace(/Acompanhamento/g, 'Lembrete').replace(/acompanhamentos/g, 'lembretes').replace(/acompanhamento/g, 'lembrete');
  d.items.forEach(it => (it.atividade || []).forEach(function(a){
    if(a.kind !== 'log') return;
    a.texto = troca(a.texto); a.rotulo = troca(a.rotulo);
    if(a.icone === 'eye') a.icone = 'bell';
  }));
  const e = d.estrutura;
  if(e){
    (e.campos || []).forEach(function(c){
      if(!ren[c.id]) return;
      if(c.nome === nomes[c.id][0]) c.nome = nomes[c.id][1];
      c.id = ren[c.id];
    });
    Object.keys(e.layouts || {}).forEach(v => (e.layouts[v] || []).forEach(x => { if(ren[x.id]) x.id = ren[x.id]; }));
  }
  return d;
}
/** Coerência depois de carregar ou importar: estrutura, modelos, lixeira, data de conclusão e lembretes. */
function normalizarDados(){
  const d = state.dados;
  d.lixeira = Array.isArray(d.lixeira) ? d.lixeira : [];
  d.modelos = Array.isArray(d.modelos) ? d.modelos : [];
  normalizarEstrutura();
  items().forEach(function(it){
    if(concluido(it)){ if(!it.concluidoEm) it.concluidoEm = dataConclusaoInferida(it); }
    else if(it.concluidoEm) it.concluidoEm = null;
  });
  // a estrutura em uso passa a ser o modelo "Padrão"
  if(!d.modelos.length){
    d.modelos.push({id:'mdl-padrao', nome:'Padrão', padrao:true, criadoEm:agoraISO(), atualizadoEm:agoraISO(), estrutura:clone(d.estrutura)});
    d.modeloAtivo = 'mdl-padrao';
  }
  if(!d.modelos.some(m => m.padrao)) d.modelos[0].padrao = true;
  limparLixeiraAntiga();
  reconciliarTodos();
}
/** Itens concluídos antes da v3 não tinham data de conclusão: usa o último registro de conclusão do histórico. */
function dataConclusaoInferida(it){
  const final = statusFinal(it.tipo).nome;
  const logs = it.atividade.filter(a => a.kind === 'log' && ((/^Status/.test(a.rotulo || '') && a.para === final) || /conclu|encerrad/i.test(a.texto || '')));
  return logs.length ? logs[logs.length - 1].em : (it.atualizadoEm || it.criadoEm);
}

/** Converte dados salvos pela versão 1 (nomes de seção antigos, status por nome, terceira data). */
function migrarDaVersao1(d){
  const secao = {inbox:'entrada', backlog:'futuro', projects:'projetos', tasks:'tarefas'};
  const est = estruturaPadrao();
  const porNome = (tipo, nome) => { const s = est.status[tipo].find(x => normaliza(x.nome) === normaliza(nome)); return s ? s.id : est.status[tipo][0].id; };
  const titulo = id => { const x = d.items.find(i => i.id === id); return x ? x.titulo : 'nenhum'; };
  const cat = id => { const c = (d.categorias||[]).find(c => c.id === id); return c ? c.nome : 'Sem categoria'; };
  const tipoNome = t => t === 'projeto' ? 'Projeto' : t === 'tarefa' ? 'Tarefa' : 'Sem tipo';
  d.items.forEach(function(it){
    const tipoItem = it.tipo;
    it.atividade = (it.atividade || []).filter(a => !(a.kind === 'log' && a.evento === 'dataV1')).map(function(a){
      if(a.kind !== 'log') return a;
      const base = {id:a.id, kind:'log', em:a.em};
      switch(a.evento){
        case 'criado': return Object.assign(base, {icone:'sparkle', texto:'Item criado em ' + (LOCAIS[secao[a.para]] || 'Entrada')});
        case 'status': return Object.assign(base, {icone:'target', rotulo: tipoItem === 'projeto' ? 'Status do projeto' : 'Status da tarefa', de:a.de, para:a.para, nota: a.origem === 'tarefa' ? 'a partir da tarefa “' + (a.origemTitulo||'') + '”' : ''});
        case 'status-projeto': return Object.assign(base, {icone:'folder', rotulo:'Status do projeto' + (a.alvo ? ' “' + a.alvo + '”' : ''), de:a.de, para:a.para});
        case 'dataAcompanhamento': return Object.assign(base, {icone:'clock', rotulo:'Data Acompanhamento', de:a.de, para:a.para, fmt:'data'});
        case 'dataEntrega': return Object.assign(base, {icone:'calendar', rotulo:'Data de Entrega', de:a.de, para:a.para, fmt:'data'});
        case 'projetoId': return Object.assign(base, {icone:'link', rotulo:'Projeto atrelado', de:a.de ? titulo(a.de) : 'nenhum', para:a.para ? titulo(a.para) : 'nenhum'});
        case 'categoriaId': return Object.assign(base, {icone:'tag', rotulo:'Categoria', de:cat(a.de), para:cat(a.para)});
        case 'secao': return Object.assign(base, {icone:'arrowR', rotulo:'Movido', de:LOCAIS[secao[a.de]] || '—', para:LOCAIS[secao[a.para]] || '—'});
        case 'tipo': return Object.assign(base, {icone:'split', rotulo:'Convertido', de:tipoNome(a.de), para:tipoNome(a.para)});
        default: return Object.assign(base, {icone:'history', texto:String(a.evento || 'Alteração')});
      }
    });
    it.secao = secao[it.secao] || it.secao;
    it.status = it.tipo ? porNome(it.tipo, it.status) : null;
    delete it.dataV1;
    it.extras = it.extras || {};
    it.recorrencia = it.recorrencia || {};
    it.subtipo = null; it.origemId = null;
  });
  d.estrutura = est;
  return d;
}

/** Garante coerência da estrutura: um status final por lista, campos de sistema e layouts completos. */
function normalizarEstrutura(){
  const padrao = estruturaPadrao();
  if(!state.dados.estrutura) state.dados.estrutura = padrao;
  const e = state.dados.estrutura;
  ['projeto','tarefa'].forEach(function(t){
    if(!Array.isArray(e.status[t]) || e.status[t].length < 2) e.status[t] = padrao.status[t];
    const finais = e.status[t].filter(s => s.final);
    if(finais.length !== 1){ e.status[t].forEach(s => delete s.final); e.status[t][e.status[t].length-1].final = true; }
  });
  // campos novos (de versões mais recentes) entram logo após o campo que os precede no padrão
  const inserirApos = (lista, novo, idDe, anteriores) => {
    for(let i = anteriores.length - 1; i >= 0; i--){
      const pos = lista.findIndex(x => idDe(x) === anteriores[i]);
      if(pos !== -1){ lista.splice(pos + 1, 0, novo); return; }
    }
    lista.push(novo);
  };
  padrao.campos.forEach(function(cp, i){
    if(!e.campos.find(c => c.id === cp.id)) inserirApos(e.campos, cp, c => c.id, padrao.campos.slice(0, i).map(c => c.id));
  });
  const todos = e.campos.map(c => c.id).concat(CAMPOS_EXIBICAO.map(c => c.id));
  e.layouts = e.layouts || {};
  ['card','kanban','lista'].forEach(function(v){
    let L = e.layouts[v] || padrao.layouts[v];
    L = L.filter(x => todos.indexOf(x.id) !== -1);
    const P = padrao.layouts[v];
    todos.forEach(function(id){
      if(L.find(x => x.id === id)) return;
      const ip = P.findIndex(x => x.id === id);
      if(ip !== -1) inserirApos(L, {id, visivel:P[ip].visivel}, x => x.id, P.slice(0, ip).map(x => x.id));
      else L.push({id, visivel: v === 'card'});
    });
    if(v === 'card') L = L.filter(x => x.id !== 'titulo');
    else { const t = L.find(x => x.id === 'titulo'); if(t) t.visivel = true; }
    e.layouts[v] = L;
  });
}

/* =========================================================================
   MÓDULO 6 — CONSULTAS DE DOMÍNIO
   ========================================================================= */
const items = () => state.dados.items;
const getItem = id => id ? (items().find(i => i.id === id) || null) : null;
const categorias = () => state.dados.categorias;
const getCat = id => categorias().find(c => c.id === id) || null;
const nomeCat = id => { const c = getCat(id); return c ? c.nome : 'Sem categoria'; };
const estr = () => state.dados.estrutura;

/* --- Status (por id; cada tipo tem sua lista independente) --- */
function listaStatus(tipo){ return estr().status[tipo === 'projeto' ? 'projeto' : 'tarefa']; }
function statusPorId(tipo, id){ return listaStatus(tipo).find(s => s.id === id) || null; }
function statusFinal(tipo){ return listaStatus(tipo).find(s => s.final) || listaStatus(tipo)[listaStatus(tipo).length-1]; }
function statusInicial(tipo){ return listaStatus(tipo).find(s => !s.final) || listaStatus(tipo)[0]; }
function nomeStatus(it){ const s = it && it.tipo ? statusPorId(it.tipo, it.status) : null; return s ? s.nome : '—'; }
function concluido(it){ return !!(it && it.tipo) && it.status === statusFinal(it.tipo).id; }
function mapeiaStatus(it, novoTipo){
  if(!it.tipo || !it.status) return statusInicial(novoTipo).id;
  if(concluido(it)) return statusFinal(novoTipo).id;
  const nome = normaliza(nomeStatus(it));
  const igual = listaStatus(novoTipo).find(s => normaliza(s.nome) === nome);
  return igual ? igual.id : statusInicial(novoTipo).id;
}

/* --- Campos --- */
function campos(){ return estr().campos; }
function campoDef(id){ return campos().find(c => c.id === id) || CAMPOS_EXIBICAO.find(c => c.id === id) || null; }
function campoAtivo(id){ const c = campoDef(id); return !!c && c.ativo !== false; }
function nomeCampo(id){ const c = campoDef(id); return c ? c.nome : id; }
/** Rótulo curto de uma data: "Data de Entrega" → "Entrega". */
function rotuloCurto(id){ return nomeCampo(id).replace(/^data( de| do| da)?\s+/i, '').replace(/^./, c => c.toUpperCase()); }
function ehLembrete(it){ return !!it && it.subtipo === 'lembrete'; }
/**
 * O campo se aplica a este item? (tipo, campo ativo, regras de lembrete)
 * form: nos formulários de captura e triagem, quem decide mostrar o texto do lembrete é o próprio formulário.
 */
function campoAplica(c, it, form){
  if(!c || c.ativo === false) return false;
  // o texto do lembrete só aparece quando há uma data de lembrete escolhida
  if(c.id === 'textoLembrete' && !form && !it.dataLembrete) return false;
  if(!it.tipo){
    if(c.id === 'status' || c.id === 'projetoId' || c.id === 'progresso') return false;
    return c.aplica.length === 2 || c.exibicao;
  }
  if(c.aplica.indexOf(it.tipo) === -1) return false;
  // lembrete não tem entrega nem status; o texto dele é a descrição
  if(ehLembrete(it) && (c.id === 'dataEntrega' || c.id === 'textoLembrete' || c.id === 'status')) return false;
  return true;
}
function layout(visao){ return estr().layouts[visao].filter(e => campoAtivo(e.id)); }
function layoutVisivel(visao){ return layout(visao).filter(e => e.visivel).map(e => e.id); }

/* --- Itens --- */
const projetos = () => items().filter(i => i.tipo === 'projeto');
const nomeProjeto = id => { const p = getItem(id); return p ? p.titulo : null; };
/** Tarefas ativas de um projeto (inclui lembretes). */
const subtarefas = pid => items().filter(i => i.tipo === 'tarefa' && i.projetoId === pid && i.secao === 'tarefas');
const subtarefasFuturo = pid => items().filter(i => i.tipo === 'tarefa' && i.projetoId === pid && i.secao === 'futuro');
/** Próxima ação (GTD): a tarefa marcada no projeto, enquanto estiver aberta e ligada a ele. */
function proximaAcao(p){
  if(!p || p.tipo !== 'projeto' || !p.proximaId) return null;
  const t = getItem(p.proximaId);
  return t && t.tipo === 'tarefa' && t.projetoId === p.id && !ehLembrete(t) && !concluido(t) && t.secao === 'tarefas' ? t : null;
}
/** Projeto ativo sem próxima ação é projeto parado. */
const semProxima = p => !!p && p.tipo === 'projeto' && p.secao === 'projetos' && !concluido(p) && !proximaAcao(p);
const ehProxima = t => !!t && t.tipo === 'tarefa' && !!t.projetoId && proximaAcao(getItem(t.projetoId)) === t;
const candidatasProxima = p => subtarefas(p.id).filter(t => !ehLembrete(t) && !concluido(t));
/** Progresso considera só as tarefas comuns (lembretes ficam de fora). */
function progresso(p){
  const s = subtarefas(p.id).filter(t => !ehLembrete(t));
  const feitas = s.filter(concluido).length;
  return {feitas, total:s.length, pct: s.length ? Math.round(feitas*100/s.length) : 0};
}
/** Projetos que aceitam novas tarefas: não concluídos. */
const projetosVinculaveis = () => projetos().filter(p => !concluido(p) && (p.secao === 'projetos' || p.secao === 'futuro'));
const ativo = i => i.secao === 'projetos' || i.secao === 'tarefas';
function lembreteDe(origemId){ return items().find(i => ehLembrete(i) && i.origemId === origemId && !concluido(i)) || null; }
function ultimoComentario(it){ const c = it.atividade.filter(a => a.kind === 'comentario'); return c.length ? c[c.length-1] : null; }
function contaComentarios(it){ return it.atividade.filter(a => a.kind === 'comentario').length; }
/** Atividade mais recente (comentário ou histórico). No projeto, considera também as tarefas dele. */
function ultimaAtualizacao(it){
  let melhor = null;
  const ver = x => x.atividade.forEach(a => { if(!melhor || a.em > melhor.a.em) melhor = {a, de:x}; });
  ver(it);
  if(it.tipo === 'projeto') items().forEach(t => { if(t.tipo === 'tarefa' && t.projetoId === it.id) ver(t); });
  return melhor;
}
function resumoAtividade(a){
  if(a.kind === 'comentario') return '“' + a.texto + '”';
  if(a.texto) return a.texto;
  const f = v => a.fmt === 'data' ? (v ? fmtCurta(v) : '—') : (v == null || v === '' ? '—' : String(v));
  return (a.rotulo || 'Alteração') + ': ' + f(a.de) + ' → ' + f(a.para);
}
function rotuloTipo(it){ return ehLembrete(it) ? 'Lembrete' : it.tipo === 'projeto' ? 'Projeto' : it.tipo === 'tarefa' ? 'Tarefa' : 'Sem tipo'; }
function iconeTipo(it){ return ehLembrete(it) ? 'bell' : it.tipo === 'projeto' ? 'folder' : it.tipo === 'tarefa' ? 'checkSq' : 'inbox'; }

function contadores(){
  const its = items();
  return {
    entrada: its.filter(i => i.secao === 'entrada').length,
    futuro: its.filter(i => i.secao === 'futuro').length,
    hoje: itensHoje().length,
    projetos: its.filter(i => i.secao === 'projetos' && i.tipo === 'projeto' && !concluido(i)).length,
    tarefas: its.filter(i => i.secao === 'tarefas' && i.tipo === 'tarefa' && !concluido(i)).length,
    revisao: its.filter(semProxima).length,
    concluidos: its.filter(concluido).length,
    lixeira: state.dados.lixeira.length
  };
}

/* --- Datas relevantes (sem duplicar lembrete já representado pelo card de lembrete) --- */
function datasRelevantes(it, chaves){
  const out = [];
  DATAS.forEach(function(d){
    const chave = d[0], campo = d[1];
    if(chaves.indexOf(chave) === -1 || !it[campo] || !campoAtivo(campo)) return;
    if(chave === 'lemb' && !ehLembrete(it) && lembreteDe(it.id)) return;   // o card de lembrete representa esta data
    out.push({chave, campo, rot: rotuloCurto(campo), iso: it[campo]});
  });
  return out;
}
function dataDeterminante(it){
  const ds = datasRelevantes(it, ['lemb','entrega']).sort((a,b) => a.iso < b.iso ? -1 : 1);
  return ds[0] || null;
}
function faixaItem(it){ const d = dataDeterminante(it); return d ? faixaDe(d.iso) : null; }

/* --- Hoje --- */
function intervaloPeriodo(){
  const p = state.prefs.hoje, h = hojeISO();
  switch(p.periodo){
    case 'hoje': return [h, h];
    case 'vencidos': return ['0000-01-01', addDias(h,-1)];
    case 'amanha': return [addDias(h,1), addDias(h,1)];
    case 'semana': return [inicioSemana(h), fimSemana(h)];
    case 'prox7': return [h, addDias(h,7)];
    case 'prox30': return [h, addDias(h,30)];
    case 'personalizado': return [p.custIni || '0000-01-01', p.custFim || '9999-12-31'];
    default: return ['0000-01-01', h];
  }
}
function motivoHoje(it){
  const iv = intervaloPeriodo();
  // item arrastado para outra faixa nesta visita continua visível, mesmo fora do período filtrado
  const fixo = state.ui.fixadosHoje[it.id];
  if(fixo && it[fixo]) return {chave: fixo === 'dataEntrega' ? 'entrega' : 'lemb', campo:fixo, rot:rotuloCurto(fixo), iso:it[fixo], fora: it[fixo] < iv[0] || it[fixo] > iv[1]};
  const c = datasRelevantes(it, state.prefs.hoje.datas).filter(d => d.iso >= iv[0] && d.iso <= iv[1]);
  c.sort((a,b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0);
  return c[0] || null;
}
/** A faixa está (ao menos em parte) dentro do período filtrado em Hoje? */
function faixaNoPeriodo(f){
  const iv = intervaloPeriodo(), h = hojeISO();
  const lim = {vencidos:['0000-01-01', addDias(h,-1)], hoje:[h,h], amanha:[addDias(h,1), addDias(h,1)], semana:[addDias(h,2), fimSemana(h)], depois:[addDias(fimSemana(h),1), '9999-12-31']}[f];
  return lim && lim[0] <= iv[1] && lim[1] >= iv[0];
}
function textoMotivo(m){
  const n = diffDias(m.iso, hojeISO());
  if(n < -1) return m.rot + ' venceu há ' + (-n) + ' dias';
  if(n === -1) return m.rot + ' venceu ontem';
  if(n === 0) return m.rot + ' hoje';
  if(n === 1) return m.rot + ' amanhã';
  return m.rot + ' em ' + n + ' dias';
}
const tipoHoje = it => ehLembrete(it) ? 'lemb' : it.tipo;
function itensHoje(){
  const p = state.prefs.hoje;
  return items().filter(function(it){
    if(!ativo(it) || !it.tipo || concluido(it)) return false;
    if(p.tipos.indexOf(tipoHoje(it)) === -1) return false;
    if(p.categorias.length && p.categorias.indexOf(it.categoriaId || 'sem') === -1) return false;
    return !!motivoHoje(it);
  });
}

/* --- Ordenação, busca, concluídos --- */
/** Ordem personalizada (arrastada no Foco): posição na lista salva; quem não está nela vai para o fim, por entrega. */
function ordenarManual(arr, manual){
  const pos = {}; (manual || []).forEach((id, i) => { pos[id] = i; });
  ordenar(arr, 'entrega-asc').forEach((it, i) => { if(!(it.id in pos)) pos[it.id] = 1e6 + i; });
  return arr.slice().sort((a, b) => pos[a.id] - pos[b.id]);
}
function ordenar(arr, ordem, ctx){
  if(ordem === 'manual') return ordenarManual(arr, ctx && ctx.manual);
  const dir = /-desc$/.test(ordem) ? -1 : 1;
  const key = ordem.replace(/-(asc|desc)$/, '');
  const MAX = '9999-12-31';
  function val(it){
    if(key.indexOf('x:') === 0){ const v = (it.extras||{})[key.slice(2)]; return v == null || v === '' ? '￿' : (typeof v === 'number' ? String(1e9 + v).padStart(14,'0') : normaliza(v)); }
    switch(key){
      case 'data': { const m = ctx && ctx.motivo ? ctx.motivo(it) : null; return m ? m.iso : MAX; }
      // lembrete não tem entrega: vale a data do lembrete (do que vence primeiro até o que tem mais prazo)
      case 'entrega': return it.dataEntrega || (ehLembrete(it) ? it.dataLembrete : null) || MAX;
      case 'lemb': return it.dataLembrete || MAX;
      case 'titulo': return normaliza(it.titulo);
      case 'categoria': return normaliza(nomeCat(it.categoriaId));
      case 'tipo': return rotuloTipo(it);
      case 'status': return it.tipo ? String(listaStatus(it.tipo).findIndex(s => s.id === it.status)).padStart(3,'0') : '999';
      case 'progresso': return String(1000 + (it.tipo === 'projeto' ? progresso(it).pct : -1)).padStart(5,'0');
      case 'criacao': return it.criadoEm;
      case 'projeto': return normaliza(nomeProjeto(it.projetoId) || '￿');
      case 'comentarios': return String(contaComentarios(it)).padStart(5,'0');
      case 'atualizacao': { const u = ultimaAtualizacao(it); return u ? u.a.em : ''; }
      default: return '';
    }
  }
  return arr.slice().sort(function(a,b){
    const va = val(a), vb = val(b);
    if(va < vb) return -dir;
    if(va > vb) return dir;
    return normaliza(a.titulo).localeCompare(normaliza(b.titulo), 'pt-BR');
  });
}
function filtraBusca(arr){
  const q = normaliza(state.ui.busca.trim());
  if(q.length < 2) return arr;
  return arr.filter(i => normaliza(i.titulo).indexOf(q) !== -1 || normaliza(i.descricao).indexOf(q) !== -1);
}
/** Concluídos saem das listas e vão para "Concluídos"; o que acabou de ser concluído fica até sair da tela (dá para desfazer).
    Com "Ver concluídos" ligado na seção, eles continuam na lista. */
function filtraConcluidos(arr, sec){
  if(sec && state.prefs[sec] && state.prefs[sec].concluidos) return arr;
  return arr.filter(i => !concluido(i) || state.ui.recemConcluidos.has(i.id));
}
/** Ordem da seção, com a lista personalizada quando a ordem é "manual". */
const ctxOrdem = (sec, extra) => Object.assign({manual:(state.prefs[sec] || {}).manual}, extra || {});
function destaque(txt){
  const q = state.ui.busca.trim();
  if(q.length < 2) return esc(txt);
  const n = normaliza(txt), nq = normaliza(q);
  let out = '', i = 0;
  for(;;){
    const p = n.indexOf(nq, i);
    if(p === -1){ out += esc(txt.slice(i)); break; }
    out += esc(txt.slice(i, p)) + '<mark>' + esc(txt.slice(p, p + q.length)) + '</mark>';
    i = p + q.length;
  }
  return out;
}
/* =========================================================================
   MÓDULO 7 — MUTAÇÕES (ponto único de alteração do estado)
   Toda mudança passa por aqui: atualiza, grava log, persiste e re-renderiza.
   ========================================================================= */
/** Entrada de log: {icone, rotulo, de, para, fmt:'data'} ou {icone, texto}. */
function novoLog(o){ return Object.assign({id:uid('lg'), kind:'log', em:agoraISO()}, o); }
function registrar(it, o){ if(it){ it.atividade.push(novoLog(o)); it.atualizadoEm = agoraISO(); } }
/** Registra na origem e no projeto dela (quando a origem é uma tarefa de projeto). */
function registrarOrigemEProjeto(o, entrada){
  registrar(o, entrada);
  registrarNoProjetoDa(o, entrada);
}
function registrarNoProjetoDa(o, entrada){
  if(o && o.tipo === 'tarefa' && o.projetoId){
    const p = getItem(o.projetoId);
    if(p) registrar(p, Object.assign({}, entrada, {texto: entrada.texto ? 'Tarefa “' + o.titulo + '”: ' + entrada.texto : undefined,
      rotulo: entrada.rotulo ? entrada.rotulo + ' — tarefa “' + o.titulo + '”' : undefined}));
  }
}
function logDeCampo(it, k, de, para){
  const tipoNome = t => t === 'projeto' ? 'Projeto' : t === 'tarefa' ? 'Tarefa' : 'Sem tipo';
  switch(k){
    case 'status': {
      const tp = it.tipo;
      const nome = id => { const s = tp ? statusPorId(tp, id) : null; return s ? s.nome : '—'; };
      return {icone:'target', rotulo: tp === 'projeto' ? 'Status do projeto' : 'Status da tarefa', de:nome(de), para:nome(para)};
    }
    case 'categoriaId': return {icone:'tag', rotulo:nomeCampo('categoriaId'), de:nomeCat(de), para:nomeCat(para)};
    case 'projetoId': return {icone:'link', rotulo:nomeCampo('projetoId'), de:nomeProjeto(de) || 'nenhum', para:nomeProjeto(para) || 'nenhum'};
    case 'dataLembrete': return {icone:'bell', rotulo:nomeCampo(k), de, para, fmt:'data'};
    case 'dataEntrega': return {icone:'calendar', rotulo:nomeCampo(k), de, para, fmt:'data'};
    case 'secao': return {icone:'arrowR', rotulo:'Movido', de:LOCAIS[de] || '—', para:LOCAIS[para] || '—'};
    case 'tipo': return {icone:'split', rotulo:'Convertido', de:tipoNome(de), para:tipoNome(para)};
    case 'titulo': return {icone:'edit', rotulo:nomeCampo('titulo'), de, para};
    case 'descricao': return {icone:'edit', texto: nomeCampo('descricao') + ' editada'};
    case 'textoLembrete': return {icone:'bell', texto: nomeCampo('textoLembrete') + (para ? ': “' + String(para).slice(0,80) + '”' : ' removido')};
    default: return null;
  }
}
/**
 * Altera campos de um item. opts: {silencioso} sem log, {semRender} adia a tela, {forcar} ignora a trava
 * de projeto concluído. Depois sincroniza o lembrete e a próxima ação do projeto.
 */
function alterar(id, mud, opts){
  opts = opts || {};
  const it = getItem(id);
  if(!it) return null;
  if(mud.projetoId && mud.projetoId !== it.projetoId && !opts.forcar){
    const p = getItem(mud.projetoId);
    if(p && concluido(p)){ toast('“' + p.titulo + '” está concluído e não aceita novas tarefas'); render(); return null; }
  }
  // tarefa sem categoria vinculada a um projeto herda a categoria dele (pode ser alterada depois)
  if(mud.projetoId && mud.projetoId !== it.projetoId && !it.categoriaId && !('categoriaId' in mud) && !ehLembrete(it)){
    const p = getItem(mud.projetoId);
    if(p && p.categoriaId) mud = Object.assign({}, mud, {categoriaId:p.categoriaId});
  }
  const tituloAntigo = it.titulo;
  let mudou = false;
  Object.keys(mud).forEach(function(k){
    const v = mud[k];
    if(it[k] === v) return;
    const log = opts.silencioso ? null : logDeCampo(it, k, it[k], v);
    it[k] = v;
    mudou = true;
    if(log) it.atividade.push(novoLog(log));
  });
  if(!mudou){ if(!opts.semRender) render(); return it; }
  it.atualizadoEm = agoraISO();
  if('status' in mud && it.tipo) it.concluidoEm = concluido(it) ? (it.concluidoEm || agoraISO()) : null;
  // o título do lembrete acompanha o da origem, se não foi personalizado
  if('titulo' in mud){ const f = lembreteDe(it.id); if(f && f.titulo === tituloAntigo) f.titulo = it.titulo; }
  if(!ehLembrete(it)) sincronizarLembrete(it);
  if('projetoId' in mud || 'secao' in mud || 'status' in mud) sugerirProxima(it);
  persistir();
  if(!opts.semRender) render();
  return it;
}
/** Status com a data de conclusão coerente (para quem altera o status sem passar por alterar). */
function marcarStatus(it, sid){
  it.status = sid;
  it.concluidoEm = concluido(it) ? (it.concluidoEm || agoraISO()) : null;
}
function alterarExtra(id, cid, valor){
  const it = getItem(id); if(!it) return;
  it.extras = it.extras || {};
  const de = it.extras[cid];
  if(de === valor || (de == null && (valor === '' || valor == null))) return;
  const def = campoDef(cid);
  const f = v => v == null || v === '' ? '—' : (def && def.tipo === 'data' ? fmtCurta(v) : String(v));
  it.extras[cid] = valor === '' ? null : valor;
  registrar(it, {icone: def && def.tipo === 'data' ? 'calendar' : 'edit', rotulo: nomeCampo(cid), de:f(de), para:f(valor)});
  persistir(); render();
}
function criarItem(base, opts){
  const agora = agoraISO();
  const it = Object.assign({
    id:uid(), tipo:null, subtipo:null, origemId:null, secao:'entrada', categoriaId:null, projetoId:null,
    titulo:'Novo item', descricao:'', dataLembrete:null, textoLembrete:'', dataEntrega:null,
    status:null, extras:{}, recorrencia:{}, criadoEm:agora, atualizadoEm:agora, atividade:[]
  }, base || {});
  if(it.tipo && !statusPorId(it.tipo, it.status)) it.status = statusInicial(it.tipo).id;
  if(it.tipo === 'projeto') it.projetoId = null;
  if(it.projetoId){
    const p = getItem(it.projetoId);
    if(!p || concluido(p)) it.projetoId = null;
    else if(!it.categoriaId && !(base && 'categoriaId' in base)) it.categoriaId = p.categoriaId;   // herda a categoria do projeto
  }
  if(concluido(it)) it.concluidoEm = agora;
  it.atividade.push(novoLog({icone:'sparkle', texto:'Item criado em ' + LOCAIS[it.secao]}));
  items().push(it);
  if(it.projetoId) registrar(getItem(it.projetoId), {icone:'plus', texto:'Tarefa adicionada: “' + it.titulo + '”'});
  sincronizarLembrete(it);
  sugerirProxima(it);
  persistir();
  if(!(opts && opts.semRender)) render();
  return it;
}

/* --- Próxima ação (GTD): cada projeto ativo precisa de uma tarefa marcada como a próxima --- */
/** Projeto sem próxima ação adota a tarefa aberta que acabou de entrar nele (dá para trocar depois). */
function sugerirProxima(t){
  if(!t || t.tipo !== 'tarefa' || !t.projetoId || ehLembrete(t) || concluido(t) || t.secao !== 'tarefas') return;
  const p = getItem(t.projetoId);
  if(!p || p.tipo !== 'projeto' || concluido(p) || proximaAcao(p)) return;
  p.proximaId = t.id;
  registrar(p, {icone:'play', texto:'Próxima ação: “' + t.titulo + '”'});
}
function definirProxima(pid, tid){
  const p = getItem(pid); if(!p) return;
  const t = tid ? getItem(tid) : null;
  const antes = proximaAcao(p);
  if((antes ? antes.id : null) === (t ? t.id : null)) return;
  p.proximaId = t ? t.id : null;
  registrar(p, {icone:'play', rotulo:'Próxima ação', de: antes ? antes.titulo : 'nenhuma', para: t ? t.titulo : 'nenhuma'});
  if(t) registrar(t, {icone:'play', texto:'Marcada como próxima ação do projeto'});
  if(antes) registrar(antes, {icone:'play', texto:'Deixou de ser a próxima ação do projeto'});
  persistir(); render();
  toast(t ? 'Próxima ação: “' + t.titulo + '”' : 'Projeto sem próxima ação');
}
/** Escolher a próxima ação: tarefas abertas do projeto ou uma nova tarefa. */
function escolherProxima(anchor, pid){
  const p = getItem(pid); if(!p) return;
  const atual = proximaAcao(p);
  const cands = candidatasProxima(p);
  const itens = [{titulo:'Próxima ação de “' + p.titulo + '”'}]
    .concat(cands.length ? cands.map(t => ({id:t.id, label:t.titulo, icone:'checkSq', marcado: atual === t, acao:() => definirProxima(pid, t.id)}))
                         : [{id:'nada', label:'Nenhuma tarefa aberta no projeto', desabilitado:true}])
    .concat(['-', {id:'nova', label:'Nova tarefa como próxima ação…', icone:'plus', acao:() => popTexto(anchor, {titulo:'Nova próxima ação', valor:'',
      salvar:v => {
        if(!v) return;
        const t = criarItem({tipo:'tarefa', secao:'tarefas', projetoId:pid, titulo:v}, {semRender:true});   // pode já virar a próxima (sugerirProxima)
        if(proximaAcao(p) !== t) return definirProxima(pid, t.id);
        persistir(); render(); toast('Próxima ação: “' + t.titulo + '”');
      }})}]);
  if(atual) itens.push({id:'limpar', label:'Desmarcar próxima ação', icone:'x', acao:() => definirProxima(pid, null)});
  abrirMenu(anchor, itens);
}

/* --- Lembrete: a Data Lembrete de um projeto/tarefa gera um card de lembrete na lista de tarefas --- */
/** Reconciliador idempotente: cria, atualiza, encerra ou remove o lembrete aberto da origem. */
function sincronizarLembrete(o){
  if(!o || ehLembrete(o) || !o.tipo) return;
  if(!campoAtivo('dataLembrete')) return;   // campo desativado: não cria nem apaga lembretes
  let f = lembreteDe(o.id);
  const deve = !!o.dataLembrete && !concluido(o) && (o.secao === 'projetos' || o.secao === 'tarefas' || o.secao === 'futuro');
  const secF = o.secao === 'futuro' ? 'futuro' : 'tarefas';
  const projF = o.tipo === 'projeto' ? o.id : (o.projetoId || null);
  if(deve && !f){
    const agora = agoraISO();
    f = {id:uid(), tipo:'tarefa', subtipo:'lembrete', origemId:o.id, secao:secF, categoriaId:o.categoriaId, projetoId:projF,
         titulo:o.titulo, descricao:o.textoLembrete || '', dataLembrete:o.dataLembrete, dataEntrega:null,
         status:statusInicial('tarefa').id, extras:{}, recorrencia:{}, criadoEm:agora, atualizadoEm:agora, concluidoEm:null,
         atividade:[novoLog({icone:'bell', texto:'Lembrete criado para ' + fmtCurta(o.dataLembrete) + ' — origem: “' + o.titulo + '”'})]};
    items().push(f);
    registrarOrigemEProjeto(o, {icone:'bell', texto:'Lembrete marcado para ' + fmtCurta(o.dataLembrete)});
    return;
  }
  if(deve && f){
    if(f.dataLembrete !== o.dataLembrete){
      const de = f.dataLembrete;
      f.dataLembrete = o.dataLembrete;
      registrar(f, {icone:'repeat', rotulo:'Lembrete reagendado', de, para:o.dataLembrete, fmt:'data'});
      registrarNoProjetoDa(o, {icone:'repeat', rotulo:'Lembrete reagendado', de, para:o.dataLembrete, fmt:'data'});
    }
    // o texto do lembrete (na origem) é a descrição do card de lembrete
    if(o.textoLembrete === undefined && f.descricao) o.textoLembrete = f.descricao;   // dados antigos: adota o texto já escrito
    if((f.descricao || '') !== (o.textoLembrete || '')){
      f.descricao = o.textoLembrete || '';
      registrar(f, {icone:'bell', texto: nomeCampo('textoLembrete') + ' atualizado'});
    }
    f.secao = secF; f.projetoId = projF; f.categoriaId = o.categoriaId;
    return;
  }
  if(!deve && f){
    if(concluido(o)){
      marcarStatus(f, statusFinal('tarefa').id);
      registrar(f, {icone:'check', texto:'Lembrete encerrado: a origem foi concluída'});
      registrarOrigemEProjeto(o, {icone:'bell', texto:'Lembrete encerrado junto com a conclusão'});
    }else{
      state.dados.items = items().filter(x => x.id !== f.id);
      registrarOrigemEProjeto(o, {icone:'bell', texto:'Lembrete removido'});
    }
  }
}
function reconciliarTodos(){ items().slice().forEach(it => { if(!ehLembrete(it)) sincronizarLembrete(it); }); }

/** Define uma data (sistema). No card de lembrete, a data é a da origem. */
function definirData(id, campo, valor){
  const it = getItem(id); if(!it) return;
  valor = valor || null;
  if(ehLembrete(it) && campo === 'dataLembrete'){
    if(!valor) return removerLembrete(it.id);
    const o = getItem(it.origemId);
    if(!o){ alterar(it.id, {dataLembrete:valor}); return; }
    alterar(o.id, {dataLembrete:valor});     // registra na origem e sincroniza a tarefa (e o projeto)
    return;
  }
  // limpar a data de uma origem com lembrete aberto = cancelar o lembrete (com Desfazer)
  if(campo === 'dataLembrete' && !valor && lembreteDe(id)) return removerLembrete(id);
  alterar(id, {[campo]: valor});
}
function setRecorrencia(id, campo, regra){
  const it = getItem(id); if(!it) return;
  const alvo = ehLembrete(it) && campo === 'dataLembrete' ? getItem(it.origemId) : it;
  if(!alvo) return;
  alvo.recorrencia = alvo.recorrencia || {};
  const de = descreverRec(alvo.recorrencia[campo]), para = descreverRec(regra);
  if(JSON.stringify(alvo.recorrencia[campo] || null) === JSON.stringify(regra || null)) return;
  alvo.recorrencia[campo] = regra || null;
  const entrada = {icone:'repeat', rotulo:'Recorrência — ' + nomeCampo(campo), de, para};
  registrar(alvo, entrada);
  if(campo === 'dataLembrete'){
    const f = lembreteDe(alvo.id);
    if(f) registrar(f, entrada);
    registrarNoProjetoDa(alvo, entrada);
  }
  if(regra && !alvo[campo]){ alterar(alvo.id, {[campo]: hojeISO()}); return; }
  persistir(); render();
}
function removerLembrete(id){
  const it = getItem(id); if(!it) return;
  const f = ehLembrete(it) ? it : lembreteDe(it.id);
  const o = ehLembrete(it) ? getItem(it.origemId) : it;
  const snap = snapshot();
  if(f) state.dados.items = items().filter(x => x.id !== f.id);
  if(o){
    const de = o.dataLembrete;
    o.dataLembrete = null;
    o.recorrencia = o.recorrencia || {}; o.recorrencia.dataLembrete = null;
    registrar(o, {icone:'bell', rotulo:nomeCampo('dataLembrete'), de, para:null, fmt:'data'});
    registrarOrigemEProjeto(o, {icone:'bell', texto:'Lembrete cancelado'});
  }
  if(f && state.ui.rota.item === f.id) fecharPainel();
  persistir(); render();
  toast('Lembrete cancelado', () => restaurar(snap));
}
/** Reagendar: muda a data do lembrete aberto (a data vive na origem). */
function reagendarLembrete(id, data){
  const it = getItem(id); if(!it || !data) return;
  const f = ehLembrete(it) ? it : lembreteDe(it.id);
  const alvo = f || it;
  if(alvo.dataLembrete === data) return;
  const snap = snapshot();
  definirData(alvo.id, 'dataLembrete', data);
  toast('Lembrete reagendado para ' + fmtCurta(data) + ' (' + fmtRelativa(data) + ')', () => restaurar(snap));
}
/**
 * Concluir um lembrete (não tem status). Com recorrência, ele pula para a próxima data.
 * Sem recorrência, fica concluído (vai para Concluídos) e pergunta se quer marcar um novo lembrete.
 */
function concluirLembrete(id, anchor){
  const f = getItem(id); if(!f || !ehLembrete(f) || concluido(f)) return;
  const o = getItem(f.origemId);
  const rec = recDe(f, 'dataLembrete');
  const snap = snapshot();
  state.ui.animarChk = f.id;
  vibrar(12);
  if(rec && o){
    const prox = proximaOcorrencia(f.dataLembrete, rec);
    registrar(f, {icone:'check', texto:'Lembrete concluído em ' + fmtCurta(hojeISO()) + ' — repete (' + descreverRec(rec).toLowerCase() + '): próximo em ' + fmtCurta(prox)});
    registrarOrigemEProjeto(o, {icone:'bell', texto:'Lembrete concluído; o próximo fica para ' + fmtCurta(prox)});
    alterar(o.id, {dataLembrete:prox});
    toast('Lembrete concluído — próximo em ' + fmtCurta(prox) + ' (' + fmtRelativa(prox) + ')', () => restaurar(snap));
    return;
  }
  marcarStatus(f, statusFinal('tarefa').id);
  state.ui.recemConcluidos.add(f.id);
  registrar(f, {icone:'check', texto:'Lembrete concluído'});
  if(o){
    const de = o.dataLembrete;
    o.dataLembrete = null;
    registrar(o, {icone:'bell', rotulo:nomeCampo('dataLembrete'), de, para:null, fmt:'data'});
    registrarOrigemEProjeto(o, {icone:'check', texto:'Lembrete concluído'});
  }
  persistir(); render();
  toast('Lembrete concluído', () => restaurar(snap));
  if(!o || concluido(o)) return;
  abrirConfirm({titulo:'Lembrete concluído', texto:'Marcar um novo lembrete para “' + o.titulo + '”?',
    opcoes:[{label:'Sim, marcar novo lembrete', valor:'sim', variante:'prim'},{label:'Não, obrigado', valor:null}]})
  .then(function(r){ if(r === 'sim') marcarNovoLembrete(o.id, anchor); });
}
/** Picker de data com recorrência e texto para um novo lembrete da origem (só grava ao escolher a data). */
function marcarNovoLembrete(origemId, anchor){
  const o = getItem(origemId); if(!o) return;
  let rec = null, texto = o.textoLembrete || '';
  const alvo = anchor && document.contains(anchor) ? anchor : null;
  abrirDatePicker(alvo, {titulo:'Novo lembrete — ' + o.titulo, valor:null, rec:null, semLimpar:true,
    dicaRec:'Com repetição, concluir o lembrete já agenda o próximo.',
    recorrer:r => { rec = r; },
    texto:{rotulo:nomeCampo('textoLembrete'), valor:texto, salvar:v => { texto = v; }},
    escolher:function(v){
      if(!v) return;
      const snap = snapshot();
      o.recorrencia = o.recorrencia || {};
      if(JSON.stringify(o.recorrencia.dataLembrete || null) !== JSON.stringify(rec)){
        registrar(o, {icone:'repeat', rotulo:'Recorrência — ' + nomeCampo('dataLembrete'), de:descreverRec(o.recorrencia.dataLembrete), para:descreverRec(rec)});
        o.recorrencia.dataLembrete = rec;
      }
      alterar(o.id, {textoLembrete:texto, dataLembrete:v});
      toast('Novo lembrete em ' + fmtCurta(v) + ' (' + fmtRelativa(v) + ')' + (rec ? ' · ' + descreverRec(rec).toLowerCase() : ''), () => restaurar(snap));
    }});
}
/** Reabrir um lembrete concluído devolve a data à origem (se ela não tiver outro lembrete aberto). */
function reabrirLembrete(id){
  const f = getItem(id); if(!f || !ehLembrete(f) || !concluido(f)) return;
  const o = getItem(f.origemId);
  if(o && lembreteDe(o.id)){ toast('“' + o.titulo + '” já tem um lembrete aberto'); return; }
  if(o && concluido(o)){ toast('A origem “' + o.titulo + '” está concluída: reabra-a primeiro'); return; }
  const snap = snapshot();
  marcarStatus(f, statusInicial('tarefa').id);
  state.ui.recemConcluidos.delete(f.id);
  registrar(f, {icone:'restore', texto:'Lembrete reaberto'});
  if(o){
    const de = o.dataLembrete;
    o.dataLembrete = f.dataLembrete;
    registrar(o, {icone:'bell', rotulo:nomeCampo('dataLembrete'), de, para:o.dataLembrete, fmt:'data'});
  }
  persistir(); render();
  toast('Lembrete reaberto', () => restaurar(snap));
}
/** Texto do lembrete: fica na origem e aparece como descrição do card de lembrete. */
function definirTextoLembrete(id, texto){
  const it = getItem(id); if(!it) return;
  const o = ehLembrete(it) ? getItem(it.origemId) : it;
  if(!o){ alterar(it.id, {descricao:texto}); return; }
  alterar(o.id, {textoLembrete: texto || ''});
}

/* --- Status e conclusão --- */
function setStatus(id, sid){
  const it = getItem(id); if(!it || !it.tipo) return;
  if(!statusPorId(it.tipo, sid)) return;               // blindagem: nunca aceita status de outro tipo
  if(it.status === sid) return;
  // lembrete não tem status: só se conclui (ou reabre)
  if(ehLembrete(it)){
    if(sid === statusFinal('tarefa').id) return concluirLembrete(id);
    if(concluido(it)) return reabrirLembrete(id);
    toast('Lembretes não têm status: use Concluir lembrete ou Reagendar'); render(); return;
  }
  if(sid === statusFinal(it.tipo).id){
    if(it.tipo === 'projeto') return confirmarConclusaoProjeto(it);
    return concluirTarefa(it);
  }
  const eraConcluido = concluido(it);
  state.ui.recemConcluidos.delete(id);
  const snap = eraConcluido ? snapshot() : null;
  alterar(id, {status:sid});
  if(eraConcluido) toast('“' + it.titulo + '” reaberto', () => restaurar(snap));
}
function concluir(id, anchor){
  const it = getItem(id); if(!it || !it.tipo) return;
  if(ehLembrete(it)) return concluido(it) ? reabrirLembrete(id) : concluirLembrete(id, anchor);
  if(concluido(it)) return setStatus(id, statusInicial(it.tipo).id);
  setStatus(id, statusFinal(it.tipo).id);
}
function aplicaRecorrenciaEntrega(it){
  const rec = it.recorrencia && it.recorrencia.dataEntrega;
  if(!rec || !it.dataEntrega) return null;
  const prox = proximaOcorrencia(it.dataEntrega, rec);
  registrar(it, {icone:'repeat', texto:'Concluído em ' + fmtCurta(hojeISO()) + ' — recorrência (' + descreverRec(rec).toLowerCase() + '): nova entrega em ' + fmtCurta(prox)});
  const de = it.dataEntrega;
  it.dataEntrega = prox;
  registrar(it, {icone:'calendar', rotulo:nomeCampo('dataEntrega'), de, para:prox, fmt:'data'});
  return prox;
}
function concluirTarefa(it){
  const snap = snapshot();
  state.ui.animarChk = it.id;
  vibrar(12);
  const prox = aplicaRecorrenciaEntrega(it);
  if(prox){
    persistir(); render();
    toast('Concluída — próxima entrega em ' + fmtCurta(prox), () => restaurar(snap));
    return;
  }
  const eraProxima = ehProxima(it);
  state.ui.recemConcluidos.add(it.id);
  alterar(it.id, {status:statusFinal('tarefa').id});
  toast('Tarefa concluída', () => restaurar(snap));
  // GTD: concluiu a próxima ação → o projeto precisa de outra, senão fica parado
  const p = eraProxima ? getItem(it.projetoId) : null;
  if(p && semProxima(p)) toast('“' + p.titulo + '” ficou sem próxima ação', null, {label:'Definir', fn:() => escolherProxima(null, p.id)});
}
/** Concluir projeto: pergunta o que fazer com as tarefas abertas. */
function confirmarConclusaoProjeto(p, opts){
  opts = opts || {};
  // lembretes não contam: os de tarefas concluídas se encerram junto (sincronizarLembrete), o do projeto também
  const abertas = items().filter(t => t.tipo === 'tarefa' && t.projetoId === p.id && !concluido(t) && t.secao !== 'entrada' && !ehLembrete(t));
  function executar(modo){
    const snap = snapshot();
    const final = statusFinal('tarefa').id;
    if(modo === 'tudo'){
      abertas.forEach(function(t){
        const de = nomeStatus(t);
        marcarStatus(t, final);
        registrar(t, {icone:'target', rotulo:'Status da tarefa', de, para:nomeStatus(t)});
        registrar(t, {icone:'folder', texto:'Concluída junto com o projeto “' + p.titulo + '”'});
      });
    }
    state.ui.recemConcluidos.add(p.id);
    state.ui.animarChk = p.id;
    vibrar(12);
    if(opts.tarefaOrigem) registrar(opts.tarefaOrigem, {icone:'folder', rotulo:'Status do projeto “' + p.titulo + '”', de:nomeStatus(p), para:statusFinal('projeto').nome});
    alterar(p.id, {status:statusFinal('projeto').id}, {semRender:true});
    registrar(p, {icone:'check', texto: !abertas.length ? 'Projeto concluído'
      : modo === 'tudo' ? 'Projeto concluído com ' + abertas.length + ' tarefa(s) concluída(s) junto'
      : 'Projeto concluído; ' + abertas.length + ' tarefa(s) mantida(s) abertas'});
    abertas.forEach(t => sincronizarLembrete(t));
    const prox = aplicaRecorrenciaEntrega(p);
    if(prox){ marcarStatus(p, statusInicial('projeto').id); registrar(p, {icone:'repeat', texto:'Projeto recorrente reaberto'}); }
    persistir(); render();
    toast(prox ? 'Projeto concluído e reaberto — nova entrega em ' + fmtCurta(prox) : 'Projeto concluído', () => restaurar(snap));
  }
  if(!abertas.length){ executar('so'); return; }
  abrirConfirm({
    titulo:'Concluir projeto',
    texto:'“' + p.titulo + '” tem ' + abertas.length + ' tarefa(s) aberta(s). Projetos concluídos não aceitam novas tarefas.',
    opcoes:[
      {label:'Concluir projeto e todas as tarefas abertas', valor:'tudo', variante:'prim'},
      {label:'Concluir só o projeto (manter tarefas abertas)', valor:'so'},
      {label:'Cancelar', valor:null}
    ]
  }).then(function(r){ if(r) executar(r); else render(); });
}
/** Status do projeto alterado a partir de uma tarefa: registra nos dois. */
function setStatusProjetoDeTarefa(tarefaId, sid){
  const t = getItem(tarefaId); if(!t || !t.projetoId) return;
  const p = getItem(t.projetoId); if(!p || !statusPorId('projeto', sid) || p.status === sid) return;
  if(sid === statusFinal('projeto').id) return confirmarConclusaoProjeto(p, {tarefaOrigem:t});
  const de = nomeStatus(p);
  marcarStatus(p, sid);
  registrar(p, {icone:'target', rotulo:'Status do projeto', de, para:nomeStatus(p), nota:'a partir da tarefa “' + t.titulo + '”'});
  registrar(t, {icone:'folder', rotulo:'Status do projeto “' + p.titulo + '”', de, para:nomeStatus(p)});
  persistir(); render();
  toast('Status do projeto: ' + nomeStatus(p));
}

/* --- Movimentação entre locais --- */
function mover(id, secao, opts){
  const it = getItem(id); if(!it) return;
  const mud = {secao};
  if(secao === 'projetos') mud.tipo = 'projeto';
  if(secao === 'tarefas' && !it.tipo) mud.tipo = 'tarefa';
  if(mud.tipo && mud.tipo !== it.tipo){ mud.status = mapeiaStatus(it, mud.tipo); if(mud.tipo === 'projeto') mud.projetoId = null; }
  alterar(id, mud, opts);
}
function classificarFuturo(id){

  }).then(r => { if(r) fazer(r === 'sim'); });
}
function ativar(id){

/* --- Exclusão (lixeira de 30 dias), duplicação e conversão --- */
/** Remoção direta, sem lixeira: só para desfazer uma criação. */
function removerItens(ids){
  state.dados.items = items().filter(x => ids.indexOf(x.id) === -1 && !(ehLembrete(x) && ids.indexOf(x.origemId) !== -1));
}
/** Leva os itens (e os lembretes deles) para a lixeira, num único registro que se restaura junto. */
function moverParaLixeira(ids, principalId, desvinculadas){
  const leva = items().filter(x => ids.indexOf(x.id) !== -1 || (ehLembrete(x) && ids.indexOf(x.origemId) !== -1));
  if(!leva.length) return null;
  const ent = {id:uid('lx'), excluidoEm:agoraISO(), principalId, itens:clone(leva), desvinculadas:desvinculadas || []};
  state.dados.lixeira.unshift(ent);
  const fora = leva.map(x => x.id);
  state.dados.items = items().filter(x => fora.indexOf(x.id) === -1);
  return ent;
}
function excluir(id){
  const it = getItem(id); if(!it) return;
  if(ehLembrete(it)) return removerLembrete(id);
  const subs = it.tipo === 'projeto' ? items().filter(t => t.tipo === 'tarefa' && t.projetoId === it.id && !ehLembrete(t)) : [];
  function fim(snap, msg){
    const r = state.ui.rota;
    if(r.item === id || r.id === id) irPara('#/' + (it.secao === 'projetos' ? 'projetos' : it.secao === 'tarefas' ? 'tarefas' : 'entrada'), true);
    persistir(); render();
    toast(msg, () => restaurar(snap), {label:'Lixeira', fn:() => irPara('#/lixeira')});
  }
  if(subs.length){
    abrirConfirm({titulo:'Excluir projeto', texto:'“' + it.titulo + '” tem ' + subs.length + ' tarefa(s). O que fazer com elas? Tudo fica ' + DIAS_LIXEIRA + ' dias na lixeira.',
      opcoes:[{label:'Manter como tarefas sem projeto', valor:'manter', variante:'prim'},{label:'Levar as tarefas junto para a lixeira', valor:'tudo', variante:'dngr'},{label:'Cancelar', valor:null}]
    }).then(function(r){
      if(!r) return;
      const snap = snapshot();
      if(r === 'manter'){
        subs.forEach(s => { alterar(s.id, {projetoId:null}, {semRender:true}); registrar(s, {icone:'folder', texto:'Projeto “' + it.titulo + '” foi para a lixeira'}); });
        moverParaLixeira([id], id, subs.map(s => s.id));
      } else moverParaLixeira([id].concat(subs.map(s => s.id)), id);
      fim(snap, 'Projeto na lixeira');
    });
    return;
  }
  const snap = snapshot();
  moverParaLixeira([id], id);
  fim(snap, 'Movido para a lixeira');
}
/** Descartar na triagem: vai para a lixeira, sem risco (restaura por 30 dias). */
function descartar(id){
  const it = getItem(id); if(!it) return;
  const snap = snapshot();
  moverParaLixeira([id], id);
  if(state.ui.rota.item === id) fecharPainel();
  persistir(); render();
  toast('Descartado — fica ' + DIAS_LIXEIRA + ' dias na lixeira', () => restaurar(snap));
}
function restaurarDaLixeira(entId){
  const ent = state.dados.lixeira.find(e => e.id === entId); if(!ent) return;
  const snap = snapshot();
  const voltam = clone(ent.itens);
  voltam.forEach(function(x){
    if(getItem(x.id)) x.id = uid();                                  // id já em uso (improvável): restaura como novo
    items().push(x);
  });
  voltam.forEach(function(x){
    if(x.projetoId && !getItem(x.projetoId)){ registrar(x, {icone:'folder', texto:'Projeto de origem não existe mais: restaurado sem projeto'}); x.projetoId = null; }
    if(!ehLembrete(x)) registrar(x, {icone:'restore', texto:'Restaurado da lixeira'});
  });
  // tarefas que ficaram sem projeto na exclusão voltam para ele
  ent.desvinculadas.forEach(function(tid){
    const t = getItem(tid);
    if(t && !t.projetoId && getItem(ent.principalId)){ t.projetoId = ent.principalId; registrar(t, {icone:'link', texto:'Religada ao projeto restaurado'}); }
  });
  state.dados.lixeira = state.dados.lixeira.filter(e => e.id !== entId);
  reconciliarTodos();
  persistir(); render();
  const p = voltam.find(x => x.id === ent.principalId) || voltam[0];
  toast('“' + (p ? p.titulo : 'Item') + '” restaurado', () => restaurar(snap), p ? {label:'Abrir', fn:() => abrirItem(p.id, true)} : null);
}
function apagarDaLixeira(entId){
  const ent = state.dados.lixeira.find(e => e.id === entId); if(!ent) return;
  const p = ent.itens.find(x => x.id === ent.principalId) || ent.itens[0];
  abrirConfirm({titulo:'Apagar definitivamente', texto:'“' + (p ? p.titulo : 'Item') + '”' + (ent.itens.length > 1 ? ' e mais ' + (ent.itens.length - 1) + ' item(ns) ligados a ele' : '') + ' serão apagados de vez.',
    opcoes:[{label:'Apagar definitivamente', valor:'ok', variante:'dngr'},{label:'Cancelar', valor:null}]}).then(function(r){
    if(r !== 'ok') return;
    const snap = snapshot();
    state.dados.lixeira = state.dados.lixeira.filter(e => e.id !== entId);
    persistir(); render();
    toast('Apagado definitivamente', () => restaurar(snap));
  });
}
function esvaziarLixeira(){
  const n = state.dados.lixeira.length; if(!n) return;
  abrirConfirm({titulo:'Esvaziar lixeira', texto:n + ' registro(s) serão apagados de vez.', opcoes:[{label:'Esvaziar lixeira', valor:'ok', variante:'dngr'},{label:'Cancelar', valor:null}]}).then(function(r){
    if(r !== 'ok') return;
    const snap = snapshot();
    state.dados.lixeira = [];
    persistir(); render();
    toast('Lixeira esvaziada', () => restaurar(snap));
  });

/** Registros com mais de 30 dias saem da lixeira (roda ao abrir o app). */
function limparLixeiraAntiga(){
  const limite = Date.now() - DIAS_LIXEIRA * 86400000;
  state.dados.lixeira = state.dados.lixeira.filter(e => new Date(e.excluidoEm).getTime() >= limite);
}
function diasRestantesLixeira(ent){ return Math.max(0, DIAS_LIXEIRA - Math.floor((Date.now() - new Date(ent.excluidoEm).getTime()) / 86400000)); }
function duplicar(id){
  const it = getItem(id); if(!it || ehLembrete(it)) return;
  const agora = agoraISO();
  const novo = Object.assign(clone(it), {id:uid(), titulo:it.titulo + ' (cópia)', criadoEm:agora, atualizadoEm:agora, proximaId:null,
    atividade:[novoLog({icone:'copy', texto:'Duplicado de “' + it.titulo + '”'})]});
  if(novo.projetoId){ const p = getItem(novo.projetoId); if(p && concluido(p)) novo.projetoId = null; }
  items().push(novo);
  sincronizarLembrete(novo);
  persistir(); render();
  toast('Item duplicado', () => { removerItens([novo.id]); persistir(); render(); });
}
function converterTipo(id){
  const it = getItem(id); if(!it || !it.tipo || ehLembrete(it)) return;
  const para = it.tipo === 'projeto' ? 'tarefa' : 'projeto';
  function fazer(){
    const snap = snapshot();
    const mud = {tipo:para, status:mapeiaStatus(it, para)};
    if(para === 'projeto'){ mud.projetoId = null; if(it.secao === 'tarefas') mud.secao = 'projetos'; }
    else if(it.secao === 'projetos') mud.secao = 'tarefas';
    alterar(id, mud);
    toast('Convertido em ' + (para === 'projeto' ? 'projeto' : 'tarefa'), () => restaurar(snap));
  }
  if(it.tipo === 'projeto'){
    const subs = items().filter(t => t.tipo === 'tarefa' && t.projetoId === it.id && !ehLembrete(t));
    if(subs.length){
      abrirConfirm({titulo:'Converter projeto em tarefa', texto:'“' + it.titulo + '” tem ' + subs.length + ' tarefa(s). Para converter, elas serão desvinculadas e viram tarefas sem projeto.',
        opcoes:[{label:'Desvincular e converter', valor:'ok', variante:'prim'},{label:'Cancelar', valor:null}]
      }).then(function(r){
        if(r !== 'ok') return;
        subs.forEach(s => alterar(s.id, {projetoId:null}, {semRender:true}));
        fazer();
      });
      return;
    }
  }
  fazer();
}

/* --- Snapshot / desfazer --- */
function snapshot(){ return clone(state.dados); }

/* =========================================================================
   MÓDULO 8 — MUTAÇÕES DE ESTRUTURA (status, campos, layouts)
   ========================================================================= */
function renomearStatus(tipo, sid, nome){
  const s = statusPorId(tipo, sid); if(!s) return;
  nome = String(nome || '').trim();
  if(!nome || nome === s.nome){ render(); return; }
  if(listaStatus(tipo).some(x => x.id !== sid && normaliza(x.nome) === normaliza(nome))){ toast('Já existe um status “' + nome + '”'); render(); return; }
  s.nome = nome; persistir(); render();
  toast('Status renomeado para “' + nome + '”');
}
function corStatus(tipo, sid, cor){ const s = statusPorId(tipo, sid); if(s){ s.cor = cor; persistir(); render(); } }
function adicionarStatus(tipo, nome){
  nome = String(nome || '').trim(); if(!nome) return;
  const l = listaStatus(tipo);
  if(l.some(x => normaliza(x.nome) === normaliza(nome))){ toast('Já existe um status “' + nome + '”'); return; }
  const novo = {id:uid(tipo === 'projeto' ? 'sp' : 'st'), nome, cor:PALETA[l.length % PALETA.length]};
  const iFinal = l.findIndex(s => s.final);
  if(iFinal === l.length - 1) l.splice(iFinal, 0, novo); else l.push(novo);
  persistir(); render();
  toast('Status “' + nome + '” adicionado');
}
function excluirStatus(tipo, sid){
  const s = statusPorId(tipo, sid); if(!s) return;
  if(s.final){ toast('O status de conclusão não pode ser excluído — só renomeado'); return; }
  const l = listaStatus(tipo);
  if(l.length <= 2){ toast('Mantenha pelo menos dois status'); return; }
  const usados = items().filter(i => i.tipo === tipo && i.status === sid);
  const outros = l.filter(x => x.id !== sid);
  const corpo = '<p style="font-size:14px;color:var(--text-2);margin-bottom:12px">' +
    (usados.length ? usados.length + ' item(ns) estão em “' + esc(s.nome) + '”. Para onde movê-los?' : 'Nenhum item usa “' + esc(s.nome) + '”.') + '</p>' +
    (usados.length ? '<div class="field"><label for="stDestino">Mover itens para</label><select class="inp" id="stDestino">' +
      outros.map(o => '<option value="' + o.id + '">' + esc(o.nome) + '</option>').join('') + '</select></div>' : '');
  abrirSheet({titulo:'Excluir status “' + s.nome + '”', corpo, autofoco:false,
    rodape:'<button type="button" class="btn blk" data-act="fechar-sheet">Cancelar</button><button type="button" class="btn dngr blk" id="stConfirma">Excluir status</button>',
    aoMontar: function(el){
      $('#stConfirma', el).addEventListener('click', function(){
        const destino = usados.length ? $('#stDestino', el).value : null;
        const snap = snapshot();
        usados.forEach(function(i){
          const dN = statusPorId(tipo, destino);
          marcarStatus(i, destino);
          registrar(i, {icone:'target', rotulo: tipo === 'projeto' ? 'Status do projeto' : 'Status da tarefa', de:s.nome, para:dN ? dN.nome : '—', nota:'status “' + s.nome + '” excluído'});
        });
        estr().status[tipo] = l.filter(x => x.id !== sid);
        ['projetos','tarefas'].forEach(k => { state.prefs[k].statusF = state.prefs[k].statusF.filter(x => x !== sid); });
        persistirPrefs(); fecharSheet(); persistir(); render();
        toast('Status excluído', () => restaurar(snap));
      });
    }});
}
function renomearCampo(cid, nome){
  const c = campos().find(x => x.id === cid);
  nome = String(nome || '').trim();
  if(!c || !nome || c.nome === nome){ render(); return; }
  c.nome = nome; persistir(); render();
  toast('Campo renomeado para “' + nome + '”');
}
function adicionarCampo(def, visivelEm){
  const c = {id:uid('cf'), nome:def.nome.trim(), tipo:def.tipo, aplica:def.aplica.slice(), opcoes:def.opcoes || [], sistema:false};
  campos().push(c);
  ['card','kanban','lista'].forEach(v => estr().layouts[v].push({id:c.id, visivel: v === 'card' || v === visivelEm}));

  toast('Campo “' + c.nome + '” criado');

}
function excluirCampo(cid){
  const c = campos().find(x => x.id === cid); if(!c) return;
  if(c.sistema){
    if(c.travado){ toast('“' + c.nome + '” é essencial e não pode ser desativado'); return; }
    c.ativo = c.ativo === false;
    persistir(); render();
    toast(c.ativo === false ? '“' + c.nome + '” desativado (dados preservados)' : '“' + c.nome + '” reativado');
    return;
  }
  const n = items().filter(i => i.extras && i.extras[cid] != null && i.extras[cid] !== '').length;

    opcoes:[{label:'Excluir campo', valor:'ok', variante:'dngr'},{label:'Cancelar', valor:null}]}).then(function(r){

    ['card','kanban','lista'].forEach(v => { estr().layouts[v] = estr().layouts[v].filter(e => e.id !== cid); });
    items().forEach(i => { if(i.extras) delete i.extras[cid]; });

    toast('Campo excluído', () => restaurar(snap));

}
function setVisivelLayout(visao, cid, vis){
  const L = estr().layouts[visao];
  const e = L.find(x => x.id === cid); if(!e) return;
  if(cid === 'titulo' && !vis){ toast('O título é sempre visível'); return; }
  e.visivel = vis;
  if(vis){ L.splice(L.indexOf(e), 1); const ultimoVis = L.map(x => x.visivel).lastIndexOf(true); L.splice(ultimoVis + 1, 0, e); }
  persistir(); render();
}
/** Aplica uma nova ordem vinda do arrastar-e-soltar ou das setas. */
function aplicarOrdem(chave, ids){
  const reordena = (lista, pegaId) => ids.map(id => lista.find(x => pegaId(x) === id)).filter(Boolean).concat(lista.filter(x => ids.indexOf(pegaId(x)) === -1));
  if(chave.indexOf('status:') === 0){ const t = chave.split(':')[1]; estr().status[t] = reordena(estr().status[t], s => s.id); }
  else if(chave === 'campos'){ estr().campos = reordena(campos(), c => c.id); }
  else if(chave === 'categorias'){ state.dados.categorias = reordena(categorias(), c => c.id); }
  else if(chave.indexOf('layout:') === 0 || chave.indexOf('layoutfull:') === 0){ const v = chave.split(':')[1]; estr().layouts[v] = reordena(estr().layouts[v], e => e.id); }
  persistir(); render();
}
function moverNaOrdem(chave, id, delta){
  let lista;
  if(chave.indexOf('status:') === 0) lista = estr().status[chave.split(':')[1]].map(s => s.id);
  else if(chave === 'campos') lista = campos().map(c => c.id);
  else if(chave === 'categorias') lista = categorias().map(c => c.id);
  else if(chave.indexOf('layoutfull:') === 0) lista = layout(chave.split(':')[1]).map(e => e.id);
  else lista = layoutVisivel(chave.split(':')[1]);
  const i = lista.indexOf(id), j = i + delta;
  if(i === -1 || j < 0 || j >= lista.length) return;
  lista.splice(i, 1); lista.splice(j, 0, id);
  state.ui.focar = '[data-act="mover-ordem"][data-k="' + id + '"][data-d="' + delta + '"]';
  aplicarOrdem(chave, lista);
}

/* --- Modelos de estrutura: salvar a estrutura atual (status, campos, visões) e trocar entre elas --- */
const modelos = () => state.dados.modelos;
const modeloAtivo = () => modelos().find(m => m.id === state.dados.modeloAtivo) || null;
/** A estrutura em uso difere do modelo ativo? */
function estruturaAlterada(){ const m = modeloAtivo(); return !!m && JSON.stringify(m.estrutura) !== JSON.stringify(estr()); }
function salvarComoModelo(nome){
  nome = String(nome || '').trim(); if(!nome) return;
  if(modelos().some(m => normaliza(m.nome) === normaliza(nome))){ toast('Já existe um modelo “' + nome + '”'); return; }
  const m = {id:uid('mdl'), nome, padrao:false, criadoEm:agoraISO(), atualizadoEm:agoraISO(), estrutura:clone(estr())};
  modelos().push(m);
  state.dados.modeloAtivo = m.id;
  persistir(); render();
  toast('Modelo “' + nome + '” salvo');
}
function atualizarModelo(mid){
  const m = modelos().find(x => x.id === mid); if(!m) return;
  const snap = snapshot();
  m.estrutura = clone(estr()); m.atualizadoEm = agoraISO();
  state.dados.modeloAtivo = m.id;
  persistir(); render();
  toast('Modelo “' + m.nome + '” atualizado com a estrutura atual', () => restaurar(snap));
}
/**
 * Aplica um modelo. Status que não existem no modelo são levados pelo nome (ou para o inicial / de conclusão);
 * valores de campos personalizados ficam guardados nos itens e voltam se o campo voltar.
 */
function aplicarModelo(mid, estruturaDireta){
  const m = mid ? modelos().find(x => x.id === mid) : null;
  const nova = estruturaDireta || (m && m.estrutura); if(!nova) return;
  const snap = snapshot();
  const antes = {projeto:listaStatus('projeto').slice(), tarefa:listaStatus('tarefa').slice()};
  state.dados.estrutura = clone(nova);
  normalizarEstrutura();
  let ajustados = 0;
  items().forEach(function(it){
    if(!it.tipo || statusPorId(it.tipo, it.status)) return;
    const velho = antes[it.tipo === 'projeto' ? 'projeto' : 'tarefa'].find(s => s.id === it.status);
    const igual = velho && listaStatus(it.tipo).find(s => normaliza(s.nome) === normaliza(velho.nome));
    const novoId = igual ? igual.id : velho && velho.final ? statusFinal(it.tipo).id : statusInicial(it.tipo).id;
    registrar(it, {icone:'structure', rotulo:it.tipo === 'projeto' ? 'Status do projeto' : 'Status da tarefa', de:velho ? velho.nome : '—', para:statusPorId(it.tipo, novoId).nome, nota:'estrutura “' + (m ? m.nome : 'original') + '” aplicada'});
    marcarStatus(it, novoId);
    ajustados++;
  });
  ['projetos','tarefas'].forEach(k => { const t = k === 'projetos' ? 'projeto' : 'tarefa'; state.prefs[k].statusF = state.prefs[k].statusF.filter(x => statusPorId(t, x)); });
  if(m) state.dados.modeloAtivo = m.id;
  reconciliarTodos();
  persistirPrefs(); persistir(); render();
  toast('Estrutura “' + (m ? m.nome : 'original do app') + '” aplicada' + (ajustados ? ' · ' + ajustados + ' item(ns) com status ajustado' : ''), () => restaurar(snap));
}
function confirmarAplicarModelo(mid){
  const m = modelos().find(x => x.id === mid); if(!m) return;
  const aviso = estruturaAlterada() ? ' A estrutura atual tem alterações que não estão salvas em “' + modeloAtivo().nome + '”.' : '';
  abrirConfirm({titulo:'Aplicar “' + m.nome + '”', texto:'Status, campos e visões passam a ser os deste modelo. Itens com status que não existe nele são ajustados (dá para desfazer).' + aviso,
    opcoes:[{label:'Aplicar modelo', valor:'ok', variante:'prim'},{label:'Cancelar', valor:null}]}).then(r => { if(r === 'ok') aplicarModelo(mid); });
}
function renomearModelo(mid, nome){
  const m = modelos().find(x => x.id === mid); nome = String(nome || '').trim();
  if(!m || !nome || nome === m.nome) return;
  m.nome = nome; persistir(); render();
}
function definirModeloPadrao(mid){
  modelos().forEach(m => { m.padrao = m.id === mid; });
  persistir(); render();
  toast('“' + modelos().find(m => m.id === mid).nome + '” é o modelo padrão');
}
function excluirModelo(mid){
  const m = modelos().find(x => x.id === mid); if(!m) return;
  if(m.padrao){ toast('O modelo padrão não pode ser excluído: defina outro como padrão antes'); return; }
  abrirConfirm({titulo:'Excluir modelo “' + m.nome + '”', texto:'A estrutura em uso não muda; só o modelo salvo é removido.', opcoes:[{label:'Excluir modelo', valor:'ok', variante:'dngr'},{label:'Cancelar', valor:null}]}).then(function(r){
    if(r !== 'ok') return;
    const snap = snapshot();
    state.dados.modelos = modelos().filter(x => x.id !== mid);
    if(state.dados.modeloAtivo === mid) state.dados.modeloAtivo = null;
    persistir(); render();
    toast('Modelo excluído', () => restaurar(snap));
  });
}

   ========================================================================= */
const VIEWS = ['entrada','hoje','projetos','tarefas','revisao','concluidos','lixeira','config','estrutura'];
/** q: filtros da página de Concluídos (tipo, projeto) e a seção de onde se veio (de). */
function parseHash(){
  const h = (location.hash || '#/hoje').replace(/^#/, '');
  const partes = h.split('?');
  const cam = partes[0].replace(/^\//, '').split('/').filter(Boolean);
  const qs = new URLSearchParams(partes[1] || '');
  let view = cam[0] || 'hoje';
  if(VIEWS.indexOf(view) === -1) view = 'hoje';
  const q = {};
  ['tipo','projeto','de'].forEach(k => { if(qs.get(k)) q[k] = qs.get(k); });
  return {view, id: view === 'projetos' ? (cam[1] || null) : null, item: qs.get('item'), q};
}
function hashDe(r){
  const qs = [];
  Object.keys(r.q || {}).forEach(k => { if(r.q[k]) qs.push(k + '=' + encodeURIComponent(r.q[k])); });
  if(r.item) qs.push('item=' + r.item);
  return '#/' + r.view + (r.id ? '/' + r.id : '') + (qs.length ? '?' + qs.join('&') : '');
}
function irPara(hash, substituir){
  quandoHistLivre(function(){
    if(substituir){ history.replaceState(null, '', hash); aoMudarHash(); return; }
    if(location.hash === hash) render(); else location.hash = hash;
  });
}
function abrirItem(id, soPainel){
  const it = getItem(id); if(!it) return;
  const r = state.ui.rota;
  if(!soPainel && it.tipo === 'projeto' && it.secao === 'projetos' && r.view === 'projetos' && !r.id){ irPara('#/projetos/' + id); return; }
  // o painel ocupa uma entrada do histórico (o "voltar" fecha); trocar de item dentro dele não empilha outra
  if(!r.item) state.ui.painelEmpurrado = true;
  irPara(hashDe(Object.assign({}, r, {item:id})), !!r.item);
}
function fecharPainel(){
  const r = state.ui.rota;
  if(!r.item) return;
  state.ui.focar = '[data-act="abrir-item"][data-id="' + r.item + '"]';
  quandoHistLivre(function(){
    if(state.ui.painelEmpurrado){ state.ui.painelEmpurrado = false; history.back(); }
    else irPara(hashDe(Object.assign({}, state.ui.rota, {item:null})), true);
  });
}

/* --- Botão/gesto "voltar": sheets, menus e popovers entram no histórico e fecham com ele ---
   extra = entradas empilhadas por camadas abertas; pend = "voltar" em andamento; depois = navegação à espera. */
const hist = {extra:0, pend:0, depois:null, agendado:false};
function camadasAbertas(){ return (sheetAtual ? 1 : 0) + (popAtual ? 1 : 0) + (menuAtual ? 1 : 0); }
/** Chamada sempre que uma camada abre ou fecha: acerta o histórico no fim do evento (abrir+fechar juntos se anulam). */
function agendarHist(){
  const folha = !!(sheetAtual || (popAtual && popAtual.modo === 'sheet') || (menuAtual && menuAtual.sheet));
  document.body.classList.toggle('com-sheet', folha);
  if(hist.agendado) return;
  hist.agendado = true;
  setTimeout(reconciliarHist, 0);
}
function reconciliarHist(){
  hist.agendado = false;
  if(hist.pend) return;                                  // espera o "voltar" anterior terminar
  const n = camadasAbertas();
  if(n > hist.extra){ while(hist.extra < n){ history.pushState({camada:true}, ''); hist.extra++; } return; }
  if(n < hist.extra){ hist.pend = hist.extra - n; history.go(-hist.pend); return; }
  if(hist.depois){ const fn = hist.depois; hist.depois = null; fn(); }
}
/** Navegar com camadas abertas: fecha tudo e só navega depois que o histórico voltar à entrada da tela. */
function quandoHistLivre(fn){
  if(!hist.extra && !hist.pend && !camadasAbertas()) return fn();
  hist.depois = fn;
  fecharMenu(true); fecharPop(true); fecharSheet(true);
  agendarHist();
}
function aoPopState(){
  if(hist.pend){ hist.extra -= hist.pend; hist.pend = 0; reconciliarHist(); return; }
  if(hist.extra > 0){                                    // "voltar" do sistema com uma camada aberta: fecha a de cima
    hist.extra--;
    if(menuAtual) fecharMenu(); else if(popAtual) fecharPop(); else if(sheetAtual) fecharSheet();
  }
}

/** acao: {label, fn} — um segundo botão além de "Desfazer" (ex.: "Definir", "Lixeira"). */
function toast(msg, desfazer, acao){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="msg">' + esc(msg) + '</span>' +
    (acao ? '<button type="button" data-t="acao">' + esc(acao.label) + '</button>' : '') +
    (desfazer ? '<button type="button" data-t="desfazer">Desfazer</button>' : '');
  $('#toasts').appendChild(el);
  while($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  const timer = setTimeout(fim, desfazer || acao ? 5500 : 3200);
  function fim(){ clearTimeout(timer); el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 180); }
  el.addEventListener('click', function(e){
    const b = e.target.closest('button'); if(!b) return;
    fim();
    if(b.dataset.t === 'desfazer') desfazer(); else acao.fn();
  });
}

let sheetAtual = null;
/** Bottom sheet no mobile / diálogo centrado a partir de 768px. corpoFn: re-renderiza o corpo junto com a tela. */
function abrirSheet(op){
  fecharSheet(true);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label', op.titulo || 'Opções');
  el.innerHTML = '<div class="grab"></div><div class="sheet-h"><h2>' + esc(op.titulo || '') + '</h2>' +
    '<button type="button" class="icon-btn" data-act="fechar-sheet" aria-label="Fechar">' + ic('x',18) + '</button></div>' +
    '<div class="sheet-b">' + (op.corpoFn ? op.corpoFn() : (op.corpo || '')) + '</div>' + (op.rodape ? '<div class="sheet-f">' + op.rodape + '</div>' : '');
  $('#sheetRoot').appendChild(el);
  $('#scrim').classList.add('on');
  setTimeout(() => el.classList.add('on'), 10);   // timer (não rAF) para funcionar com a aba em segundo plano
  sheetAtual = {el, op, voltar: document.activeElement};
  agendarHist();
  if(op.aoMontar) op.aoMontar(el);
  // no toque, não abre o teclado sozinho (cobriria metade do sheet); no desktop, foca o primeiro campo
  if(op.autofoco !== false && !(ehToque() && op.autofoco !== 'sempre')){
    const foco = el.querySelector('.sheet-b input:not([type=hidden]),.sheet-b select,.sheet-b textarea,.sheet-b button');
    if(foco) setTimeout(() => foco.focus(), 60);
  }
  return el;
}
function fecharSheet(imediato){
  if(!sheetAtual) return;
  const s = sheetAtual; sheetAtual = null;
  s.el.classList.remove('on');
  s.el.style.transform = '';
  s.el.style.pointerEvents = 'none';   // um sheet saindo não recebe cliques
  s.el.setAttribute('aria-hidden', 'true');
  if(!(state.ui.rota.item && window.innerWidth < 1024)) $('#scrim').classList.remove('on');
  if(imediato) s.el.remove(); else setTimeout(() => s.el.remove(), 230);
  agendarHist();
  if(s.op.aoFechar) s.op.aoFechar();
  if(!imediato && s.voltar && document.contains(s.voltar)) s.voltar.focus({preventScroll:true});
}
function atualizaSheet(){
  if(!sheetAtual || !sheetAtual.op.corpoFn) return;
  const b = $('.sheet-b', sheetAtual.el), st = b.scrollTop;
  const ativoId = document.activeElement && sheetAtual.el.contains(document.activeElement) ? seletorDe(document.activeElement) : null;
  b.innerHTML = sheetAtual.op.corpoFn();
  b.scrollTop = st;
  if(ativoId){ const e = $(ativoId, b); if(e) e.focus({preventScroll:true}); }
}
function abrirConfirm(cfg){
  return new Promise(function(resolve){
    let feito = false;
    const botoes = cfg.opcoes.map((o, i) => '<button type="button" class="btn blk' + (o.variante === 'prim' ? ' prim' : o.variante === 'dngr' ? ' dngr' : '') + '" data-conf="' + i + '">' + esc(o.label) + '</button>').join('');

      aoFechar: () => { if(!feito){ feito = true; resolve(null); } }});
    setTimeout(() => { const b = el.querySelector('[data-conf="0"]'); if(b) b.focus(); }, 60);
    el.addEventListener('click', function(e){
      const b = e.target.closest('[data-conf]'); if(!b || feito || !sheetAtual || sheetAtual.el !== el) return;
      feito = true; resolve(cfg.opcoes[Number(b.dataset.conf)].valor); fecharSheet();
    });
