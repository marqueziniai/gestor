<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://jplnfichttoyjfxbmxof.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestor">
<meta name="description" content="Gestor de projetos e tarefas pessoal, com triagem, lembretes e revisão semanal.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Gestor de Projetos e Tarefas</title>
<style>
/* =========================================================================
   TOKENS / TEMA
   ========================================================================= */
:root{
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r-sm:8px; --r-md:10px; --r-lg:12px;
  --t: 170ms cubic-bezier(.2,.7,.3,1);

  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e7eaef;
  --border:#e3e7ed; --border-2:#cfd5de;
  --text:#101828; --text-2:#4a5567; --text-3:#6b7485;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef1ff; --accent-on:#ffffff;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-2:0 4px 12px rgba(16,24,40,.09),0 2px 4px rgba(16,24,40,.05);
  --shadow-3:0 16px 40px rgba(16,24,40,.16),0 4px 10px rgba(16,24,40,.08);

  --danger:#b42318; --danger-soft:#fef3f2; --danger-bd:#fecdc9;
  --warn:#b54708;   --warn-soft:#fff6ed;   --warn-bd:#fedcab;
  --caution:#8a6a0a;--caution-soft:#fffaeb;--caution-bd:#fdeab0;
  --ok:#067647;     --ok-soft:#ecfdf3;     --ok-bd:#abefc6;
  --purple:#6941c6; --purple-soft:#f4f0ff; --purple-bd:#d9cdf8;
  --info:#175cd3;   --info-soft:#eff6ff;   --info-bd:#b2ccf6;
  --lemb:#0e7490;  --lemb-soft:#ecfeff;  --lemb-bd:#a5f3fc;
}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#141619; --surface-2:#1b1e23; --surface-3:#23272e;
  --border:#262a31; --border-2:#363b45;
  --text:#e8eaef; --text-2:#a9b0bd; --text-3:#858d9b;
  --accent:#8b91f7; --accent-2:#a3a8fb; --accent-soft:#1d1e3b; --accent-on:#0b0c0f;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 4px 14px rgba(0,0,0,.5); --shadow-3:0 18px 44px rgba(0,0,0,.66);
  --danger:#ff9d94; --danger-soft:#2d1512; --danger-bd:#5c2b25;
  --warn:#fdb474;   --warn-soft:#2a1a0c;   --warn-bd:#573414;
  --caution:#f2d06b;--caution-soft:#282009;--caution-bd:#544414;
  --ok:#6fdaa1;     --ok-soft:#0c2418;     --ok-bd:#1d4a33;
  --purple:#bda4f5; --purple-soft:#1d1630; --purple-bd:#392a60;
  --info:#8ab6fb;   --info-soft:#0f1d33;   --info-bd:#1f3b68;
  --lemb:#67e8f9;  --lemb-soft:#0b2a31;  --lemb-bd:#155e6b;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;margin:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--accent);text-decoration:none}
@media (hover:hover){a:hover{text-decoration:underline}}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{display:block;flex:none}
.muted{color:var(--text-3);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kbd{display:inline-block;min-width:20px;padding:1px 5px;border-radius:5px;border:1px solid var(--border-2);background:var(--surface-2);font-size:11px;font-weight:650;font-family:ui-monospace,monospace;color:var(--text-2);text-align:center}
.carregando{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--text-3)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--accent);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* =========================================================================
   LAYOUT
   ========================================================================= */
.app{display:flex;min-height:100dvh}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.viewport{flex:1;min-height:0;padding:12px 14px calc(100px + env(safe-area-inset-bottom))}
@media (min-width:768px){.viewport{padding:16px 20px 40px}}
@media (min-width:1280px){.viewport{padding:20px 28px 48px}}

/* ---- Sidebar ---- */
.sidebar{display:none}
@media (min-width:768px){
  .sidebar{display:flex;flex-direction:column;flex:none;width:72px;background:var(--surface);border-right:1px solid var(--border);height:100dvh;position:sticky;top:0;z-index:30;transition:width var(--t)}
  .sidebar.exp{width:250px}
}
@media (min-width:1024px){
  .sidebar,.sidebar.exp{width:250px}
  .sidebar.compacta{width:72px}
}
.sb-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;min-height:56px}
.sb-logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.sb-name{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;flex:1}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px}
.sb-new{margin:2px 10px 10px;display:flex;align-items:center;gap:8px;justify-content:center;background:var(--accent);color:var(--accent-on);border-radius:var(--r-md);padding:9px 12px;font-weight:600;font-size:14px;min-height:40px;transition:background var(--t)}
@media (hover:hover){.sb-new:hover{background:var(--accent-2)}}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-md);color:var(--text-2);font-size:14px;font-weight:500;min-height:40px;transition:background var(--t),color var(--t)}
@media (hover:hover){.sb-item:hover{background:var(--surface-2);color:var(--text)}}
.sb-item[aria-current="page"],.sb-item[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-count{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-3);background:var(--surface-2);border-radius:99px;padding:1px 7px;min-width:22px;text-align:center}
.sb-sec{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:16px 10px 6px;white-space:nowrap}
.sb-dot{width:9px;height:9px;border-radius:3px;flex:none}
.sb-foot{border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sb-toggle{flex:none}
/* rótulos escondidos quando o menu está só com ícones */
@media (min-width:768px) and (max-width:1023px){
  .sidebar:not(.exp) .lbl,.sidebar:not(.exp) .sb-count,.sidebar:not(.exp) .sb-sec,.sidebar:not(.exp) .sb-new span,.sidebar:not(.exp) .sb-name{display:none}
  .sidebar:not(.exp) .sb-item,.sidebar:not(.exp) .sb-new{justify-content:center;padding:8px}
  .sidebar:not(.exp) .sb-head{flex-direction:column;padding:12px 8px 8px}
  .sidebar:not(.exp) .sb-sec-line{display:block}
}
@media (min-width:1024px){
  .sidebar.compacta .lbl,.sidebar.compacta .sb-count,.sidebar.compacta .sb-sec,.sidebar.compacta .sb-new span,.sidebar.compacta .sb-name{display:none}
  .sidebar.compacta .sb-item,.sidebar.compacta .sb-new{justify-content:center;padding:8px}
  .sidebar.compacta .sb-head{flex-direction:column;padding:12px 8px 8px}
  .sidebar.compacta .sb-sec-line{display:block}
}
.sb-sec-line{display:none;height:1px;background:var(--border);margin:10px 6px}

/* ---- Barra inferior (mobile) ---- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bb-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px 6px;min-height:58px;color:var(--text-3);position:relative;min-width:0}
.bb-item[aria-current="page"]{color:var(--accent)}
/* aba ativa: pílula atrás do ícone (não depende só da cor) */
.bb-ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background var(--t)}
.bb-item[aria-current="page"] .bb-ic{background:var(--accent-soft)}
.bb-lbl{font-size:12px;font-weight:600;white-space:nowrap}
.bb-badge{position:absolute;top:2px;left:50%;margin-left:8px;background:var(--accent);color:var(--accent-on);font-size:11px;font-weight:700;border-radius:99px;padding:0 5px;min-width:18px;height:18px;line-height:18px;text-align:center}
.bb-badge.warn{background:var(--warn);color:#fff}
@media (min-width:768px){.bottombar{display:none}}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;box-shadow:var(--shadow-3);transition:transform var(--t)}
.fab:active{transform:scale(.94)}
@media (min-width:768px){.fab{bottom:24px;right:24px}}
@media (min-width:1024px){.fab{display:none}}

/* ---- Topbar ---- */
.topbar{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 14px 0}
@media (min-width:768px){.topbar{padding:10px 20px 0}}
@media (min-width:1280px){.topbar{padding:12px 28px 0}}
.tb-main{display:flex;align-items:center;gap:8px;min-height:44px}
.tb-title{font-size:19px;font-weight:680;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1024px){.tb-title{font-size:22px}}
.tb-sub{font-size:12.5px;color:var(--text-3);font-weight:500;margin-left:4px}
.tb-spacer{flex:1}
.tb-search{position:relative;display:none}
@media (min-width:1024px){.tb-search{display:block;width:300px}}
.tb-search input{width:100%;height:38px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);padding:0 32px 0 34px;font-size:14px}
.tb-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tb-search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.tb-search .sx{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--text-3);width:30px;height:30px;display:grid;place-items:center;border-radius:6px}
.busca-mob{display:inline-grid}
@media (min-width:1024px){.busca-mob{display:none}}
/* no celular a linha de ferramentas tem só a visão e "Filtros (n)" — nada escondido à direita */
.tb-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0 10px}
.tb-chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
/* ao rolar para baixo no celular, ferramentas e chips recolhem; voltam ao rolar para cima */
.tb-extra{display:grid;grid-template-rows:1fr;transition:grid-template-rows 200ms ease,opacity 200ms ease}
.tb-extra>div{min-height:0;overflow:hidden}
@media (max-width:767px){.topbar.recolhida .tb-extra{grid-template-rows:0fr;opacity:0}}
.tb-tools .seg .rot-v{display:inline}
@media (max-width:399px){.tb-tools .seg .rot-v{display:none}.tb-tools .seg button{padding:0 12px}}

/* ---- Botões e chips ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13.5px;font-weight:550;white-space:nowrap;transition:background var(--t),border-color var(--t),color var(--t);flex:none}
@media (hover:hover){.btn:hover{background:var(--surface-2);color:var(--text)}}
.btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.prim{background:var(--accent);border-color:transparent;color:var(--accent-on)}
@media (hover:hover){.btn.prim:hover{background:var(--accent-2)}}
.btn.dngr{color:var(--danger);border-color:var(--danger-bd);background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:transparent}
@media (hover:hover){.btn.ghost:hover{background:var(--surface-2)}}
.btn.sm{height:30px;font-size:12.5px;padding:0 9px;gap:4px}
.btn.blk{width:100%;flex:1 1 0;min-width:0;justify-content:center}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-md);color:var(--text-2);transition:background var(--t),color var(--t);flex:none}
@media (hover:hover){.icon-btn:hover{background:var(--surface-2);color:var(--text)}}
.icon-btn.sm{width:30px;height:30px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-md);padding:2px;gap:2px;border:1px solid var(--border);flex:none}
.seg button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-3);display:inline-flex;align-items:center;gap:5px;transition:all var(--t)}
.seg button.on,.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.seg .cnt{font-size:11px;background:var(--surface-3);border-radius:99px;padding:0 6px;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);white-space:nowrap;max-width:100%}
.chip .x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;margin-right:-4px;color:var(--text-3)}
@media (hover:hover){.chip .x:hover{background:var(--surface-3);color:var(--text)}}
.chip.clickable{cursor:pointer}
@media (hover:hover){.chip.clickable:hover{background:var(--surface-3)}}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip .dot,.dot{width:8px;height:8px;border-radius:3px;flex:none;display:inline-block}

/* ---- Campo editável (chip de campo) ---- */
.fc{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:2px 9px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12px;font-weight:600;max-width:100%;transition:background var(--t),border-color var(--t),color var(--t);text-align:left;line-height:1.3}
@media (hover:hover){button.fc:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--text)}}
.fc .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fc .rot{font-weight:600;opacity:.8}
.fc.vazio{border-style:dashed;color:var(--text-3);font-weight:550;background:transparent}
.fc.estatico{background:transparent;border-color:transparent;padding-left:2px;padding-right:2px}
.fc.st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,var(--text-3));flex:none}
.fc.st{background:color-mix(in srgb,var(--c,#888) 11%,var(--surface));border-color:color-mix(in srgb,var(--c,#888) 32%,var(--border));color:var(--text)}
.fc.sev-venc{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-bd)}
.fc.sev-hoje{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-bd)}
.fc.sev-prox{color:var(--caution);background:var(--caution-soft);border-color:var(--caution-bd)}
.fc .rec{opacity:.85}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:11px 12px 10px;box-shadow:var(--shadow-1);transition:box-shadow var(--t),border-color var(--t),opacity var(--t);position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-2);border-color:var(--border-2)}}
.card.lemb{border-left:3px solid var(--lemb);padding-left:10px}
.card.done{opacity:.6}
.card.done .c-title{text-decoration:line-through;text-decoration-color:var(--text-3)}
.card.dragging{opacity:.35}
/* segurar para arrastar (toque): o card cresce um pouco enquanto espera */
.card.pressionando,.foco-row.pressionando{transform:scale(1.02);box-shadow:var(--shadow-2);transition:transform 420ms ease,box-shadow 420ms ease}
.card.drop-in{animation:pop 260ms ease}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
.c-motivo{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;margin-bottom:6px}
.c-motivo.sev-venc{color:var(--danger)}.c-motivo.sev-hoje{color:var(--warn)}.c-motivo.sev-prox{color:var(--caution)}.c-motivo.sev-{color:var(--text-3)}
.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:11.5px;color:var(--text-3);margin-bottom:3px;min-width:0}
.c-sep{opacity:.6}
.c-tipo{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.c-tipo.lemb{color:var(--lemb)}
.c-tipo .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lcell .c-tipo{max-width:100%}
.c-proj{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0;color:var(--text-3);font-weight:550;font-size:12px;border-radius:6px;padding:2px 4px;margin:-2px -4px}
@media (hover:hover){.c-proj:hover{color:var(--text);background:var(--surface-2)}}
.c-proj .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-proj.vazio{font-style:italic}
.c-title{display:block;width:100%;text-align:left;font-size:15px;font-weight:650;line-height:1.35;letter-spacing:-.01em;color:var(--text);border-radius:6px;overflow-wrap:anywhere}
@media (hover:hover){.c-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}}
.c-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;font-size:13px;color:var(--text-2);margin-top:3px;width:100%;border-radius:6px;overflow-wrap:anywhere}
@media (hover:hover){button.c-desc:hover{background:var(--surface-2)}}
.c-ult{font-size:12.5px;color:var(--text-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;border-left:2px solid var(--border-2);padding-left:8px}
.c-ult .tm{color:var(--text-3);font-size:11.5px}
/* texto cortado: degradê no fim e um "mais" discreto (marcado via JS só quando há conteúdo escondido) */
.c-desc.trunc,.c-ult.trunc{position:relative}
.c-desc.trunc::after,.c-ult.trunc::after{content:'mais';position:absolute;right:0;bottom:0;padding-left:28px;font-size:11.5px;font-weight:650;color:var(--accent);background:linear-gradient(90deg,transparent,var(--surface) 26px)}
.lrow .c-desc.trunc::after,.lrow .c-ult.trunc::after{background:linear-gradient(90deg,transparent,var(--surface) 26px)}
/* próxima ação (GTD) */
.c-prox{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-bd);border-radius:99px;padding:0 7px;height:20px;white-space:nowrap;flex:none}
.c-alerta{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-size:12px;font-weight:650;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-bd);border-radius:var(--r-sm);padding:5px 8px;margin-top:8px;min-height:32px}
@media (hover:hover){.c-alerta:hover{border-color:var(--warn)}}
.fc.prox{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-soft)}
.fc.alerta{color:var(--warn);border-color:var(--warn-bd);background:var(--warn-soft)}
.c-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.c-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);flex-wrap:wrap}
details.mais{margin-top:6px;border-top:1px dashed var(--border);padding-top:6px}
details.mais summary{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--text-3);padding:8px 0;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
details.mais summary::-webkit-details-marker{display:none}
details.mais summary::before{content:'▸';transition:transform var(--t)}
details.mais[open] summary::before{transform:rotate(90deg)}
@media (hover:hover){details.mais summary:hover{color:var(--text)}}
.c-foot .sp{flex:1}
/* Concluir: círculo compacto (padrão To Do/Todoist). Lembretes também se concluem, com o círculo na cor do lembrete. */
.chk{position:relative;flex:none;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--border-2);display:grid;place-items:center;color:transparent;background:var(--surface);transition:border-color var(--t),background var(--t),color var(--t),transform var(--t)}
.chk::after{content:'';position:absolute;inset:-11px}
@media (hover:hover){.chk:hover{border-color:var(--ok);color:var(--ok)}}
.chk:active{transform:scale(.9)}
.chk.feito{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .chk.feito{color:#06210f}
@media (hover:hover){.chk.feito:hover{background:var(--surface);color:var(--ok)}}
.chk.lemb{border-color:color-mix(in srgb,var(--lemb) 60%,var(--border));background:var(--lemb-soft)}
@media (hover:hover){.chk.lemb:hover{border-color:var(--lemb);color:var(--lemb)}}
/* microinteração de concluir: o círculo "estoura" e preenche */
.chk.anim{animation:chkPop 420ms cubic-bezier(.2,.8,.25,1)}
@keyframes chkPop{0%{transform:scale(.7)}45%{transform:scale(1.28)}70%{transform:scale(.94)}100%{transform:scale(1)}}
.chk.anim::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ok);animation:chkAnel 520ms ease-out forwards;pointer-events:none}
@keyframes chkAnel{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}
.c-trow{display:flex;align-items:flex-start;gap:9px;min-width:0}
.c-trow .chk{margin-top:1px}
.c-trow .c-title{flex:1;min-width:0}
.card .c-menu{position:absolute;top:6px;right:6px;color:var(--text-3)}
@media (hover:hover){.card .c-menu:hover{color:var(--text)}}
.card>.c-motivo,.card>.c-meta:first-of-type,.card>.c-trow:first-child{padding-right:30px}
.btn-acao{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:600;white-space:nowrap}
@media (hover:hover){.btn-acao:hover{background:var(--surface-2);color:var(--text)}}
.prog-wrap{display:flex;align-items:center;gap:7px;margin-top:9px;min-width:0;width:100%;border-radius:6px;padding:3px 4px;margin-left:-4px;margin-right:-4px;width:calc(100% + 8px)}
@media (hover:hover){button.prog-wrap:hover{background:var(--surface-2)}}
button.prog-wrap .chev{color:var(--text-3);transition:transform var(--t)}
button.prog-wrap[aria-expanded="true"] .chev{transform:rotate(180deg)}
.prog{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:1;min-width:50px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width var(--t)}
.prog-lbl{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
/* tarefas do projeto expandidas, ligadas visualmente ao card */
.subs{position:relative;margin:-2px 0 0 14px;padding:6px 0 2px 16px;display:flex;flex-direction:column;gap:6px}
.subs::before{content:'';position:absolute;left:0;top:-6px;bottom:18px;width:2px;background:color-mix(in srgb,var(--accent) 40%,var(--border));border-radius:2px}
.subs>.sub{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-1)}
.subs>.sub::before{content:'';position:absolute;left:-16px;top:18px;width:14px;height:2px;background:color-mix(in srgb,var(--accent) 40%,var(--border))}
.subs .vazio-sub{font-size:12.5px;color:var(--text-3);padding:4px 2px}
/* rascunho do "+ Adicionar" */
.card.rascunho{border:1.5px dashed var(--accent);box-shadow:0 0 0 3px var(--accent-soft);-webkit-user-select:auto;user-select:auto}
.card.rascunho .kcol-input{border:none;box-shadow:none;padding:4px 0;font-size:14.5px;font-weight:600;background:transparent}
.rasc-dica{font-size:11.5px;color:var(--text-3);margin-top:4px}
.add-row{padding:6px 0 4px}
.add-grupo{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r-sm);color:var(--text-3);font-size:13px;font-weight:550;min-height:36px}
@media (hover:hover){.add-grupo:hover{background:var(--surface-2);color:var(--text)}}

/* ---- Grupos ---- */
.grupo{margin-bottom:14px}
.grupo-h{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;border-radius:var(--r-sm);font-size:12.5px;font-weight:680;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;min-height:34px}
@media (hover:hover){.grupo-h:hover{background:var(--surface-2)}}
.grupo-h .cnt{font-size:11.5px;color:var(--text-3);background:var(--surface-2);border-radius:99px;padding:0 7px;font-weight:650;letter-spacing:0}
.grupo-h .chev{transition:transform var(--t);color:var(--text-3)}
.grupo.col .chev{transform:rotate(-90deg)}
.grupo.col .grupo-body{display:none}
.grupo-body{padding-top:6px}
.cards{display:flex;flex-direction:column;gap:8px}

/* ---- Lista (grade no desktop quando cabe; cards quando não cabe ou no mobile) ---- */
.lista-wrap{overflow-x:auto;padding-bottom:4px}
.lista{min-width:var(--minw,0);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.lista .grupo{margin:0}
.lista .grupo-h{border-radius:0;padding:8px 12px;background:var(--surface-2);border-top:1px solid var(--border);font-size:11.5px}
.lista .grupo:first-of-type .grupo-h{border-top:0}
.lista .grupo-body{padding:0}
.lhead{display:grid;gap:10px;align-items:end;padding:10px 12px 8px;font-size:11px;font-weight:650;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--surface)}
.lhead>div{position:relative;min-width:0;line-height:1.25}
.lhead button{display:inline-flex;align-items:center;gap:3px;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:2px 0;border-radius:4px;text-align:left}
@media (hover:hover){.lhead button:hover{color:var(--text)}}
/* alça de redimensionar coluna */
.rsz{position:absolute;top:-6px;bottom:-8px;right:-8px;width:12px;cursor:col-resize;touch-action:none;z-index:2;display:flex;justify-content:center}
.rsz::before{content:'';width:2px;height:100%;border-radius:2px;background:transparent;transition:background var(--t)}
.rsz:focus-visible::before,.rsz.ativo::before{background:var(--accent)}
@media (hover:hover){.lhead>div:hover .rsz::before{background:var(--accent)}}
.rsz:focus-visible{outline:none}
.lrow{display:grid;gap:10px;align-items:center;padding:7px 12px;background:var(--surface);border-top:1px solid var(--border);transition:background var(--t);font-size:13px}
.lista>.lrow:first-of-type,.grupo-body>.lrow:first-child{border-top:0}
@media (hover:hover){.lrow:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}}
.lrow.lemb{box-shadow:inset 3px 0 0 var(--lemb)}
.lrow.done{opacity:.6}
.lrow.done .c-title{text-decoration:line-through}
.lrow.sub{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.lrow.sub .lcell:first-child{position:relative;padding-left:22px}
.lrow.sub .lcell:first-child::before{content:'';position:absolute;left:6px;top:-12px;height:24px;width:10px;border-left:2px solid color-mix(in srgb,var(--accent) 40%,var(--border));border-bottom:2px solid color-mix(in srgb,var(--accent) 40%,var(--border));border-bottom-left-radius:6px}
.lhead,.lrow{grid-template-columns:var(--gtc)}
.lcell{min-width:0}
/* ações sempre visíveis, mesmo com rolagem horizontal */
.lacoes{position:sticky;right:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;align-self:stretch;background:inherit;padding-left:6px;margin-right:-4px}
.lhead .lacoes{background:var(--surface)}
.lcell .c-trow{align-items:flex-start;gap:8px}
.lcell .c-title{font-size:13.5px;font-weight:600;line-height:1.35}
.lcell .c-desc{-webkit-line-clamp:2;margin:0;font-size:12.5px}
.lcell .c-ult{-webkit-line-clamp:2;margin:0;font-size:12px}
.lcell .prog-wrap{margin:0;width:100%}
/* na lista, os valores parecem texto de tabela: sem pílula, com fundo só ao passar o mouse */
.lista .lcell .fc{border-color:transparent;background:transparent;padding:3px 6px;margin-left:-6px;font-weight:550;font-size:12.5px;color:var(--text-2);min-height:26px}
@media (hover:hover){.lista .lcell button.fc:hover{background:var(--surface-2);border-color:var(--border)}}
.lista .lcell .fc.st{background:transparent;color:var(--text)}
.lista .lcell .fc.sev-venc,.lista .lcell .fc.sev-hoje,.lista .lcell .fc.sev-prox{background:transparent;border-color:transparent}
.lista .lcell .fc.vazio{color:var(--text-3);font-weight:500}
.lista .lcell .c-proj{font-size:12.5px}
/* truncar (quebra desligada) */
html:not(.quebra) .lista .lcell .c-title,html:not(.quebra) .lista .lcell .fc .v,html:not(.quebra) .lista .lcell .c-proj .v,html:not(.quebra) .lista .lhead button,html:not(.quebra) .lista .lhead>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html:not(.quebra) .lista .lcell .c-title{display:block}
html:not(.quebra) .lista .lcell .fc{max-width:100%}
html:not(.quebra) .lista .lcell .c-desc,html:not(.quebra) .lista .lcell .c-ult{-webkit-line-clamp:1}
html:not(.quebra) .lista-m .c-title,html:not(.quebra) .fr-tit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html:not(.quebra) .lista-m .c-desc{-webkit-line-clamp:1}
/* quebrar linhas (padrão em todas as seções e visões): nada fica cortado com reticências */
html.quebra .c-tipo .v{white-space:nowrap;overflow:visible}
html.quebra .fc,html.quebra .fc .v,html.quebra .c-proj,html.quebra .c-proj .v,html.quebra .fr-proj .v,html.quebra .lhead button,
html.quebra .kcol-h .nm,html.quebra .menu button span.t,html.quebra .sb-item .lbl,html.quebra .busca-r .s,html.quebra .pend span,html.quebra .conc-meta .v{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
html.quebra .fc{height:auto}
html.quebra .lista .lcell .c-desc,html.quebra .lista .lcell .c-ult,html.quebra .lista-m .c-desc,html.quebra .foco .c-desc{-webkit-line-clamp:unset;display:block}
html.quebra .kanban .c-desc{-webkit-line-clamp:4}
html.quebra .lista .lrow{align-items:start}
html.quebra .c-proj{align-items:flex-start}
html.quebra .c-proj svg,html.quebra .fr-proj svg{margin-top:2px}
html.quebra .fr-proj{align-items:flex-start}
html.quebra .sb-item{align-items:center;line-height:1.3;padding-top:9px;padding-bottom:9px}
/* cards de lista (mobile ou quando a grade não cabe) */
.lista-m .card{padding:10px 12px}
.lista-m .c-title{font-size:14.5px}
.cell-motivo{font-size:11px;font-weight:650;display:flex;align-items:center;gap:4px;margin-top:3px}
.cell-motivo.sev-venc{color:var(--danger)}.cell-motivo.sev-hoje{color:var(--warn)}.cell-motivo.sev-prox{color:var(--caution)}.cell-motivo.sev-{color:var(--text-3)}
.fora-periodo{font-size:10.5px;font-weight:650;color:var(--text-3);background:var(--surface);border:1px dashed var(--border-2);border-radius:99px;padding:0 6px;white-space:nowrap}

/* ---- Modo Foco (lista de tarefas mobile first) ---- */
.foco{max-width:760px;margin:0 auto}
.foco-add{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:4px 12px;margin-bottom:14px;box-shadow:var(--shadow-1)}
.foco-add .mais{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.foco-add input{flex:1;border:0;background:transparent;font-size:15px;min-height:48px;color:var(--text)}
.foco-add input:focus{outline:none}
.foco-add:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.foco .grupo{margin-bottom:12px}
.foco-lista{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.foco-row{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--border);min-height:56px;transition:background var(--t),opacity 300ms}
.foco-lista>.foco-row:first-child{border-top:0}
@media (hover:hover){.foco-row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}}
.foco-row .chk{margin-top:2px}
.foco-row.lemb{box-shadow:inset 3px 0 0 var(--lemb)}
.foco-row.done .fr-tit{text-decoration:line-through;color:var(--text-3)}
.foco-row.done{opacity:.7}
.fr-corpo{flex:1;min-width:0}
.fr-proj{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3);font-weight:550;margin-bottom:1px;min-width:0}
.fr-proj .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-proj.lemb{color:var(--lemb)}
.fr-tit{display:block;width:100%;text-align:left;font-size:15px;font-weight:550;line-height:1.35;color:var(--text);overflow-wrap:anywhere;border-radius:5px}
@media (hover:hover){.fr-tit:hover{color:var(--accent)}}
.fr-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
.fr-meta .fc{min-height:24px;padding:1px 8px;font-size:11.5px}
.foco-row .icon-btn.sm{margin:-4px -6px 0 0;color:var(--text-3)}
.subs>.sub.foco-row{min-height:0;padding:9px 10px}
.subs>.sub .fr-tit{font-size:13.5px}
/* Foco: arrastar para ordenar (ordem personalizada) */
.foco-row[data-foco-id]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.foco-row.sorting{opacity:.35}
.fr-hdl{display:none;position:absolute;left:0;top:0;bottom:0;width:14px;cursor:grab;color:var(--text-3);align-items:center;justify-content:center}
@media (hover:hover) and (pointer:fine){.foco-row[data-foco-id] .fr-hdl{display:flex;opacity:0;transition:opacity var(--t)}.foco-row[data-foco-id]:hover .fr-hdl{opacity:1}}
.foco-ordem{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin:-6px 0 10px;flex-wrap:wrap}
/* data vazia: discreta, mas clicável */
.fc.sem-data{border-style:dashed;border-color:var(--border);color:var(--text-3);background:transparent;font-weight:550}
@media (hover:hover){.fc.sem-data{opacity:.75}.foco-row:hover .fc.sem-data,.lrow:hover .fc.sem-data,.fc.sem-data:focus-visible{opacity:1}button.fc.sem-data:hover{color:var(--text);border-color:var(--border-2)}}

/* ---- Sheet empilhado (editores abertos de dentro de um formulário no celular) ---- */
.sheet.pop-sheet{z-index:82}
.scrim.pop{z-index:81}

/* ---- Kanban ---- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 12px;scroll-snap-type:x mandatory;margin:0 -14px;align-items:flex-start}
@media (min-width:768px){.kanban{margin:0;padding:2px 0 12px;scroll-snap-type:none}}
.kcol{flex:none;width:86vw;max-width:340px;min-width:250px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);scroll-snap-align:center;transition:background var(--t),border-color var(--t),box-shadow var(--t)}
@media (min-width:768px){.kcol{width:290px}}
@media (min-width:1440px){.kcol{width:310px}}
.kcol.over{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kcol-h{display:flex;align-items:center;gap:7px;padding:10px 12px 8px;min-height:44px}
.kcol-h .nm{font-size:12.5px;font-weight:680;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol-h .cnt{font-size:11.5px;font-weight:650;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:0 7px}
.kcol-h .cdot{width:9px;height:9px;border-radius:50%;flex:none}
.kcol-body{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px;min-height:60px}
@media (min-width:768px){.kcol-body{overflow-y:auto;max-height:calc(100dvh - 290px)}}
.kcol-foot{padding:4px 8px 8px}
.kcol-add{display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;border-radius:var(--r-sm);color:var(--text-3);font-size:13px;font-weight:550;min-height:36px}
@media (hover:hover){.kcol-add:hover{background:var(--surface);color:var(--text)}}
.kcol-input,.inp-inline{width:100%;border:1px solid var(--accent);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px;background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.kcol-input:focus,.inp-inline:focus{outline:none}
.kcol.novo{background:transparent;border-style:dashed;justify-content:flex-start;padding:10px}
/* kanban no celular: abas fixas com nome e contagem de cada coluna (tocar leva à coluna); os pontos reforçam */
.ktabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--tb-h,0px);z-index:20;background:var(--bg);margin:0 -14px;padding:6px 14px 6px}
.ktabs::-webkit-scrollbar{display:none}
.ktabs button{display:inline-flex;align-items:center;gap:6px;flex:none;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.ktabs button .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.ktabs button .cnt{font-size:11.5px;color:var(--text-3);font-weight:650}
.ktabs button[aria-current="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.ktabs button[aria-current="true"] .cnt{color:var(--accent)}
@media (min-width:768px){.ktabs{display:none}}
.kdots{display:flex;gap:5px;justify-content:center;padding:2px 0 10px}
@media (min-width:768px){.kdots{display:none}}
.kdots i{width:6px;height:6px;border-radius:50%;background:var(--border-2);transition:all var(--t)}
.kdots i.on{background:var(--accent);width:18px;border-radius:99px}
.kcol-conc{display:flex;align-items:center;gap:6px;width:100%;padding:8px;border-radius:var(--r-sm);border:1px dashed var(--border-2);color:var(--text-3);font-size:12.5px;font-weight:600;min-height:40px;justify-content:center}
@media (hover:hover){.kcol-conc:hover{color:var(--text);background:var(--surface)}}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.95;transform:rotate(-1.5deg) scale(1.02);box-shadow:var(--shadow-3)}
/* zonas de soltar fixas no rodapé durante o arrasto no celular (nomes das colunas como alvos) */
.dropbar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:96;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);animation:slideUp 180ms ease}
.dropbar .dz{flex:1 1 calc(33% - 6px);min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:4px 8px;border-radius:var(--r-md);border:1.5px dashed var(--border-2);font-size:12.5px;font-weight:650;color:var(--text-2);text-align:center;line-height:1.2}
.dropbar .dz .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.dropbar .dz.over{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dropbar .dz.atual{opacity:.45}

/* ---- Estados vazios ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:48px 20px;color:var(--text-3)}
.empty .ttl{font-size:16px;font-weight:650;color:var(--text)}
.empty .sub{font-size:13.5px;max-width:340px}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* no celular: CTA de largura cheia, mais perto do polegar */
@media (max-width:767px){
  .empty{padding:28px 8px;min-height:52dvh;justify-content:flex-end}
  .empty .acts{width:100%;flex-direction:column;margin-top:10px}
  .empty .acts .btn{width:100%;height:48px;justify-content:center;font-size:15px}
}

.hdl{cursor:grab;color:var(--text-3);display:grid;place-items:center;width:24px;height:28px;border-radius:6px;touch-action:none;flex:none}
@media (hover:hover){.hdl:hover{background:var(--surface-3);color:var(--text)}}
.sorting{opacity:.35}
.kcol-h .nm-in{flex:1;min-width:0;height:30px;border:1px solid var(--border-2);border-radius:6px;padding:0 7px;font-size:12.5px;font-weight:650;background:var(--surface)}
.kcol-h .nm-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cor-in{width:24px;height:24px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.erow{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:6px;flex-wrap:wrap}
.erow .inp{flex:1;min-width:80px;min-height:34px;padding:5px 9px}
.erow .icon-btn.sm{width:34px}
@media (max-width:480px){.erow .badge .t{display:none}.erow .badge{padding:6px}}
.seg button{white-space:nowrap}
.etabs{max-width:100%;overflow-x:auto}
.erow.off{opacity:.6}
.cat-sem-dot{width:14px;height:14px;border-radius:50%;background:var(--text-3);margin:0 9px;flex:none}
.cat-sem-nm{flex:1;min-width:80px;padding:5px 9px;font-size:14px;color:var(--text-2)}
.btn.icon-only{padding-left:9px;padding-right:9px}
.etabs{margin-bottom:14px}
.egrid{display:grid;gap:16px}
@media (min-width:1024px){.egrid.tres{grid-template-columns:repeat(3,1fr)}.egrid.dois{grid-template-columns:repeat(2,1fr)}}
.ebox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.ebox h3{font-size:14px;font-weight:680;margin-bottom:4px}
.ebox .muted{display:block;margin-bottom:10px}

/* ---- Sheets / pop / painel ---- */
.scrim{position:fixed;inset:0;background:rgba(12,14,20,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--t)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow-3);max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 220ms cubic-bezier(.2,.8,.25,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
@media (min-width:768px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:460px;max-width:calc(100vw - 32px);border-radius:var(--r-lg);transform:translate(-50%,-46%) scale(.97);opacity:0;max-height:86dvh;transition:transform var(--t),opacity var(--t)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--border)}
.sheet-h h2{font-size:15.5px;font-weight:670;flex:1}
.sheet-b{overflow-y:auto;padding:14px 16px;flex:1;overscroll-behavior:contain}
.sheet-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.grab{width:36px;height:4px;border-radius:99px;background:var(--border-2);margin:8px auto 0}
@media (min-width:768px){.grab{display:none}}
/* arrastar para baixo fecha (puxador e cabeçalho) */
@media (max-width:767px){.sheet .grab{margin:0 auto;box-sizing:content-box;border:8px solid transparent;border-bottom-width:4px;background-clip:padding-box;touch-action:none}.sheet .sheet-h{touch-action:none}}
.sheet.arrastando,.panel.arrastando{transition:none}
/* menu de ações como sheet no celular */
.menu-sheet{z-index:90}
.scrim.menu{z-index:89}
.menu-sheet .sheet-b{padding:6px 8px 10px}
.menu-sheet .sheet-h{padding-top:6px}
.menu-sheet button[role="menuitem"]{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-md);font-size:15px;text-align:left;color:var(--text)}
.menu-sheet button[role="menuitem"]:active{background:var(--surface-2)}
.menu-sheet button[role="menuitem"]:disabled{opacity:.5}
.menu-sheet button.dngr{color:var(--danger)}
.menu-sheet button .ck{margin-left:auto;color:var(--accent)}
.menu-sheet button span.t{flex:1;min-width:0}
.menu-sheet hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.menu-sheet .mt{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px 4px}
.pop{position:fixed;z-index:85;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:12px;width:304px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto}
.pop-t{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.panel{position:fixed;inset:0;z-index:65;background:var(--surface);display:flex;flex-direction:column;transform:translateY(100%);transition:transform 240ms cubic-bezier(.2,.8,.25,1);visibility:hidden}
.panel.on{transform:translateY(0);visibility:visible}
@media (min-width:1024px){.panel{left:auto;width:460px;border-left:1px solid var(--border);box-shadow:var(--shadow-3);transform:translateX(100%)}.panel.on{transform:translateX(0)}}
.panel-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);min-height:52px;padding-top:calc(8px + env(safe-area-inset-top))}
@media (min-width:1024px){.panel-h{padding-top:8px}}
@media (max-width:1023px){.panel-h{touch-action:none;position:relative}.panel-h::before{content:'';position:absolute;top:calc(4px + env(safe-area-inset-top));left:50%;width:36px;height:4px;margin-left:-18px;border-radius:99px;background:var(--border-2)}}
.panel-b{flex:1;overflow-y:auto;padding:14px 16px 20px;min-height:0;overscroll-behavior:contain}
.panel-feed{border-top:1px solid var(--border);display:flex;flex-direction:column;min-height:0;flex:none;max-height:42dvh}
/* teclado virtual aberto (visualViewport): painel e sheets cabem na área visível */
@media (max-width:1023px){html.teclado .panel.on{top:var(--vv-top,0px);bottom:auto;height:var(--vv-h,100dvh)}html.teclado .panel-feed{max-height:28dvh}}
@media (max-width:767px){html.teclado .sheet{bottom:var(--kb,0px);max-height:calc(var(--vv-h,88dvh) - 12px)}html.teclado .bottombar,html.teclado .fab{display:none}}

/* ---- Formulários ---- */
.field{margin-bottom:12px}
.field>label,.flabel{display:block;font-size:11.5px;font-weight:650;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;font-size:14px;min-height:40px;color:var(--text);transition:border-color var(--t),box-shadow var(--t)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.5}
select.inp{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238b94a5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
.inp-title,textarea.inp-title{font-size:18px;font-weight:680;letter-spacing:-.015em;border-color:transparent;background:transparent;padding:6px 8px;margin-left:-8px;width:calc(100% + 16px);resize:none;min-height:0;overflow:hidden}
@media (hover:hover){.inp-title:hover{background:var(--surface-2)}}
.hint{font-size:12px;color:var(--text-3);margin-top:6px;display:flex;align-items:flex-start;gap:5px}
.hint svg{margin-top:2px}
.hint.warn{color:var(--warn)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;min-height:44px}
.switch .tx{font-size:14px;font-weight:550}
.switch .tx small{display:block;font-size:12px;color:var(--text-3);font-weight:400}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--surface-3);position:relative;flex:none;transition:background var(--t);border:1px solid var(--border-2)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:transform var(--t)}
.toggle.on{background:var(--accent);border-color:transparent}
.toggle.on::after{transform:translateX(18px)}
.opt-list{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:var(--r-md);font-size:14px;text-align:left;min-height:44px}
@media (hover:hover){.opt:hover{background:var(--surface-2)}}
.opt .ck{width:18px;height:18px;flex:none;color:var(--accent)}
.opt .box{width:18px;height:18px;border-radius:5px;border:1.8px solid var(--border-2);flex:none;display:grid;place-items:center;color:transparent}
.opt .box.on{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.opt.on{font-weight:600}
.sect-t{font-size:11.5px;font-weight:680;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.sect-t:first-child{margin-top:0}
.divider{height:1px;background:var(--border);margin:14px 0}
.frow{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center;padding:5px 0;min-height:40px}
.frow .flabel{margin:0;text-transform:none;letter-spacing:0;font-size:13px;font-weight:550;color:var(--text-3)}
.frow.bloco{grid-template-columns:1fr;gap:5px}
/* telas estreitas: rótulo em cima, valor embaixo */
@media (max-width:399px){.frow{grid-template-columns:1fr;gap:4px;padding:6px 0}}
.fval .prog-wrap{flex:1;min-width:180px;max-width:420px;margin:0}
.fval{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.box-info{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin:12px 0}
.box-info.lemb{background:var(--lemb-soft);border-color:var(--lemb-bd)}
.box-info .flabel{margin-bottom:6px}
.pend-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pend{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13.5px;background:var(--surface-2)}
.pend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Menu ---- */
.menu{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-3);padding:5px;min-width:210px;max-width:min(300px,calc(100vw - 20px));max-height:min(60vh,420px);overflow-y:auto;overscroll-behavior:contain}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:13.5px;text-align:left;min-height:40px;color:var(--text-2)}
.menu button:focus-visible{background:var(--surface-2);color:var(--text)}
@media (hover:hover){.menu button:hover:not(:disabled){background:var(--surface-2);color:var(--text)}}
.menu button.dngr{color:var(--danger)}
@media (hover:hover){.menu button.dngr:hover{background:var(--danger-soft)}}
.menu button .ck{margin-left:auto;color:var(--accent)}
.menu button span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .mt{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 2px}

/* ---- Date picker ---- */
.dp-at{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dp-at button{height:28px;padding:0 9px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface)}
@media (hover:hover){.dp-at button:hover{background:var(--surface-2);color:var(--text)}}
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dp-nav strong{font-size:13.5px;font-weight:650}
.sheet .pop-t{display:none}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{font-size:11px;color:var(--text-3);text-align:center;font-weight:650;padding:4px 0}
.dp-d{height:36px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
@media (hover:hover){.dp-d:hover{background:var(--surface-2)}}
.dp-d.fora{color:var(--text-3)}
.dp-d.hj{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.dp-d.sel{background:var(--accent);color:var(--accent-on);font-weight:700}
.dp-sec{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.dp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dp-row label{font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dp-row .inp{min-height:34px;padding:5px 9px;font-size:13px;width:auto;flex:1}
.dp-dias{display:flex;gap:4px;margin-top:8px}
.dp-dias button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);font-size:12px;font-weight:650;color:var(--text-2)}
.dp-dias button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.dp-foot{display:flex;gap:8px;margin-top:12px}
/* no celular (sheet): atalhos grandes em 2 colunas, calendário embaixo */
.sheet .dp-at{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sheet .dp-at button{height:46px;border-radius:var(--r-md);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;gap:1px}
.sheet .dp-at button small{font-size:11px;font-weight:550;color:var(--text-3)}
.dp-at .sem{border-style:dashed;color:var(--text-3)}
.pop .dp-at button small{display:none}

/* ---- Toasts ---- */
/* celular: logo acima da barra inferior, à esquerda do FAB (sem cobri-lo); com um sheet aberto, vai para o topo */
.toasts{position:fixed;left:12px;right:84px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:95;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
body.com-sheet .toasts{bottom:auto;top:calc(10px + env(safe-area-inset-top));right:12px;align-items:center}
@media (min-width:768px){.toasts,body.com-sheet .toasts{top:auto;bottom:24px;left:auto;right:96px;align-items:flex-end}}
@media (min-width:1024px){.toasts{right:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-3);font-size:13.5px;font-weight:550;max-width:min(460px,100%);animation:slideUp 220ms cubic-bezier(.2,.8,.25,1);transition:opacity var(--t),transform var(--t)}
:root[data-theme="dark"] .toast{background:var(--surface-3);color:var(--text);border:1px solid var(--border-2)}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast .msg{flex:1;min-width:0}
.toast button{font-weight:700;color:var(--accent-2);padding:6px 8px;border-radius:6px;font-size:13px;min-height:36px;white-space:nowrap}
:root:not([data-theme="dark"]) .toast button{color:#c7cbff}
@media (hover:hover){.toast button:hover{background:rgba(127,127,127,.2)}}

/* ---- Atividade ---- */
.feed-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center}
.feed{display:flex;flex-direction:column;gap:12px;padding:12px 16px;overflow-y:auto;flex:1;min-height:110px;overscroll-behavior:contain}
.cmt{display:flex;gap:9px;align-items:flex-start}
.avt{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.cmt-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.cmt-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--text-3)}
.cmt-meta button{font-size:11.5px;color:var(--text-3);font-weight:600;padding:2px 4px;border-radius:5px}
@media (hover:hover){.cmt-meta button:hover{color:var(--text);background:var(--surface-2)}}
.logline{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-3)}
.logline .li{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.logline b{font-weight:650;color:var(--text-2)}
.logline .tm{white-space:nowrap;opacity:.85;margin-left:auto;padding-left:6px}
.composer{border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;background:var(--surface)}
@media (min-width:1024px){.composer{padding-bottom:10px}}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:40px;border-radius:var(--r-md);border:1px solid var(--border);padding:9px 11px;font-size:14px;background:var(--surface-2);line-height:1.45}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.send{width:40px;height:40px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-on);display:grid;place-items:center;flex:none}

/* ---- Busca ---- */
.busca-pop{position:absolute;top:calc(100% + 6px);right:0;width:min(520px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);max-height:min(70vh,520px);overflow-y:auto;padding:6px;z-index:75}
.busca-g{padding:8px 8px 3px;font-size:11px;font-weight:680;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.busca-r{display:flex;gap:9px;align-items:flex-start;width:100%;padding:8px;border-radius:var(--r-sm);text-align:left;min-height:44px}
@media (hover:hover){.busca-r:hover{background:var(--surface-2)}}
.busca-r .t{font-size:13.5px;font-weight:560;color:var(--text);display:block}
.busca-r .s{font-size:12px;color:var(--text-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busca-inline .busca-r{border:1px solid var(--border);margin-bottom:6px}
mark{background:color-mix(in srgb,var(--caution) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---- Swipe (Entrada) ---- */
.swipe-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12.5px;font-weight:650;color:#fff;background:linear-gradient(90deg,#067647 0 50%,#475467 50% 100%)}
.swipe-bg span{display:flex;align-items:center;gap:6px}
.swipe-el{position:relative;transition:transform 200ms cubic-bezier(.2,.8,.25,1);touch-action:pan-y}
.swipe-el.swiping{transition:none}
.swipe-bg span{transition:transform 150ms ease,opacity 150ms ease;opacity:.75}
.swipe-wrap.passou-dir .swipe-bg span:first-child,.swipe-wrap.passou-esq .swipe-bg span:last-child{transform:scale(1.15);opacity:1}
/* dica do primeiro uso: o card "espia" para os lados */
.swipe-el.espiar{animation:espiar 1.4s ease 400ms 1}
@keyframes espiar{0%,100%{transform:translateX(0)}30%{transform:translateX(56px)}60%{transform:translateX(-56px)}}

/* ---- Tooltip ---- */
.tip{position:fixed;z-index:100;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-2);opacity:0;transition:opacity 120ms}
.tip.on{opacity:1}
@media (pointer:coarse){.tip{display:none}}
:root[data-theme="dark"] .tip{background:var(--surface-3);color:var(--text);border:1px solid var(--border-2)}

/* ---- Configurações ---- */
.cfg{max-width:680px}
.cfg .card{-webkit-user-select:auto;user-select:auto}
.cat-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-line:last-child{border-bottom:0}

/* ---- Alvos de toque >= 44px em telas de toque ---- */
@media (pointer: coarse){
  .icon-btn{width:44px;height:44px}
  .icon-btn.sm{width:40px;height:40px}
  .btn{height:40px}
  .seg button{height:36px}
  .btn-acao{height:36px}
  .fc{min-height:32px;padding:4px 10px}
  .dp-d{height:42px}
  .hdl{width:40px;height:44px}
  .kcol-add{min-height:44px}
  .cor-in{width:36px;height:36px}
  .kcol-h .nm-in{height:40px}
  .dp-dias{justify-content:space-between}
  .dp-dias button{width:auto;flex:1 1 0;max-width:44px;height:40px}
  .chip .x{width:24px;height:24px}
  /* concluir: círculo maior e mais afastado do título (que abre o item) */
  .chk{width:26px;height:26px}
  .chk::after{inset:-9px}
  .c-trow{gap:12px}
  .foco-row{gap:14px}
  .btn.sm,.chip.clickable,.cmt-meta button,.grupo-h,.c-proj,.dp-at button,.chip .x,.kcol-conc{position:relative}
  .btn.sm::after,.chip.clickable::after,.cmt-meta button::after,.grupo-h::after,.c-proj::after,.dp-at button::after,.chip .x::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;transform:translateY(-50%);height:44px}
  .chip .x::after{left:-10px;right:-10px}
  .send{width:44px;height:44px}
}
/* iOS não aproxima a tela ao focar campos com 16px ou mais */
@media (max-width:767px){
  .inp,.kcol-input,.inp-inline,.dp-row .inp,.erow .inp,.composer textarea,.tb-search input,.foco-add input,.kcol-h .nm-in,.card.rascunho .kcol-input,.conc-busca .inp{font-size:16px}
  .inp-title,textarea.inp-title{font-size:18px}
}

/* ---- Concluídos (arquivo pesquisável) ---- */
.conc{max-width:820px;margin:0 auto}
.conc-busca{position:relative;margin-bottom:12px}
.conc-busca .inp{padding-left:36px}
.conc-busca .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.conc-meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--text-3);margin-top:3px;min-width:0}
.conc-meta>span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.conc-meta .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Lixeira ---- */
.lix{max-width:820px;margin:0 auto}
.lix-lista{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.lix-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--border)}
.lix-row:first-child{border-top:0}
.lix-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-3)}
.lix-corpo{flex:1;min-width:0}
.lix-tit{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;color:var(--text)}
.lix-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lix-prazo.perto{color:var(--warn);font-weight:650}

/* ---- Revisão semanal (GTD) ---- */
.rev{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.rev-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.rev-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rev-n{font-size:24px;font-weight:720;font-variant-numeric:tabular-nums;min-width:36px;text-align:center;color:var(--text-3)}
.rev-box.warn .rev-n{color:var(--warn)}
.rev-box.ok .rev-n{color:var(--ok)}

.rev-tx{flex:1 1 200px;min-width:0}
.rev-t{font-size:14.5px;font-weight:650}
.rev-s{font-size:12.5px;color:var(--text-3)}
.rev-lista{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.rev-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);flex-wrap:wrap}
.rev-item .t{flex:1 1 160px;min-width:0;font-size:13.5px;font-weight:600;text-align:left;overflow-wrap:anywhere}
.rev-item .s{font-size:12px;color:var(--text-3);font-weight:500;display:block}

/* ---- Modelos de estrutura ---- */
.mdl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;flex-wrap:wrap}

.mdl .nm{flex:1 1 180px;min-width:0;font-weight:650;font-size:14px;overflow-wrap:anywhere}
.mdl .nm small{display:block;font-size:12px;color:var(--text-3);font-weight:500}
.mdl-aviso{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--caution-soft);border:1px solid var(--caution-bd);color:var(--caution);border-radius:var(--r-md);padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.mdl-aviso .sp{flex:1}

/* ---- "Mais" (celular) ---- */
.mais-lista{display:flex;flex-direction:column;gap:2px}
.mais-item{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:10px 12px;border-radius:var(--r-md);font-size:15px;font-weight:550;text-align:left;color:var(--text)}
.mais-item:active{background:var(--surface-2)}
.mais-item .t{flex:1;min-width:0}
.mais-item .t small{display:block;font-size:12px;color:var(--text-3);font-weight:450}
.mais-item .n{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--text-2)}
.mais-item .n.warn{background:var(--warn-soft);color:var(--warn)}
.sb-alerta{color:var(--warn);flex:none}
/* kanban no desktop: arrastar o fundo rola para os lados */
@media (pointer:fine){ .kanban{cursor:grab} :where(.kanban .kcol-h, .kanban .kcol-body > *){cursor:auto} }
.kanban.panando{scroll-snap-type:none;cursor:grabbing;user-select:none}
.kanban.panando *{cursor:grabbing !important}
/* Boas-vindas: primeira abertura num aparelho sem login (abaixo dos toasts, acima de tudo o resto) */
.bv{position:fixed;inset:0;z-index:94;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;
  padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));transition:opacity var(--t)}

.bv-in{margin:auto;width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.bv-logo{width:64px;height:64px;border-radius:16px;box-shadow:var(--shadow-2)}
.bv h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.bv-sub{font-size:15px;line-height:1.5;color:var(--text-2)}
.bv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1)}
.bv-card .field:last-of-type{margin-bottom:14px}
.bv-sem{align-self:center;font-size:15px;font-weight:550;color:var(--accent);padding:10px 14px;border-radius:var(--r-md)}
.bv-sem:hover{background:var(--accent-soft)}
.esqueci{display:block;margin:10px auto 0;font-size:13.5px;font-weight:550;color:var(--accent);padding:8px 12px;border-radius:var(--r-md)}
.esqueci:hover{background:var(--accent-soft)}
.esqueci:disabled{opacity:.6}
.bv-nota{font-size:12.5px;line-height:1.5;color:var(--text-3);text-align:center}

<script>
"use strict";
/* =========================================================================

const SCHEMA_VERSION = 3;   // v3: "acompanhamento" virou "lembrete"; lixeira, modelos de estrutura e data de conclusão
const DIAS_LIXEIRA = 30;

};
/** Páginas de apoio (menu lateral e "Mais" no celular). */

  concluidos: {nome:'Concluídos',     icone:'checkSq', dica:'Arquivo pesquisável do que já foi feito'},

};
/** Onde um item pode morar. "futuro" é uma classificação dentro da Entrada. */
const LOCAIS = {entrada:'Entrada', futuro:'Futuro', projetos:'Projetos', tarefas:'Tarefas'};

const FAIXAS = [['vencidos','Vencidos'],['hoje','Hoje'],['amanha','Amanhã'],['semana','Esta semana'],['depois','Depois']];
const PERIODOS = [
  ['hoje-vencidos','Hoje + Vencidos'],['hoje','Hoje'],['vencidos','Vencidos'],['amanha','Amanhã'],
  ['semana','Esta semana'],['prox7','Próximos 7 dias'],['prox30','Próximos 30 dias'],['personalizado','Intervalo personalizado']
];
/** Datas de sistema consideradas em Hoje e nas faixas. */
const DATAS = [['lemb','dataLembrete'],['entrega','dataEntrega']];

/** Campos só de exibição (usados nas visões, não guardam dado próprio). */
const CAMPOS_EXIBICAO = [
  {id:'tipo', nome:'Tipo', exibicao:true, aplica:['projeto','tarefa']},
  {id:'progresso', nome:'Progresso', exibicao:true, aplica:['projeto']},
  {id:'proximaAcao', nome:'Próxima ação', exibicao:true, aplica:['projeto']},
  {id:'comentarios', nome:'Comentários', exibicao:true, aplica:['projeto','tarefa']},
  {id:'ultimoComentario', nome:'Último comentário', exibicao:true, aplica:['projeto','tarefa']},
  {id:'ultimaAtualizacao', nome:'Última atualização', exibicao:true, aplica:['projeto','tarefa']}
];
const TIPOS_CAMPO = {texto:'Texto', numero:'Número', data:'Data', selecao:'Seleção'};
const PALETA = ['#4f46e5','#059669','#d97706','#7c3aed','#0284c7','#dc2626','#db2777','#65a30d','#0e7490','#8b94a5'];

/* =========================================================================
   MÓDULO 2 — UTILITÁRIOS (texto, datas, recorrência)
   ========================================================================= */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = p => (p||'it') + '-' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normaliza(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function agoraISO(){ return new Date().toISOString(); }

function toISO(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function parseISO(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function hojeISO(){ return toISO(new Date()); }
function addDias(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function addMeses(iso, n){
  const d = parseISO(iso), dia = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n);
  const ult = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(dia, ult));
  return toISO(d);
}
function diffDias(a, b){ return Math.round((parseISO(a).getTime() - parseISO(b).getTime())/86400000); }
function inicioSemana(iso){ const d = parseISO(iso); d.setDate(d.getDate() - (d.getDay()+6)%7); return toISO(d); }
function fimSemana(iso){ return addDias(inicioSemana(iso), 6); }
function isoValido(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }

function fmtCurta(iso){
  if(!iso) return '—';
  const d = parseISO(iso), hj = parseISO(hojeISO());
  const s = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  return d.getFullYear() !== hj.getFullYear() ? s + '/' + String(d.getFullYear()).slice(-2) : s;
}
function fmtRelativa(iso){
  const n = diffDias(iso, hojeISO());
  if(n === 0) return 'hoje';
  if(n === 1) return 'amanhã';
  if(n === -1) return 'ontem';
  return n < 0 ? 'há ' + (-n) + ' dias' : 'em ' + n + ' dias';
}
function fmtCompleta(iso){ return iso ? parseISO(iso).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}) : ''; }
/** Prazo: vencida / hoje / próximos 3 dias. */
function severidade(iso){
  if(!iso) return '';
  const n = diffDias(iso, hojeISO());
  return n < 0 ? 'venc' : n === 0 ? 'hoje' : n <= 3 ? 'prox' : '';
}
function faixaDe(iso){
  const n = diffDias(iso, hojeISO());
  if(n < 0) return 'vencidos';
  if(n === 0) return 'hoje';
  if(n === 1) return 'amanha';
  return iso <= fimSemana(hojeISO()) ? 'semana' : 'depois';
}
function primeiroDiaFaixa(f){
  const h = hojeISO();
  if(f === 'vencidos') return addDias(h,-1);
  if(f === 'hoje') return h;
  if(f === 'amanha') return addDias(h,1);
  if(f === 'semana') return addDias(h,2);
  const fs = fimSemana(h);
  return diffDias(fs, h) >= 2 ? addDias(fs,1) : addDias(h,3);
}
function tempoRelativo(iso){
  const t = new Date(iso).getTime();
  const min = Math.round((Date.now() - t)/60000);
  if(min < 1) return 'agora';
  if(min < 60) return 'há ' + min + ' min';
  const d = new Date(iso);
  const hhmm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const dia = toISO(d);
  if(dia === hojeISO()){ const h = Math.floor(min/60); return 'há ' + h + (h === 1 ? ' hora' : ' horas'); }
  if(dia === addDias(hojeISO(),-1)) return 'ontem às ' + hhmm;
  const dd = diffDias(dia, hojeISO());
  if(dd > -7) return 'há ' + (-dd) + ' dias às ' + hhmm;
  return fmtCurta(dia) + ' às ' + hhmm;
}
function tempoCompleto(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}) + ' às ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function proxSegunda(iso){ return addDias(iso, ((8 - parseISO(iso).getDay()) % 7) || 7); }

/** Toque (celular/tablet) e largura de celular: decidem gestos, tooltips e o formato de menus e filtros. */
const ehToque = () => window.matchMedia('(pointer: coarse)').matches;
const ehCelular = () => window.innerWidth < 768;
/** Vibração curta, só no toque e depois de interação real (o navegador bloqueia antes disso). */
function vibrar(ms){
  if(!navigator.vibrate || !ehToque()) return;
  if(navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try{ navigator.vibrate(ms || 10); }catch(e){}
}

/* --- Recorrência: {freq:'diaria'|'semanal'|'mensal'|'personalizada', intervalo, unidade:'dia'|'semana'|'mes', diasSemana:[0-6]} --- */
const NOMES_DIA = ['dom','seg','ter','qua','qui','sex','sáb'];
function descreverRec(r){
  if(!r) return 'Não repete';
  if(r.freq === 'diaria') return 'Todo dia';
  if(r.freq === 'semanal') return 'Toda semana';
  if(r.freq === 'mensal') return 'Todo mês';
  const n = Math.max(1, Number(r.intervalo) || 1);
  const un = {dia:['dia','dias'], semana:['semana','semanas'], mes:['mês','meses']}[r.unidade || 'dia'];
  let s = n === 1 ? 'A cada ' + un[0] : 'A cada ' + n + ' ' + un[1];
  if(r.unidade === 'semana' && r.diasSemana && r.diasSemana.length) s += ' (' + r.diasSemana.slice().sort().map(d => NOMES_DIA[d]).join(', ') + ')';
  return s;
}
function proximaData(iso, r){
  const personal = r.freq === 'personalizada';
  const n = personal ? Math.max(1, Number(r.intervalo) || 1) : 1;
  const unidade = r.freq === 'diaria' ? 'dia' : r.freq === 'semanal' ? 'semana' : r.freq === 'mensal' ? 'mes' : (r.unidade || 'dia');
  if(unidade === 'dia') return addDias(iso, n);
  if(unidade === 'mes') return addMeses(iso, n);
  const dias = personal && r.diasSemana && r.diasSemana.length ? r.diasSemana : null;
  if(!dias) return addDias(iso, 7*n);
  const base = inicioSemana(iso);
  for(let k = 1; k <= 7*n + 7; k++){
    const d = addDias(iso, k);
    const semanas = Math.round(diffDias(inicioSemana(d), base)/7);
    if(semanas % n === 0 && dias.indexOf(parseISO(d).getDay()) !== -1) return d;
  }
  return addDias(iso, 7*n);
}
/** Próxima ocorrência a partir da data atual do item, nunca no passado. */
function proximaOcorrencia(iso, r){
  let d = proximaData(iso || hojeISO(), r), guarda = 0;
  while(d < hojeISO() && guarda++ < 600) d = proximaData(d, r);
  return d;
}

/* =========================================================================
   MÓDULO 3 — ÍCONES (SVG inline)
   ========================================================================= */
const ICONES = {

function mescla(alvo, padrao){
  if(Array.isArray(padrao)) return Array.isArray(alvo) ? alvo.slice() : padrao.slice();
  const out = Object.assign({}, padrao);
  if(alvo && typeof alvo === 'object'){
    Object.keys(padrao).forEach(function(k){
      if(padrao[k] && typeof padrao[k] === 'object' && !Array.isArray(padrao[k])) out[k] = mescla(alvo[k], padrao[k]);
      else if(k in alvo && alvo[k] !== undefined) out[k] = Array.isArray(alvo[k]) ? alvo[k].slice() : alvo[k];
    });
  }
  return out;
}
