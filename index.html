function viewProjetos(){
  const p = state.prefs.projetos;
  const lista = ordenar(filtraConcluidos(filtraBusca(aplicaFiltros(items().filter(i => i.tipo === 'projeto' && i.secao === 'projetos'), 'projetos')), 'projetos'), p.ordem, ctxOrdem('projetos'));
  if(!lista.length){
    if(contaFiltros('projetos') || state.ui.busca.trim().length >= 2) return vazio('filter', 'Nenhum projeto com esses filtros', '', (contaFiltros('projetos') ? btnLimparFiltros('projetos') : '') + (state.ui.busca ? btnLimparBusca() : ''));
    return vazio('folder', 'Nenhum projeto por aqui', 'Projetos reúnem tarefas com um objetivo comum.', '<button type="button" class="btn prim" data-act="novo-projeto">' + ic('plus',15) + 'Criar projeto</button>');
  }
  if(p.visao === 'foco') return focoHTML('projetos', lista, {placeholder:'Adicionar projeto', vazio:'Nenhum projeto aberto.'});
  if(p.visao === 'kanban'){
    // Kanban de Projetos: sempre as colunas de status de PROJETO
    return kanbanHTML('projetos', listaStatus('projeto').map(s => ({chave:s.id, nome:s.nome, cor:s.cor, itens:lista.filter(i => i.status === s.id)})), {dropKind:'status-projeto', statusTipo:'projeto'});
  }
  if(p.agrupar === 'nenhum') return listaHTML('projetos', {itens:lista}, {addFlat:true});
  const grupos = p.agrupar === 'status'
    ? listaStatus('projeto').map(s => ({chave:s.id, nome:s.nome, itens:lista.filter(i => i.status === s.id)}))
    : categorias().map(c => ({chave:c.id, nome:c.nome, itens:lista.filter(i => i.categoriaId === c.id)})).concat([{chave:'sem', nome:'Sem categoria', itens:lista.filter(i => !i.categoriaId)}]);
  return listaHTML('projetos', {grupos}, {podeAdicionar: () => true});
}

/* ---------- PÁGINA DO PROJETO ---------- */
function avisoDatas(it){
  if(it.dataLembrete && it.dataEntrega && it.dataLembrete > it.dataEntrega && !ehLembrete(it))
    return '<p class="hint warn">' + ic('alert',13) + '<span>' + esc(nomeCampo('dataLembrete')) + ' é posterior à ' + esc(nomeCampo('dataEntrega')) + '.</span></p>';
  return '';
}
function linhasCampos(it){
  const linha = function(cid){
    const pc = pecaCampo(it, cid, 'card'); if(!pc) return '';
    const rot = ehLembrete(it) && cid === 'descricao' ? nomeCampo('textoLembrete') : ehLembrete(it) && cid === 'dataLembrete' ? 'Data do lembrete' : nomeCampo(cid);
    return '<div class="frow' + (pc.k === 'bloco' || pc.k === 'barra' ? ' bloco' : '') + '"><span class="flabel">' + esc(rot) + '</span><div class="fval">' + pc.h + '</div></div>';
  };
  const L = layout('card');
  const vis = L.filter(e => e.visivel).map(e => linha(e.id)).join('');
  const ocultos = L.filter(e => !e.visivel).map(e => linha(e.id)).filter(Boolean);
  return vis + (ocultos.length ? '<details class="mais"' + (state.ui.maisCampos ? ' open' : '') + '><summary>Mais campos (' + ocultos.length + ')</summary>' + ocultos.join('') + '</details>' : '');
}
function viewProjeto(id){
  const p = getItem(id);
  if(!p || p.tipo !== 'projeto') return vazio('alert', 'Projeto não encontrado', 'Ele pode ter sido excluído ou convertido em tarefa.', '<button type="button" class="btn" data-act="nav" data-view="projetos">Voltar para Projetos</button>');
  const pp = state.prefs.projeto, fechado = concluido(p);
  const subs = ordenar(filtraConcluidos(filtraBusca(subtarefas(id)), 'projeto'), pp.ordem, ctxOrdem('projeto'));
  const noFuturo = subtarefasFuturo(id);
  const cab = '<section class="card" style="padding:14px 16px;margin-bottom:18px;-webkit-user-select:auto;user-select:auto">' +
    '<div class="row-between" style="align-items:center;margin-bottom:4px"><span class="c-tipo">' + ic('folder',12) + 'Projeto' + (p.secao === 'futuro' ? ' · no Futuro' : '') + '</span>' + btnMenu(p) + '</div>' +
    '<div class="c-trow" style="align-items:center">' + btnConcluir(p) + '<textarea class="inp inp-title" rows="1" data-field="titulo" data-id="' + p.id + '" aria-label="Título do projeto" style="margin-left:-4px">' + esc(p.titulo) + '</textarea></div>' +
    '<div>' + linhasCampos(p) + '</div>' + avisoDatas(p) + blocoLembreteDaOrigem(p) + '</section>';
  const addBtn = fechado ? '<span class="muted">' + ic('info',13).replace('<svg ','<svg style="display:inline;vertical-align:-2px" ') + ' Projeto concluído — reabra para adicionar tarefas.</span>'
    : '<button type="button" class="btn prim sm" data-act="add-sub" data-id="' + id + '">' + ic('plus',14) + 'Adicionar tarefa ao projeto</button>';
  let corpo;
  if(pp.visao === 'foco'){
    corpo = focoHTML('projeto', subs, {semProjeto:true, placeholder:'Adicionar tarefa ao projeto', semAdicionar:fechado, vazio:'Nenhuma tarefa aberta neste projeto.'});
  }else if(!subs.length && !noFuturo.length){
    corpo = vazio('checkSq', state.ui.busca ? 'Nenhuma tarefa com essa busca' : 'Sem tarefas ainda', fechado ? '' : 'Quebre o projeto em passos pequenos.', fechado ? '' : '<button type="button" class="btn prim" data-act="add-sub" data-id="' + id + '">' + ic('plus',15) + 'Adicionar tarefa</button>');
  }else if(pp.visao === 'kanban'){
    // subtarefas: sempre as colunas de status de TAREFA (lembretes numa coluna própria)
    corpo = kanbanHTML('projeto', gruposStatusTarefa(subs), {dropKind:'status-tarefa', statusTipo:'tarefa', semAdicionar:fechado, podeAdicionar: k => k !== 'lembretes'});
  }else{
    // lista: por padrão, da entrega mais próxima para a mais distante
    corpo = (pp.ordem === 'entrega-asc' ? '<p class="hint" style="margin:-4px 0 10px">' + ic('sort',13) + '<span>Ordenado por ' + esc(nomeCampo('dataEntrega')) + ': do que vence primeiro até o que tem mais prazo.</span></p>' : '') +
      listaHTML('projeto', {itens:subs}, {addFlat:!fechado});
  }
  const futuro = noFuturo.length ? '<div style="margin-top:14px">' + grupo('projeto', 'sub-futuro', 'No Futuro', '<div class="cards">' + noFuturo.map(it => cardHTML(it, {layout:'lista', rodape: x => acaoFuturo(x) + '<span class="sp"></span>' + btnMenu(x)})).join('') + '</div>', noFuturo.length) + '</div>' : '';
  return cab + '<div class="row-between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="font-size:15px;font-weight:670">Tarefas do projeto</h2>' +
      (contaConcluidos('projeto') || pp.concluidos ? btnVerConcluidos('projeto') : '') + '</div>' + addBtn + '</div>' + corpo + futuro +
    '<div style="margin-top:24px"><h2 style="font-size:15px;font-weight:670;margin-bottom:10px">Atividade do projeto</h2>' +
    '<div class="card" style="padding:0;overflow:hidden;-webkit-user-select:auto;user-select:auto">' + feedHTML(p, 'pg') + composerHTML(p, 'pg') + '</div></div>';
}

/** Colunas/grupos por status de tarefa; os lembretes (sem status) vêm primeiro, numa coluna própria. */
function gruposStatusTarefa(lista){
  const lembs = lista.filter(ehLembrete), outros = lista.filter(i => !ehLembrete(i));
  return (lembs.length ? [{chave:'lembretes', nome:'Lembretes', cor:'#0e7490', itens:lembs}] : [])
    .concat(listaStatus('tarefa').map(s => ({chave:s.id, nome:s.nome, cor:s.cor, itens:outros.filter(i => i.status === s.id)})));
}
/* ---------- TAREFAS (somente tarefas) ---------- */
function viewTarefas(){
  const p = state.prefs.tarefas;
  let base = items().filter(i => i.tipo === 'tarefa' && i.secao === 'tarefas');
  if(p.vinculo === 'com') base = base.filter(i => !!i.projetoId);
  if(p.vinculo === 'sem') base = base.filter(i => !i.projetoId);
  const lista = ordenar(filtraConcluidos(filtraBusca(aplicaFiltros(base, 'tarefas')), 'tarefas'), p.ordem, ctxOrdem('tarefas'));
  const ag = p.agrupar === 'nenhum' && p.visao === 'kanban' ? 'status' : p.agrupar;
  if(p.visao === 'foco') return focoHTML('tarefas', lista, {placeholder:'Adicionar tarefa'});
  if(!lista.length){
    if(contaFiltros('tarefas') || state.ui.busca.trim().length >= 2) return vazio('filter', 'Nenhuma tarefa com esses filtros', '', (contaFiltros('tarefas') ? btnLimparFiltros('tarefas') : '') + (state.ui.busca ? btnLimparBusca() : ''));
    return vazio('checkSq', 'Nenhuma tarefa aberta', 'Crie uma tarefa ou faça a triagem da Entrada.', '<button type="button" class="btn prim" data-act="nova-tarefa">' + ic('plus',15) + 'Criar tarefa</button>');
  }
  const projsCols = () => {
    const ids = {}; lista.forEach(i => { if(i.projetoId) ids[i.projetoId] = true; });
    return projetos().filter(x => x.secao !== 'entrada' && (!concluido(x) || ids[x.id]));
  };
  let grupos, ctxK = {};
  if(ag === 'projeto'){
    grupos = [{chave:'sem', nome:'Sem projeto', itens:lista.filter(i => !i.projetoId), sempre:true}]
      .concat(projsCols().map(x => ({chave:x.id, nome:x.titulo + (concluido(x) ? ' (concluído)' : ''), itens:lista.filter(i => i.projetoId === x.id)})));
    ctxK = {dropKind:'projeto', podeAdicionar: k => k === 'sem' || !concluido(getItem(k))};
  }else if(ag === 'categoria'){
    grupos = categorias().map(c => ({chave:c.id, nome:c.nome, cor:c.cor, itens:lista.filter(i => i.categoriaId === c.id)})).concat([{chave:'sem', nome:'Sem categoria', itens:lista.filter(i => !i.categoriaId)}]);
    ctxK = {dropKind:'categoria'};
  }else if(ag === 'faixa'){
    grupos = FAIXAS.map(f => ({chave:f[0], nome:f[1], itens:lista.filter(i => faixaItem(i) === f[0])})).concat([{chave:'semdata', nome:'Sem data', itens:lista.filter(i => !faixaItem(i))}]);
    ctxK = {dropKind:'faixa', podeAdicionar: k => k !== 'vencidos'};
  }else{
    // por status: sempre as colunas de status de TAREFA (lembretes, que não têm status, numa coluna própria)
    grupos = gruposStatusTarefa(lista);
    ctxK = {dropKind:'status-tarefa', statusTipo:'tarefa', podeAdicionar: k => k !== 'lembretes'};
  }
  if(p.visao === 'kanban') return kanbanHTML('tarefas', grupos, ctxK);
  if(p.agrupar === 'nenhum') return listaHTML('tarefas', {itens:lista}, {addFlat:true});
  return listaHTML('tarefas', {grupos}, {vazioGrupo:'Nenhuma tarefa', podeAdicionar: ctxK.podeAdicionar || (() => true)});
}

/* ---------- CONCLUÍDOS (arquivo pesquisável) ---------- */
/** O que "Ver concluídos" mostra em cada seção. */
function escopoConcluidos(sec){
  if(sec === 'projetos') return {tipo:'projeto', de:'projetos'};
  if(sec === 'tarefas') return {tipo:'tarefa', de:'tarefas'};
  if(sec === 'projeto') return {projeto:state.ui.rota.id};
  return {};
}
function itensConcluidos(q){
  q = q || state.ui.rota.q || {};
  return items().filter(function(it){
    if(!concluido(it)) return false;
    if(q.projeto) return it.projetoId === q.projeto;
    if(q.tipo === 'projeto') return it.tipo === 'projeto';
    if(q.tipo === 'tarefa') return it.tipo === 'tarefa' && !ehLembrete(it);
    if(q.tipo === 'lembrete') return ehLembrete(it);
    return true;
  });
}
function contaConcluidos(sec){ return itensConcluidos(escopoConcluidos(sec)).length; }
/** Resultados (separados do campo de busca, que não é redesenhado a cada letra). */
function concluidosResHTML(){
  const q = normaliza(state.ui.buscaConcl.trim());
  let lista = itensConcluidos();
  if(q.length >= 2) lista = lista.filter(i => [i.titulo, i.descricao, nomeProjeto(i.projetoId), nomeCat(i.categoriaId)].some(t => normaliza(t).indexOf(q) !== -1));
  if(!lista.length) return vazio('search', 'Nada com essa busca', 'A busca olha título, descrição, projeto e categoria.', '<button type="button" class="btn" data-act="limpar-busca-concl">' + ic('x',15) + 'Limpar busca</button>');
  lista.sort((a, b) => (b.concluidoEm || '') > (a.concluidoEm || '') ? 1 : -1);
  const h = hojeISO();
  const periodo = function(it){
    const n = diffDias(h, toISO(new Date(it.concluidoEm || it.atualizadoEm)));
    return n <= 0 ? 'Hoje' : n === 1 ? 'Ontem' : n <= 7 ? 'Últimos 7 dias' : n <= 30 ? 'Últimos 30 dias' : 'Mais antigos';
  };
  let atual = null, out = '', buf = [];
  const fecha = () => { if(buf.length) out += '<div class="foco-lista" role="list">' + buf.join('') + '</div>'; buf = []; };
  lista.forEach(function(it){
    const p = periodo(it);
    if(p !== atual){ fecha(); out += '<h2 class="sect-t" style="margin-top:' + (atual ? 18 : 0) + 'px">' + p + '</h2>'; atual = p; }
    const quando = it.concluidoEm ? new Date(it.concluidoEm) : null;
    buf.push(linhaFoco(it, {semStatus:true, extraMeta:'<span class="fc estatico">' + ic(iconeTipo(it), 12) + esc(rotuloTipo(it)) + '</span>' +
      (quando ? '<span class="fc estatico" title="' + esc(tempoCompleto(it.concluidoEm)) + '">' + ic('check', 12) + 'Concluído ' + esc(tempoRelativo(it.concluidoEm)) + '</span>' : '') +
      (getCat(it.categoriaId) ? '<span class="fc estatico"><span class="dot" style="background:' + esc(getCat(it.categoriaId).cor) + '"></span>' + esc(nomeCat(it.categoriaId)) + '</span>' : '')}));
  });
  fecha();
  return out;
}
function viewConcluidos(){
  if(!itensConcluidos().length) return '<div class="conc">' + vazio('checkSq', 'Nada concluído por aqui ainda', 'O que você concluir sai das listas e fica guardado aqui, pesquisável. Reabra quando precisar.') + '</div>';
  return '<div class="conc"><div class="conc-busca"><span class="si">' + ic('search',16) + '</span><label class="sr-only" for="buscaConcl">Buscar nos concluídos</label>' +
    '<input class="inp" id="buscaConcl" type="search" placeholder="Buscar nos concluídos…" value="' + esc(state.ui.buscaConcl) + '" autocomplete="off" enterkeyhint="search"></div>' +
    '<p class="hint" style="margin:-4px 0 12px">' + ic('info',13) + '<span>Toque no círculo para reabrir. Itens reabertos voltam para a lista de origem.</span></p>' +
    '<div id="concRes">' + concluidosResHTML() + '</div></div>';
}

/* ---------- LIXEIRA (30 dias) ---------- */
function viewLixeira(){
  const L = state.dados.lixeira;
  if(!L.length) return '<div class="lix">' + vazio('trash', 'Lixeira vazia', 'Itens excluídos ou descartados ficam aqui por ' + DIAS_LIXEIRA + ' dias e podem ser restaurados.') + '</div>';
  const rows = L.map(function(ent){
    const p = ent.itens.find(x => x.id === ent.principalId) || ent.itens[0];
    const junto = ent.itens.filter(x => x !== p && !ehLembrete(x)).length;
    const dias = diasRestantesLixeira(ent);
    return '<div class="lix-row"><span class="lix-ic">' + ic(iconeTipo(p), 17) + '</span><div class="lix-corpo"><div class="lix-tit">' + esc(p.titulo) + '</div>' +
      '<div class="conc-meta"><span>' + esc(rotuloTipo(p)) + (LOCAIS[p.secao] ? ' · ' + esc(LOCAIS[p.secao]) : '') + '</span>' + (junto ? '<span>+ ' + junto + ' tarefa(s) junto</span>' : '') +
      '<span title="' + esc(tempoCompleto(ent.excluidoEm)) + '">Excluído ' + esc(tempoRelativo(ent.excluidoEm)) + '</span>' +
      '<span class="lix-prazo' + (dias <= 3 ? ' perto' : '') + '">' + (dias ? 'Apagado em ' + dias + (dias === 1 ? ' dia' : ' dias') : 'Apagado hoje') + '</span></div>' +
      '<div class="lix-acoes"><button type="button" class="btn-acao" data-act="lix-restaurar" data-id="' + ent.id + '">' + ic('restore',14) + 'Restaurar</button>' +
      '<button type="button" class="btn-acao" data-act="lix-apagar" data-id="' + ent.id + '" style="color:var(--danger)">' + ic('trash',14) + 'Apagar agora</button></div></div></div>';
  }).join('');
  return '<div class="lix"><p class="hint" style="margin:0 0 12px">' + ic('info',13) + '<span>Excluir e descartar nunca apagam na hora: o item fica aqui por ' + DIAS_LIXEIRA + ' dias e pode ser restaurado. Depois disso, some sozinho.</span></p>' +
    '<div class="lix-lista">' + rows + '</div></div>';
}

/* ---------- REVISÃO SEMANAL (GTD) ---------- */
function viewRevisao(){
  const c = contadores(), h = hojeISO();
  const semProx = projetos().filter(semProxima);
  const vencidos = items().filter(it => ativo(it) && it.tipo && !concluido(it) && datasRelevantes(it, ['lemb','entrega']).some(d => d.iso < h));
  const parados = projetos().filter(function(p){
    if(p.secao !== 'projetos' || concluido(p) || semProxima(p)) return false;
    const u = ultimaAtualizacao(p);
    return !u || diffDias(h, toISO(new Date(u.a.em))) >= 14;
  });
  const semana = items().filter(it => concluido(it) && it.concluidoEm && diffDias(h, toISO(new Date(it.concluidoEm))) <= 7);
  const caixa = (cls, n, t, s, acao, lista) => '<section class="rev-box ' + cls + '"><div class="rev-h"><span class="rev-n">' + n + '</span><div class="rev-tx"><div class="rev-t">' + t + '</div><div class="rev-s">' + s + '</div></div>' + (acao || '') + '</div>' + (lista || '') + '</section>';
  const linhaProj = (p, acao) => '<div class="rev-item"><button type="button" class="t" data-act="abrir-projeto" data-id="' + p.id + '">' + esc(p.titulo) +
    '<span class="s">' + candidatasProxima(p).length + ' tarefa(s) aberta(s)' + (ultimaAtualizacao(p) ? ' · atualizado ' + esc(tempoRelativo(ultimaAtualizacao(p).a.em)) : '') + '</span></button>' + acao + '</div>';
  return '<div class="rev">' +
    '<p class="hint" style="margin:0">' + ic('info',13) + '<span>Uma vez por semana: esvazie a Entrada, garanta uma próxima ação em cada projeto e resolva o que venceu.</span></p>' +
    caixa(c.entrada ? 'warn' : 'ok', c.entrada, 'Entrada para triar', c.entrada ? 'Transforme em tarefa ou projeto, mande para o Futuro ou descarte.' : 'Entrada zerada.',
      c.entrada ? '<button type="button" class="btn" data-act="nav" data-view="entrada">' + ic('inbox',15) + 'Triar</button>' : '') +
    caixa(semProx.length ? 'warn' : 'ok', semProx.length, 'Projetos sem próxima ação', semProx.length ? 'Projeto sem próxima ação é projeto parado. Marque a tarefa que vem agora.' : 'Todo projeto ativo tem uma próxima ação.', '',
      semProx.length ? '<div class="rev-lista">' + semProx.map(p => linhaProj(p, '<button type="button" class="btn sm prim" data-act="definir-proxima" data-id="' + p.id + '">' + ic('play',14) + 'Definir próxima ação</button>')).join('') + '</div>' : '') +
    caixa(vencidos.length ? 'venc' : 'ok', vencidos.length, 'Vencidos', vencidos.length ? 'Reagende, conclua ou descarte o que passou do prazo.' : 'Nada vencido.',
      vencidos.length ? '<button type="button" class="btn" data-act="rev-vencidos">' + ic('alert',15) + 'Ver vencidos</button>' : '') +
    caixa(parados.length ? 'warn' : 'ok', parados.length, 'Projetos sem movimento há 14 dias', parados.length ? 'Ainda fazem sentido agora? Atualize ou mande para o Futuro.' : 'Todos os projetos tiveram atividade recente.', '',
      parados.length ? '<div class="rev-lista">' + parados.map(p => linhaProj(p, '<button type="button" class="btn sm" data-act="futuro" data-id="' + p.id + '">' + ic('archive',14) + 'Futuro</button>')).join('') + '</div>' : '') +
    caixa('', c.futuro, 'No Futuro', 'Algo ali já pode ser ativado?', c.futuro ? '<button type="button" class="btn" data-act="aba-entrada" data-v="futuro">' + ic('archive',15) + 'Revisar Futuro</button>' : '') +
    caixa('ok', semana.length, 'Concluídos nos últimos 7 dias', semana.length ? 'Bom trabalho.' : 'Nada concluído nesta semana ainda.',
      semana.length ? '<button type="button" class="btn" data-act="nav" data-view="concluidos">' + ic('checkSq',15) + 'Ver</button>' : '') +
  '</div>';
}

/* ---------- CONFIGURAÇÕES ---------- */
/** Categorias (aba de Estrutura). */
function editorCategorias(){
  const cats = categorias().map(function(c){
    const n = items().filter(i => i.categoriaId === c.id).length;
    return '<div class="erow" data-sort-key="' + c.id + '"><span class="hdl" data-sort-handle title="Arrastar para reordenar">' + ic('grip',16) + '</span>' +
      '<input type="color" class="cor-in" value="' + esc(c.cor) + '" data-act="cat-cor" data-id="' + c.id + '" aria-label="Cor de ' + esc(c.nome) + '">' +
      '<input class="inp" value="' + esc(c.nome) + '" data-act="cat-nome" data-id="' + c.id + '" aria-label="Nome da categoria ' + esc(c.nome) + '">' +
      '<span class="muted" title="Itens nesta categoria">' + n + '</span>' +
      '<button type="button" class="icon-btn sm" data-act="cat-excluir" data-id="' + c.id + '" aria-label="Excluir categoria ' + esc(c.nome) + '">' + ic('trash',15) + '</button>' +
      setas('categorias', c.id, c.nome) + '</div>';
  }).join('');
  // "Sem categoria" é fixa: não se renomeia, não se exclui e fica sempre por último

/** Campos de formulário na ordem definida em Estrutura → Campos. */
function camposFormulario(tipo){ const alvo = {tipo, subtipo:null}; return campos().filter(c => c.id !== 'titulo' && c.id !== 'status' && campoAplica(c, alvo, true)); }

/* --- Rascunho: campos editados com os mesmos chips, menus e seletor de data dos cards, antes de gravar --- */
function novoRascunho(tipo, it){
  const r = {tipo, extras:{}, recorrencia: it && it.recorrencia ? clone(it.recorrencia) : {}};
  camposFormulario(tipo).forEach(function(c){
    const v = it ? (c.sistema ? it[c.id] : (it.extras || {})[c.id]) : null;
    if(c.sistema) r[c.id] = v == null ? (c.tipo === 'textoLongo' ? '' : null) : v;
    else r.extras[c.id] = v == null ? null : v;
  });
  if(tipo) r.status = statusInicial(tipo).id;
  return r;
}
const valorRasc = (r, c) => c.sistema ? r[c.id] : r.extras[c.id];
function chipRasc(r, c){
  const v = valorRasc(r, c);
  let dentro = null, sev = '';
  if(c.id === 'categoriaId'){ const cat = getCat(v); if(cat) dentro = '<span class="dot" style="background:' + esc(cat.cor) + '"></span><span class="v">' + esc(cat.nome) + '</span>'; }
  else if(c.id === 'projetoId'){ const p = getItem(v); if(p) dentro = ic('folder',12) + '<span class="v">' + esc(p.titulo) + '</span>'; }
  else if(c.tipo === 'data'){ if(v){ sev = severidade(v); dentro = ic(sev === 'venc' ? 'alert' : 'calendar',12) + '<span class="v">' + esc(fmtCurta(v)) + ' · ' + esc(fmtRelativa(v)) + '</span>' + (c.sistema && r.recorrencia[c.id] ? '<span class="rec">' + ic('repeat',11) + '</span>' : ''); } }
  else if(v != null && v !== '') dentro = '<span class="v">' + esc(c.tipo === 'numero' ? Number(v).toLocaleString('pt-BR') : String(v)) + '</span>';
  if(!dentro) return '<button type="button" class="fc vazio" data-rc="' + c.id + '" aria-label="Definir ' + esc(c.nome) + '">+ ' + esc(ehData(c.id) ? rotuloCurto(c.id) : c.nome) + '</button>';
  return '<button type="button" class="fc' + (sev ? ' sev-' + sev : '') + '" data-rc="' + c.id + '" aria-label="' + esc(c.nome) + '. Alterar">' + dentro + '</button>';
}
function camposRascHTML(r, tipo){
  let h = '';
  if(tipo){
    const s = statusPorId(tipo, r.status);
    h += '<div class="frow"><span class="flabel">Status ' + (tipo === 'projeto' ? 'do projeto' : 'da tarefa') + '</span><div class="fval"><button type="button" class="fc st" style="--c:' + esc(s.cor) + '" data-rc="status" aria-label="Status: ' + esc(s.nome) + '. Alterar"><span class="v">' + esc(s.nome) + '</span></button></div></div>';
  }
  camposFormulario(tipo).forEach(function(c){
    if(c.id === 'textoLembrete' && !r.dataLembrete) return;   // o texto do lembrete só aparece depois de escolher a data
    if(c.tipo === 'textoLongo') h += '<div class="frow bloco"><label class="flabel" for="rt-' + c.id + '">' + esc(c.nome) + '</label><textarea class="inp" id="rt-' + c.id + '" data-rt="' + c.id + '" rows="2" autocapitalize="sentences"' +
      (c.id === 'textoLembrete' ? ' placeholder="Do que você quer se lembrar"' : '') + '>' + esc(r[c.id] || '') + '</textarea></div>';
    else h += '<div class="frow"><span class="flabel">' + esc(c.nome) + '</span><div class="fval">' + chipRasc(r, c) + '</div></div>';
  });
  return h;
}
function editarRasc(anchor, r, cid, tipo, redesenhar){
  const c = cid === 'status' ? null : campoDef(cid);
  const pronto = () => { redesenhar(); const b = anchor.ownerDocument && $('[data-rc="' + cid + '"]'); if(b) b.focus({preventScroll:true}); };
  const set = v => { if(c && !c.sistema) r.extras[cid] = v; else r[cid] = v; pronto(); };
  if(cid === 'status') return abrirMenu(anchor, [{titulo:'Status'}].concat(listaStatus(tipo).filter(s => !s.final).map(s => ({id:s.id, label:s.nome, cor:s.cor, marcado:r.status === s.id, acao:() => { r.status = s.id; pronto(); }}))));
  if(cid === 'categoriaId') return abrirMenu(anchor, [{titulo:c.nome}, {id:'sem', label:'Sem categoria', marcado:!r.categoriaId, acao:() => set(null)}]
    .concat(categorias().map(x => ({id:x.id, label:x.nome, cor:x.cor, marcado:r.categoriaId === x.id, acao:() => set(x.id)}))));
  if(cid === 'projetoId') return abrirMenu(anchor, [{titulo:c.nome}, {id:'sem', label:'Sem projeto', marcado:!r.projetoId, acao:() => set(null)}]
    .concat(projetosVinculaveis().map(p => ({id:p.id, label:p.titulo, icone:'folder', marcado:r.projetoId === p.id, acao:() => { if(!r.categoriaId && p.categoriaId) r.categoriaId = p.categoriaId; set(p.id); }}))));
  if(c.tipo === 'data') return abrirDatePicker(anchor, {titulo:c.nome, valor:valorRasc(r, c), rec:c.sistema ? r.recorrencia[cid] : null,
    escolher:v => set(v),
    recorrer: c.sistema ? (rg => { r.recorrencia[cid] = rg; if(rg && !r[cid]) r[cid] = hojeISO(); redesenhar(); }) : undefined,
    dicaRec: cid === 'dataLembrete' ? 'Com repetição, concluir o lembrete já agenda o próximo.' : 'Ao concluir, o item reabre com a próxima data de entrega.'});
  if(c.tipo === 'selecao') return abrirMenu(anchor, [{titulo:c.nome}].concat((c.opcoes || []).map(o => ({id:'o-' + o, label:o, marcado:valorRasc(r, c) === o, acao:() => set(o)})))
    .concat(['-', {id:'limpar', label:'Limpar', icone:'x', acao:() => set(null)}]));
  const atual = valorRasc(r, c);
  return popTexto(anchor, {titulo:c.nome, valor: atual == null ? '' : String(atual), numero:c.tipo === 'numero',
    salvar:v => set(c.tipo === 'numero' ? (v === '' || isNaN(Number(v)) ? null : Number(v)) : (v || null))});
}
/** Liga os chips do rascunho dentro de um sheet (o corpo em #rascCampos é redesenhado a cada mudança). */
function ligarRascunho(el, r, tipo, depois){
  const redesenhar = () => { const box = $('#rascCampos', el); if(box) box.innerHTML = camposRascHTML(r, tipo); if(depois) depois(); };
  el.addEventListener('click', function(e){ const b = e.target.closest('[data-rc]'); if(b){ e.preventDefault(); editarRasc(b, r, b.dataset.rc, tipo, redesenhar); } });
  el.addEventListener('input', function(e){ const t = e.target.closest('[data-rt]'); if(t) r[t.dataset.rt] = t.value; });
  return redesenhar;
}
/** Grava no item os valores do rascunho (com histórico). */
function aplicarRascunho(it, r, mudBase){
  const mud = Object.assign({}, mudBase);
  camposFormulario(r.tipo).forEach(function(c){ if(c.sistema) mud[c.id] = c.tipo === 'textoLongo' ? String(r[c.id] || '').trim() : (r[c.id] || null); });
  if(r.tipo) mud.status = r.status;
  Object.keys(r.extras).forEach(function(k){
    const de = (it.extras || {})[k], para = r.extras[k];
    if((de == null ? null : de) === (para == null ? null : para)) return;
    it.extras = it.extras || {}; it.extras[k] = para;
    registrar(it, {icone:'edit', rotulo:nomeCampo(k), de: de == null ? '—' : String(de), para: para == null ? '—' : String(para)});
  });
  Object.keys(r.recorrencia).forEach(function(k){
    const atual = (it.recorrencia || {})[k] || null, nova = r.recorrencia[k] || null;
    if(JSON.stringify(atual) === JSON.stringify(nova)) return;
    it.recorrencia = it.recorrencia || {}; it.recorrencia[k] = nova;
    registrar(it, {icone:'repeat', rotulo:'Recorrência — ' + nomeCampo(k), de:descreverRec(atual), para:descreverRec(nova)});
  });
  return mud;
}
function sheetCaptura(){

      };

/* =========================================================================

function onPointerDown(e){

  if(puxa && !e.target.closest('button, input, select, textarea, a')){
    const sh = puxa.closest('.sheet, .panel'), painel = sh.classList.contains('panel');
    if(painel ? window.innerWidth < 1024 : ehCelular()){
      ptr = {modo:'fechar', el:sh, painel, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, t0:Date.now(), h:sh.getBoundingClientRect().height, ativo:false};

    const lista = rz.closest('.lista'); if(!lista) return;
    e.preventDefault();
    ptr = {modo:'resize', rz, lista, cid:rz.dataset.rsz, i:Number(rz.dataset.i), x0:e.clientX, x:e.clientX, y:e.clientY,

  const linha = e.target.closest('[data-foco-id]');

function soltarPressao(p){ if(p && p.el) p.el.classList.remove('pressionando'); }
function onPointerMove(e){
  if(!ptr) return;
  ptr.x = e.clientX; ptr.y = e.clientY;
  const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
  if(ptr.modo === 'resize'){
    ptr.w = Math.round(Math.max(56, Math.min(900, ptr.w0 + dx)));
    const t = ptr.trilhas.slice(); t[ptr.i] = ptr.w + 'px';
    ptr.lista.style.setProperty('--gtc', t.join(' '));   // atualiza todas as linhas ao vivo
    return;
  }
  if(ptr.modo === 'pan'){
    if(!ptr.ativo){ if(Math.abs(dx) < 4) return; ptr.ativo = true; ptr.kb.classList.add('panando'); }
    ptr.kb.scrollLeft = ptr.sl0 - dx;
    return;
  }
  if(ptr.modo === 'fechar'){
    if(!ptr.ativo){
      if(dy > 6 && Math.abs(dy) > Math.abs(dx)){ ptr.ativo = true; ptr.el.classList.add('arrastando'); }
      else if(Math.abs(dx) > 10 || dy < -10){ ptr = null; }
      return;
    }
    ptr.el.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
    return;
  }
  if(!ptr.ativo){
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8) ptr.moveu = true;
    if(ptr.modo === 'sort'){ if(Math.abs(dx) > 3 || Math.abs(dy) > 3) ativarSort(); return; }
    if(ptr.modo === 'drag' || ptr.modo === 'foco'){
      const ativa = ptr.modo === 'drag' ? ativarDrag : ativarFoco;
      if(!ptr.toque && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) ativa();
      else if(ptr.toque && ptr.moveu){ clearTimeout(ptr.timer); soltarPressao(ptr); ptr = null; }   // virou rolagem
    }else if(ptr.modo === 'swipe' && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4){
      ptr.ativo = true; ptr.el.classList.add('swiping'); ptr.lim = ptr.el.offsetWidth * .4;
    }
    return;
  }
  if(ptr.modo === 'swipe'){
    const max = ptr.el.offsetWidth * .6;
    ptr.el.style.transform = 'translateX(' + Math.max(-max, Math.min(max, dx)) + 'px)';
    // passou do limiar (40%): destaca a ação e vibra uma vez
    const lado = dx >= ptr.lim ? 'dir' : dx <= -ptr.lim ? 'esq' : '';
    if(lado !== (ptr.lado || '')){
      const w = ptr.el.parentElement;
      w.classList.toggle('passou-dir', lado === 'dir'); w.classList.toggle('passou-esq', lado === 'esq');
      if(lado) vibrar(10);
      ptr.lado = lado;
    }
    return;
  }
  if(ghost){ ghost.style.left = (e.clientX - ptr.offX) + 'px'; ghost.style.top = (e.clientY - ptr.offY) + 'px'; }
  if(ptr.modo === 'sort'){ reposicionarSort(e.clientX, e.clientY); autoRolar(e.clientX, ptr.lista.classList.contains('kanban') ? ptr.lista : null); return; }
  if(ptr.modo === 'foco'){ reposicionarEm(ptr.lista, ptr.el, e.clientX, e.clientY, 'y', 'data-foco-id'); autoRolarV(e.clientY); return; }
  const alvo = document.elementFromPoint(e.clientX, e.clientY);
  const col = alvo ? alvo.closest('[data-drop]') : null;
  if(col !== colAtual){ if(colAtual) colAtual.classList.remove('over'); colAtual = col; if(colAtual) colAtual.classList.add('over'); }
  autoRolar(e.clientX, dropbar ? null : $('.kanban'));
}
function criarFantasma(el){
  const r = el.getBoundingClientRect();
  ptr.offX = ptr.x - r.left; ptr.offY = ptr.y - r.top;

}
function ativarDrag(){

  ptr.el.classList.add('dragging');
  esconderTip();
  if(ptr.toque) vibrar(12);
  // celular: zonas de soltar fixas no rodapé com os nomes das colunas (sem depender do auto-scroll lateral)
  const kb = ptr.el.closest('.kanban');
  if(kb && ehCelular()) montarDropbar(kb, ptr.el.closest('.kcol'));
}
function montarDropbar(kb, colDoCard){
  dropbar = document.createElement('div');
  dropbar.className = 'dropbar';
  dropbar.setAttribute('aria-hidden', 'true');
  dropbar.innerHTML = $$('.kcol[data-drop]', kb).map(function(c){
    const cor = c.querySelector('.kcol-h .cdot');
    return '<div class="dz' + (c === colDoCard ? ' atual' : '') + '" data-drop="1" data-drop-kind="' + esc(c.dataset.dropKind) + '" data-drop-col="' + esc(c.dataset.dropCol) + '">' +
      (cor ? '<span class="cdot" style="background:' + esc(cor.style.background) + '"></span>' : '') + esc(c.getAttribute('aria-label') || '') + '</div>';

function ativarSort(){
  if(!ptr || ptr.ativo) return;

}
function ativarFoco(){
  if(!ptr || ptr.ativo) return;
  ptr.ativo = true;
  soltarPressao(ptr);
  ptr.antes = $$('[data-foco-id]', $('#view')).map(x => x.dataset.focoId).join(',');
  criarFantasma(ptr.el);
  ptr.el.classList.add('sorting');
  esconderTip();

}
function reposicionarSort(x, y){ reposicionarEm(ptr.lista, ptr.el, x, y, ptr.eixo, 'data-sort-key'); }
/** Move o elemento arrastado para antes/depois do irmão mais próximo do ponteiro. */
function reposicionarEm(lista, el, x, y, eixo, attr){
  const irmaos = Array.from(lista.children).filter(c => c.hasAttribute(attr) && c !== el);
  let alvo = null, antes = true, melhor = Infinity;
  irmaos.forEach(function(c){
    const r = c.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    const d = Math.hypot(cx - x, cy - y);
    if(d < melhor){
      melhor = d; alvo = c;
      antes = eixo === 'y' ? y < cy : eixo === 'x' ? x < cx : (y < r.top ? true : y > r.bottom ? false : x < cx);
    }
  });
  if(!alvo) return;
  if(antes){ if(alvo.previousElementSibling !== el) lista.insertBefore(el, alvo); }
  else if(alvo.nextElementSibling !== el) lista.insertBefore(el, alvo.nextElementSibling);
}
/** Rolagem vertical da página perto das bordas enquanto se arrasta no Foco. */
function autoRolarV(y){
  const dir = y < 90 ? -1 : y > window.innerHeight - 110 ? 1 : 0;
  if(!dir){ if(autoScrollV){ clearInterval(autoScrollV); autoScrollV = null; } return; }
  if(autoScrollV) return;
  autoScrollV = setInterval(() => window.scrollBy(0, dir * 10), 16);
}
function autoRolar(x, kb){
  if(!kb){ pararAutoRolar(); return; }
  const r = kb.getBoundingClientRect();
  const dir = x > r.right - 60 ? 1 : x < r.left + 60 ? -1 : 0;
  if(!dir){ pararAutoRolar(); return; }
  if(autoScroll) return;
  autoScroll = setInterval(() => { kb.scrollLeft += dir * 12; }, 16);
}
function pararAutoRolar(){
  if(autoScroll){ clearInterval(autoScroll); autoScroll = null; }
  if(autoScrollV){ clearInterval(autoScrollV); autoScrollV = null; }
}
function onPointerUp(){
  if(!ptr) return;

  if(ghost){ ghost.remove(); ghost = null; }
  if(p.modo === 'pan'){ p.kb.classList.remove('panando'); return; }
  if(p.modo === 'fechar'){
    const dy = p.y - p.y0, vel = dy / Math.max(1, Date.now() - p.t0);
    p.el.classList.remove('arrastando');
    // fecha ao passar de 30% da altura ou num gesto rápido para baixo
    if(dy > p.h * .3 || (vel > .5 && dy > 40)){
      if(p.painel){ p.el.style.transform = 'translateY(100%)'; setTimeout(fecharPainel, 180); }

      else if(menuAtual && menuAtual.el === p.el) fecharMenu();
      else p.el.style.transform = '';
    }else p.el.style.transform = '';
    return;
  }
  if(p.modo === 'foco'){
    p.el.classList.remove('sorting');
    const ids = $$('[data-foco-id]', $('#view')).map(x => x.dataset.focoId);
    if(ids.join(',') === p.antes) return;
    const sec = p.lista.dataset.focoSec, pr = state.prefs[sec]; if(!pr) return;
    const antes = {ordem:pr.ordem, manual:(pr.manual || []).slice()};
    pr.manual = ids.concat((pr.manual || []).filter(id => ids.indexOf(id) === -1));
    pr.ordem = 'manual';
    persistirPrefs(); render();
    toast('Ordem personalizada salva', () => { pr.ordem = antes.ordem; pr.manual = antes.manual; persistirPrefs(); render(); }, {label:'Alterar ordem', fn:() => sheetOrdem(sec)});
    return;
  }
  if(p.modo === 'resize'){
    p.rz.classList.remove('ativo');

    return;
  }
  if(p.modo === 'sort'){
    p.el.classList.remove('sorting');
    const ids = Array.from(p.lista.children).filter(c => c.hasAttribute('data-sort-key')).map(c => c.dataset.sortKey);

    if(dx >= p.lim) sheetTriagem(p.id, 'tarefa');
    else if(dx <= -p.lim) classificarFuturo(p.id);   // com "Desfazer" no aviso
    return;
  }

  const c = colAtual;
  if(c){ c.classList.remove('over'); colAtual = null; }
  if(dropbar){ dropbar.remove(); dropbar = null; }
  if(c) aplicarDrop(c.dataset.dropKind, c.dataset.dropCol, p.id);
}
function aplicarDrop(kind, col, id){
  const it = getItem(id); if(!it) return;
  if(kind === 'status-projeto' || kind === 'status-tarefa'){
    const tipo = kind === 'status-projeto' ? 'projeto' : 'tarefa';
    if(it.tipo !== tipo || !statusPorId(tipo, col)) return;     // nunca mistura status de projeto e tarefa
    if(it.status === col) return;
    setStatus(id, col);
  }else if(kind === 'faixa'){
    const emHoje = state.ui.rota.view === 'hoje';
    const d = emHoje ? motivoHoje(it) : dataDeterminante(it);
    if(col === 'semdata'){ if(d) definirData(id, d.campo, null); return; }
    const campo = d ? d.campo : 'dataEntrega', nova = primeiroDiaFaixa(col);
    const de = it[campo];
    if(de === nova) return;
    // em Hoje, o card continua visível na nova faixa mesmo que ela esteja fora do período filtrado
    if(emHoje) state.ui.fixadosHoje[id] = campo;
    definirData(id, campo, nova);
    const iv = intervaloPeriodo();
    toast(rotuloCurto(campo) + ': ' + (de ? fmtCurta(de) : '—') + ' → ' + fmtCurta(nova) + (emHoje && (nova < iv[0] || nova > iv[1]) ? ' (fora do período filtrado)' : ''));
  }else if(kind === 'projeto'){
    if(ehLembrete(it)){ toast('O projeto de um lembrete segue a origem'); return; }
    alterar(id, {projetoId: col === 'sem' ? null : col});
  }else if(kind === 'categoria'){
    alterar(id, {categoriaId: col === 'sem' ? null : col});
  }
  const novo = $('[data-drag-id="' + id + '"]');
  if(novo) novo.classList.add('drop-in');
}

/** "+ Adicionar": cria já com o tipo e o que a coluna/grupo representa (status, projeto, categoria ou data). */
function criarNaColuna(sec, col, titulo){
  if(!titulo.trim()){ state.ui.addCol = null; render(); return; }
  const base = Object.assign({titulo:titulo.trim()}, heranca(sec, col));
  if(sec === 'projeto'){ const p = getItem(state.ui.rota.id); if(!p || concluido(p)){ toast('Projeto concluído não aceita novas tarefas'); return; } }
  const novo = criarItem(base, {semRender:true});
  if(concluido(novo)) state.ui.recemConcluidos.add(novo.id);
  if(sec === 'hoje') state.ui.fixadosHoje[novo.id] = 'dataEntrega';
  state.ui.addCol = {sec, col};            // mantém o rascunho aberto para criar o próximo
  render();
  toast('“' + novo.titulo + '” criado', () => { removerItens([novo.id]); persistir(); render(); });
}
/** Adição rápida do modo Foco. */
function criarNoFoco(sec, titulo){
  if(!titulo.trim()) return;
  const r = state.ui.rota, base = {titulo:titulo.trim()};
  if(sec === 'projetos') Object.assign(base, {tipo:'projeto', secao:'projetos'});
  else if(sec === 'projeto'){
    const p = getItem(r.id);
    if(!p || concluido(p)){ toast('Projeto concluído não aceita novas tarefas'); return; }
    Object.assign(base, {tipo:'tarefa', secao:'tarefas', projetoId:p.id});
  }else if(sec === 'hoje' || sec === 'tarefas') Object.assign(base, {tipo:'tarefa', secao:'tarefas', dataEntrega:hojeISO()});   // entrega padrão: hoje
  else Object.assign(base, {tipo:'tarefa', secao:'tarefas'});
  const novo = criarItem(base, {semRender:true});
  state.ui.focar = '#focoAdd';
  render();
  toast('“' + novo.titulo + '” adicionado' + (base.dataEntrega ? ' para hoje' : ''), () => { removerItens([novo.id]); persistir(); render(); });
}
function criarSubtarefa(pid, titulo){

function menuDoItem(btn, id){
  const it = getItem(id); if(!it) return;
  const ancora = () => $('[data-act="menu-item"][data-id="' + id + '"]') || btn;
  const m = [{id:'abrir', label:'Abrir card', icone:'arrowR', acao:() => abrirItem(id, true)},
             {id:'lay', label:'Personalizar campos do card', icone:'sliders', acao:() => sheetLayout('card')}];
  if(it.tipo === 'projeto' && it.secao === 'projetos') m.push({id:'pag', label:'Abrir página do projeto', icone:'folder', acao:() => irPara('#/projetos/' + id)});
  // "Mover para…": caminho principal no celular (sem depender de arrastar)
  if(it.tipo && !concluido(it) && it.secao !== 'entrada') m.push({id:'mv', label:'Mover para…', icone:'move', acao:() => sheetMoverPara(id)});
  if(it.tipo === 'projeto' && !concluido(it) && it.secao === 'projetos') m.push({id:'px', label: proximaAcao(it) ? 'Trocar próxima ação' : 'Definir próxima ação', icone:'play', acao:() => escolherProxima(ancora(), id)});
  if(it.tipo === 'tarefa' && !ehLembrete(it) && it.projetoId && !concluido(it) && it.secao === 'tarefas'){
    const p = getItem(it.projetoId);
    if(p && !concluido(p)) m.push(ehProxima(it) ? {id:'npx', label:'Desmarcar como próxima ação', icone:'play', acao:() => definirProxima(p.id, null)}
                                                : {id:'spx', label:'Marcar como próxima ação', icone:'play', acao:() => definirProxima(p.id, id)});
  }
  if(ehLembrete(it)){
    const o = getItem(it.origemId);
    if(o) m.push({id:'orig', label:'Abrir origem: ' + o.titulo, icone:'link', acao:() => abrirItem(o.id)});
    if(!concluido(it)) m.push('-', {id:'conc', label:'Concluir lembrete', icone:'check', acao:() => concluirLembrete(id, ancora())},
      {id:'reag', label:'Reagendar', icone:'calendar', acao:() => abrirReagendar(ancora(), it)},
      {id:'rem', label:'Cancelar lembrete', icone:'x', variante:'dngr', acao:() => removerLembrete(id)});
    else m.push('-', {id:'reab', label:'Reabrir lembrete', icone:'restore', acao:() => reabrirLembrete(id)});
  }else{
    m.push('-');
    if(it.secao === 'entrada'){
      m.push({id:'tt', label:'Transformar em Tarefa', icone:'checkSq', acao:() => sheetTriagem(id, 'tarefa')});
      m.push({id:'tp', label:'Transformar em Projeto', icone:'folder', acao:() => sheetTriagem(id, 'projeto')});
      m.push({id:'fu', label:'Classificar no Futuro', icone:'archive', acao:() => classificarFuturo(id)});
    }else if(it.secao === 'futuro'){
      if(it.tipo) m.push({id:'at', label:'Ativar em ' + (it.tipo === 'projeto' ? 'Projetos' : 'Tarefas'), icone:'arrowR', acao:() => ativar(id)});
      else { m.push({id:'tt', label:'Transformar em Tarefa', icone:'checkSq', acao:() => sheetTriagem(id, 'tarefa')}); m.push({id:'tp', label:'Transformar em Projeto', icone:'folder', acao:() => sheetTriagem(id, 'projeto')}); }
      m.push({id:'vt', label:'Voltar para a triagem', icone:'inbox', acao:() => voltarParaTriagem(id)});
    }else m.push({id:'fu', label:'Classificar no Futuro', icone:'archive', acao:() => classificarFuturo(id)});
    if(it.tipo && lembreteDe(it.id)) m.push({id:'ra', label:'Cancelar lembrete', icone:'bell', acao:() => removerLembrete(id)});
    else if(it.tipo && !concluido(it) && campoAtivo('dataLembrete')) m.push({id:'nl', label:'Marcar lembrete…', icone:'bell', acao:() => marcarNovoLembrete(id, ancora())});
    if(it.tipo) m.push({id:'cv', label: it.tipo === 'projeto' ? 'Converter em tarefa' : 'Converter em projeto', icone:'split', acao:() => converterTipo(id)});
    m.push('-', {id:'dup', label:'Duplicar', icone:'copy', acao:() => duplicar(id)}, {id:'del', label:'Mover para a lixeira', icone:'trash', variante:'dngr', acao:() => excluir(id)});
  }
  abrirMenu(btn, m, {sel:'[data-act="menu-item"][data-id="' + id + '"]'});
}
/** "Mover para…": status, projeto, data e local numa folha só — a alternativa ao arrastar no celular. */
function sheetMoverPara(id){
  const corpo = function(){
    const it = getItem(id); if(!it) return '<p class="muted">Item não encontrado.</p>';
    const h = hojeISO(), lemb = ehLembrete(it);
    let s = '';
    if(!lemb){
      s += '<div class="sect-t">' + (it.tipo === 'projeto' ? 'Status do projeto' : 'Status da tarefa') + '</div><div class="opt-list" role="radiogroup">' +
        listaStatus(it.tipo).map(x => optRadio(x.nome, it.status === x.id, 'data-act="mv-status" data-id="' + id + '" data-v="' + x.id + '"')).join('') + '</div>';
    }
    if(it.tipo === 'tarefa' && !lemb){
      s += '<div class="sect-t">' + esc(nomeCampo('projetoId')) + '</div><div class="opt-list" role="radiogroup">' + optRadio('Sem projeto', !it.projetoId, 'data-act="mv-proj" data-id="' + id + '" data-v=""') +
        projetosVinculaveis().map(p => optRadio(p.titulo, it.projetoId === p.id, 'data-act="mv-proj" data-id="' + id + '" data-v="' + p.id + '"')).join('') + '</div>';
    }
    const campo = lemb ? 'dataLembrete' : 'dataEntrega', atual = it[campo];
    const datas = [['Hoje',h],['Amanhã',addDias(h,1)],['Próxima segunda',proxSegunda(h)],['Em 1 semana',addDias(h,7)]].concat(lemb ? [] : [['Sem data','']]);
    s += '<div class="sect-t">' + esc(nomeCampo(campo)) + (atual ? ' · hoje em ' + esc(fmtCurta(atual)) : '') + '</div><div class="opt-list" role="radiogroup">' +
      datas.map(d => optRadio(d[0] + (d[1] ? ' (' + fmtCurta(d[1]) + ')' : ''), (atual || '') === d[1], 'data-act="mv-data" data-id="' + id + '" data-campo="' + campo + '" data-v="' + d[1] + '"')).join('') + '</div>';
    if(!lemb && (it.secao === 'tarefas' || it.secao === 'projetos')) s += '<div class="sect-t">Local</div><div class="opt-list">' +
      optRadio('Futuro (tirar do radar por enquanto)', false, 'data-act="mv-futuro" data-id="' + id + '"') + '</div>';
    return s;
  };
  const it = getItem(id);
  abrirSheet({titulo:'Mover “' + (it ? it.titulo : '') + '”', autofoco:false, corpoFn:corpo});
}

/* --- Delegação --- */
function seletorDe(el){
  if(!el || el === document.body || !el.getAttribute) return null;
  if(el.id) return '#' + CSS.escape(el.id);
  const d = el.dataset || {};
  if(d.edit && d.id) return '[data-edit="' + d.edit + '"][data-id="' + d.id + '"]';
  const partes = ['act','id','v','k','sec','view','d','tipo','sid','pid','cid','o'].filter(k => d[k] != null).map(k => '[data-' + k + '="' + CSS.escape(d[k]) + '"]');
  return partes.length ? partes.join('') : null;
}
document.addEventListener('click', function(e){
  if(suprimirClique){ e.preventDefault(); e.stopPropagation(); return; }

  if(alvo.dataset.edit){ e.preventDefault(); abrirEditorCampo(alvo, alvo.dataset.id, alvo.dataset.edit); return; }
  if(['SELECT','INPUT','TEXTAREA'].indexOf(alvo.tagName) !== -1) return;   // disparam por 'change'
  const fn = ACOES[alvo.dataset.act]; if(!fn) return;

});
document.addEventListener('change', function(e){

  if(el.closest('#popRoot')) return;
  switch(d.act){
    case 'set-cust': state.prefs[d.sec][d.k] = el.value; persistirPrefs(); render(); return;

    case 'status-cor': corStatus(d.tipo, d.sid, el.value); return;
    case 'status-nome': renomearStatus(d.tipo, d.sid, el.value); return;
    case 'campo-nome': renomearCampo(d.k, el.value); return;
    case 'campo-opcoes': { const c = campos().find(x => x.id === d.k); if(c){ c.opcoes = el.value.split(',').map(s => s.trim()).filter((s, i, a) => s && a.indexOf(s) === i); persistir(); render(); toast('Opções atualizadas'); } return; }
  }

    if(d.field === 'textoLembrete' || (d.field === 'descricao' && ehLembrete(alvo))){ definirTextoLembrete(d.id, v.trim()); return; }
    alterar(d.id, {[d.field]: v});

  }

});

const EDITAVEIS_RENOMEAR = ['status-nome','campo-nome','cat-nome','campo-opcoes'];
document.addEventListener('keydown', function(e){
  const el = e.target;
  const digitando = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  if(e.key === 'Escape'){
    if(el && el.dataset && EDITAVEIS_RENOMEAR.indexOf(el.dataset.act) !== -1){ el.value = el.defaultValue; el.blur(); return; }
    if(menuAtual){ fecharMenu(); return; }
    if(popAtual){ fecharPop(); return; }
    if(sheetAtual){ fecharSheet(); return; }
    if(state.ui.addCol){ state.ui.addCol = null; render(); return; }
    if(state.ui.rota.item){ fecharPainel(); return; }
    if(state.prefs.sidebarExp && window.innerWidth < 1024){ state.prefs.sidebarExp = false; persistirPrefs(); render(); return; }
    if(state.ui.busca){ state.ui.busca = ''; render(); return; }
    if(digitando) el.blur();
    return;
  }
  // alça de largura de coluna: setas ajustam, Delete restaura
  if(el && el.dataset && el.dataset.rsz){
    const cid = el.dataset.rsz;
    const atual = state.prefs.larguras[cid] || Math.round(el.parentElement.getBoundingClientRect().width);
    const passo = e.shiftKey ? 48 : 16;
    let novo = null;
    if(e.key === 'ArrowRight') novo = atual + passo;
    if(e.key === 'ArrowLeft') novo = atual - passo;
    if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); delete state.prefs.larguras[cid]; persistirPrefs(); state.ui.focar = '[data-rsz="' + cid + '"]'; render(); return; }
    if(novo !== null){ e.preventDefault(); state.prefs.larguras[cid] = Math.max(56, Math.min(900, novo)); persistirPrefs(); state.ui.focar = '[data-rsz="' + cid + '"]'; render(); return; }
  }
  if(e.key === 'Enter' && el && !e.shiftKey){
    if(el.id === 'addColInput'){ e.preventDefault(); criarNaColuna(el.dataset.sec, el.dataset.col, el.value); return; }
    if(el.id === 'focoAdd'){ e.preventDefault(); criarNoFoco(el.dataset.sec, el.value); return; }
    if(el.dataset.act === 'status-add-in'){ e.preventDefault(); state.ui.focar = '[data-act="status-add-in"][data-tipo="' + el.dataset.tipo + '"]'; adicionarStatus(el.dataset.tipo, el.value); return; }
    if(el.dataset.act === 'sub-add-in'){ e.preventDefault(); criarSubtarefa(el.dataset.pid, el.value); return; }
    if(el.id === 'novaCat'){ e.preventDefault(); ACOES['cat-add'](); return; }
    // no toque (sem Shift+Enter) o Enter do comentário quebra linha; o envio fica no botão
    if(el.dataset.composer){ if(ehToque()) return; e.preventDefault(); ACOES['enviar-cmt']({id:el.dataset.composer}); return; }
    if(el.classList.contains('inp-title') || EDITAVEIS_RENOMEAR.indexOf(el.dataset.act) !== -1 || el.classList.contains('nm-in')){ e.preventDefault(); el.blur(); return; }
    if(el.id === 'editCmt' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); const b = $('[data-act="cmt-salvar"]'); if(b) b.click(); return; }
  }
  if(digitando || e.metaKey || e.ctrlKey || e.altKey) return;
  if(popAtual || menuAtual || sheetAtual) return;
  const k = e.key.toLowerCase();
  if(k === 'n'){ e.preventDefault(); sheetCaptura(); return; }
  if(k === '/'){ e.preventDefault(); const b = $('#buscaInput'); if(b && b.offsetParent) b.focus(); else sheetBusca(); return; }
  const mapa = {'1':'entrada','2':'hoje','3':'projetos','4':'tarefas'};
  if(mapa[e.key]){ e.preventDefault(); irPara('#/' + mapa[e.key]); }
});

/** Arquivo vindo de fora: ids, status e seções entram no HTML sem escape (data-id="…"), então
    só passam valores sem aspas nem sinais de HTML. Nas preferências, nenhum texto pode tê-los. */
const CHAVES_ID = /^(id|\w+Id|status|secao|tipo|subtipo|kind|modeloAtivo)$/;
function importacaoSegura(dados, prefs){
  const perigo = /["'<>&`\\]/;
  function ok(v, k, tudo){
    if(typeof v === 'string') return !((tudo || CHAVES_ID.test(k)) && perigo.test(v));
    if(Array.isArray(v)) return v.every(x => ok(x, k, tudo));
    if(v && typeof v === 'object') return Object.keys(v).every(c => !(tudo && perigo.test(c)) && ok(v[c], c, tudo));
    return true;
  }
  return ok(dados, '', false) && ok(prefs || null, '', true);
}
function importarArquivo(file){
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const j = JSON.parse(String(fr.result));
      const d = j.dados || j;
      if(!d || !Array.isArray(d.items) || !Array.isArray(d.categorias)) throw new Error('formato');
      if(!importacaoSegura(d, j.prefs)) throw new Error('inseguro');
      const snap = snapshot();
      state.dados = migrarDados(d, Number(j.schemaVersion || 1));
      normalizarDados();
      if(j.prefs && [2,3,4].indexOf(j.prefs.versao) !== -1){ state.prefs = lerPrefs(j.prefs); persistirPrefs(); aplicarTema(); }
      persistir(); render();
      toast('Dados importados (' + state.dados.items.length + ' itens)', () => restaurar(snap));
    }catch(err){ toast(err.message === 'inseguro' ? 'Arquivo recusado: tem conteúdo que poderia rodar código no app' : 'Arquivo inválido: não é um JSON exportado por este app'); }
    const f = $('#fileImport'); if(f) f.value = '';
  };
  fr.readAsText(file);
}

/* =========================================================================
   MÓDULO 22 — NUVEM: login e sincronização dos dados (Supabase)
   O localStorage continua sendo a cópia de trabalho; a nuvem guarda uma linha por usuário
   (tabela gestor_estado). "revisao" sobe a cada gravação no servidor: se a revisão remota
   não é a última que este aparelho viu, outro aparelho gravou antes. Preferências não sincronizam.
   ========================================================================= */
const nuvem = {
  pronto:false,       // só conta mudanças feitas depois da inicialização
  aplicando:false,    // gravação vinda da nuvem não marca pendência
  rodando:false, denovo:false, timer:null, alteracoes:0,
  pausada:false,      // criando a senha nova após o link do e-mail: a pergunta de conflito espera
  retorno:null,       // tokens ou erro trazidos pelo link de recuperação de senha
  st:'', erro:''      // '' | 'sync' | 'ok' | 'offline' | 'erro' | 'conflito' | 'versao' | 'expirou'
};
function lerJSONLS(k){ try{ return JSON.parse(lerLS(k) || 'null'); }catch(e){ return null; } }
function gravarJSONLS(k, v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn('Não foi possível gravar', k, e); } }
/** {uid, base: revisão remota já incorporada, pendente: há mudança local não enviada, ultimaSync} */
function nuvemMeta(){ return Object.assign({uid:null, base:null, pendente:false, ultimaSync:null}, lerJSONLS(LS_NUVEM) || {}); }
function nuvemSalvarMeta(m){ gravarJSONLS(LS_NUVEM, m); }
function nuvemSessao(){ return lerJSONLS(LS_SESSAO); }
/** Preferências que dependem da tela de cada aparelho e não sincronizam. */
const PREFS_DO_APARELHO = ['larguras', 'sidebarCompacta', 'sidebarExp', 'dicas'];
function prefsParaNuvem(){
  const p = clone(state.prefs);
  PREFS_DO_APARELHO.forEach(k => delete p[k]);
  return p;
}
function nuvemPayload(){
  return {dados:state.dados, prefs:prefsParaNuvem(), schema_version:SCHEMA_VERSION, dispositivo:nomeDispositivo()};
}
function aplicarPrefsRemotas(p){
  if(!p || typeof p !== 'object') return;
  const n = Object.assign({}, p);
  PREFS_DO_APARELHO.forEach(k => { n[k] = state.prefs[k]; });
  state.prefs = lerPrefs(n);
  persistirPrefs();
  aplicarTema();
}
function nomeDispositivo(){
  const u = navigator.userAgent;
  const so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'Outro';
  const nav = /Edg\//.test(u) ? 'Edge' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
  return so + (nav ? ' · ' + nav : '');
}

/** Chamada por persistir() e persistirPrefs(): marca a pendência e agenda o envio.
    Preferências só contam com login (mexer em filtros antes de entrar não gera conflito). */
function nuvemMudou(soPrefs){
  if(!nuvem.pronto || nuvem.aplicando) return;
  if(soPrefs && !nuvemSessao()) return;
  nuvem.alteracoes++;
  const m = nuvemMeta();
  if(!m.pendente){ m.pendente = true; nuvemSalvarMeta(m); }
  if(!nuvemSessao()) return;
  clearTimeout(nuvem.timer);
  nuvem.timer = setTimeout(() => nuvemSincronizar(), 2000);
}

/* --- Acesso à API (fetch direto: sem biblioteca, o app segue num arquivo só) --- */
function ErroNuvem(msg, status){ const e = new Error(msg); e.status = status; return e; }
async function nuvemFetch(caminho, op){
  let r;
  try{ r = await fetch(NUVEM_URL + caminho, op); }
  catch(e){ throw ErroNuvem('offline', 0); }
  const txt = await r.text();
  let corpo = null; try{ corpo = txt ? JSON.parse(txt) : null; }catch(e){ corpo = txt; }
  if(!r.ok) throw ErroNuvem((corpo && (corpo.msg || corpo.message || corpo.error_description || corpo.error)) || ('HTTP ' + r.status), r.status);
  return corpo;
}
function nuvemGuardarSessao(j){
  const s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600),
    uid:j.user && j.user.id, email:j.user && j.user.email};
  gravarJSONLS(LS_SESSAO, s);
  return s;
}
async function nuvemRenovar(s){
  try{
    const j = await nuvemFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:NUVEM_CHAVE, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:s.refresh_token})});
    return nuvemGuardarSessao(j);
  }catch(e){
    if(e.status >= 400 && e.status < 500){ gravarJSONLS(LS_SESSAO, null); throw ErroNuvem('expirou', 401); }   // sessão revogada ou vencida
    throw e;
  }
}
async function nuvemToken(forcar){
  let s = nuvemSessao();
  if(!s) throw ErroNuvem('expirou', 401);
  if(forcar || s.expires_at - 60 < Date.now()/1000) s = await nuvemRenovar(s);
  return s.access_token;
}
/** REST da tabela; um 401 renova a sessão e tenta mais uma vez. */
async function nuvemRest(metodo, caminho, corpo, prefer){
  for(let i = 0; i < 2; i++){
    const tk = await nuvemToken(i > 0);
    const h = {apikey:NUVEM_CHAVE, Authorization:'Bearer ' + tk, 'Content-Type':'application/json'};
    if(prefer) h.Prefer = prefer;
    try{ return await nuvemFetch('/rest/v1/' + caminho, {method:metodo, headers:h, body:corpo ? JSON.stringify(corpo) : undefined}); }
    catch(e){ if(e.status !== 401 || i > 0) throw e; }
  }
}

/* --- Entrar e sair --- */
/** aoAutenticar: roda com a senha aceita, antes da primeira sincronização (que pode abrir a pergunta de conflito). */
async function nuvemEntrar(email, senha, aoAutenticar){
  const j = await nuvemFetch('/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:NUVEM_CHAVE, 'Content-Type':'application/json'}, body:JSON.stringify({email, password:senha})});
  return nuvemAbrirSessao(j, aoAutenticar);
}
/** Sessão nova (senha ou link de recuperação): troca de conta zera a base e sincroniza. */
function nuvemAbrirSessao(j, aoAutenticar, semSincronizar){
  const s = nuvemGuardarSessao(j);
  const m = nuvemMeta();
  if(m.uid !== s.uid){ m.uid = s.uid; m.base = null; m.ultimaSync = null; nuvemSalvarMeta(m); }   // outra conta: começa do zero
  nuvem.st = ''; nuvem.erro = '';
  if(aoAutenticar) aoAutenticar();
  if(semSincronizar) return Promise.resolve();
  return nuvemSincronizar({primeira:true});
}
/** apagar: limpa os dados e as preferências deste aparelho (a cópia da conta continua na nuvem). */
function nuvemSair(apagar){
  const s = nuvemSessao();
  if(s) fetch(NUVEM_URL + '/auth/v1/logout', {method:'POST', headers:{apikey:NUVEM_CHAVE, Authorization:'Bearer ' + s.access_token}}).catch(() => {});
  gravarJSONLS(LS_SESSAO, null);
  clearTimeout(nuvem.timer);
  nuvem.st = ''; nuvem.erro = '';
  if(apagar){
    nuvem.aplicando = true;
    try{
      state.dados = dadosExemplo(); normalizarDados(); persistir();
      const larg = state.prefs.larguras, comp = state.prefs.sidebarCompacta;
      state.prefs = prefsPadrao(); state.prefs.larguras = larg; state.prefs.sidebarCompacta = comp;
      persistirPrefs(); aplicarTema();
    }finally{ nuvem.aplicando = false; }
    gravarJSONLS(LS_NUVEM, null);   // próximo login neste aparelho recebe tudo da nuvem, sem conflito
  }
  render();
  mostrarBoasVindas();
  toast(apagar ? 'Você saiu. Os dados deste aparelho foram apagados; os da conta continuam na nuvem.' : 'Você saiu. Os dados continuam neste aparelho.');
}

/* --- Sincronização --- */
/** op.perguntar=false (checagem periódica): conflito não abre pergunta, só avisa na caixa. */
async function nuvemSincronizar(op){
  op = op || {};
  if(!nuvemSessao() || nuvem.pausada) return;
  if(nuvem.rodando){ nuvem.denovo = true; return; }
  clearTimeout(nuvem.timer);
  nuvem.rodando = true; nuvemStatus('sync');
  try{
    let r = 'repetir';
    for(let i = 0; i < 4 && r === 'repetir'; i++) r = await nuvemPasso(op);
    if(r === 'repetir') throw ErroNuvem('A nuvem mudou várias vezes seguidas. Tente de novo.', 0);
    if(r) nuvemStatus(r);
  }catch(e){
    if(e.message === 'offline') nuvemStatus('offline');
    else if(e.message === 'expirou'){ nuvemStatus('expirou'); render(); }
    else { console.warn('Sincronização', e); nuvemStatus('erro', e.message); }
  }finally{
    nuvem.rodando = false;
    if(nuvem.denovo){ nuvem.denovo = false; setTimeout(() => nuvemSincronizar(op), 0); }
  }
}
/** Um ciclo: devolve o status final ou 'repetir' (alguém gravou no meio do caminho). */
async function nuvemPasso(op){
  const m = nuvemMeta();
  const linhas = await nuvemRest('GET', 'gestor_estado?select=revisao,schema_version,atualizado_em,dispositivo');
  const rem = linhas && linhas[0];
  if(!rem){
    // primeira gravação desta conta
    const n0 = nuvem.alteracoes;
    try{
      const r = await nuvemRest('POST', 'gestor_estado?select=revisao,atualizado_em', nuvemPayload(), 'return=representation');
      nuvemConfirmado(r[0], n0);
      if(op.primeira) toast('Dados deste aparelho enviados para a nuvem');
      return 'ok';
    }catch(e){ if(e.status === 409) return 'repetir'; throw e; }
  }
  if(rem.schema_version > SCHEMA_VERSION) return 'versao';   // outro aparelho já usa um app mais novo: não sobrescrever
  if(m.base === rem.revisao){
    if(!m.pendente) return nuvemConfirmado(rem, nuvem.alteracoes, true);
    return nuvemEnviar(rem.revisao);
  }
  // a nuvem mudou desde a última vez
  if(!m.pendente) return nuvemAplicarRemoto(rem, op);
  if(op.perguntar === false) return 'conflito';
  const quando = new Date(rem.atualizado_em).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  const esc1 = await abrirConfirm({titulo:'Dados diferentes na nuvem',
    texto:(m.base == null ? 'Este aparelho tem dados que ainda não estão na nuvem, e a nuvem já tem dados' : 'Este aparelho tem mudanças não enviadas, e a nuvem recebeu outras') +
      ' (' + (rem.dispositivo || 'outro aparelho') + ', ' + quando + '). Qual versão fica? A outra é guardada como cópia neste aparelho.',
    opcoes:[{label:'Usar os dados da nuvem', valor:'nuvem', variante:'prim'}, {label:'Manter os deste aparelho', valor:'local'}, {label:'Decidir depois', valor:null}]});
  if(!esc1) return 'conflito';
  if(esc1 === 'nuvem'){
    nuvemGuardarCopia(state.dados, 'deste aparelho');
    const mm = nuvemMeta(); mm.pendente = false; nuvemSalvarMeta(mm);
    return nuvemAplicarRemoto(rem, op, true);
  }
  const cheia = await nuvemRest('GET', 'gestor_estado?select=dados,schema_version');
  if(cheia && cheia[0]) nuvemGuardarCopia(cheia[0].dados, 'da nuvem');
  return nuvemEnviar(rem.revisao);
}
/** Grava só se a nuvem ainda está na revisão esperada; senão, repete o ciclo. */
async function nuvemEnviar(revisao){
  const m = nuvemMeta(), n0 = nuvem.alteracoes;
  const r = await nuvemRest('PATCH', 'gestor_estado?user_id=eq.' + encodeURIComponent(m.uid) + '&revisao=eq.' + revisao + '&select=revisao,atualizado_em',
    nuvemPayload(), 'return=representation');
  if(!r || !r.length) return 'repetir';
  return nuvemConfirmado(r[0], n0);
}
/** Registra a revisão sincronizada; a pendência só cai se nada mudou durante o envio. */
function nuvemConfirmado(rem, n0, semEnvio){
  const m = nuvemMeta();
  m.base = rem.revisao; m.ultimaSync = new Date().toISOString();
  if(nuvem.alteracoes === n0) m.pendente = false;
  nuvemSalvarMeta(m);
  if(m.pendente && !semEnvio) nuvem.denovo = true;
  return 'ok';
}
/** Digitando ou com um editor aberto, não redesenha a tela por baixo: tenta de novo em instantes. */
function nuvemUsuarioEditando(){
  const a = document.activeElement;
  return !!(sheetAtual || popAtual || menuAtual || (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)));
}
async function nuvemAplicarRemoto(rem, op, escolhido){
  // logo após entrar, o foco ainda está no campo de senha: não adia
  if(!escolhido && !op.primeira && nuvemUsuarioEditando()){ nuvem.timer = setTimeout(() => nuvemSincronizar(op), 4000); return 'sync'; }
  const cheia = await nuvemRest('GET', 'gestor_estado?select=dados,prefs,schema_version,revisao,dispositivo');
  const r = cheia && cheia[0];
  if(!r) return 'repetir';
  if(!escolhido && nuvemMeta().pendente) return 'repetir';   // houve mudança local durante o download
  nuvem.aplicando = true;
  try{
    state.dados = migrarDados(r.dados, r.schema_version);
    normalizarDados();
    persistir();
    aplicarPrefsRemotas(r.prefs);
  }finally{ nuvem.aplicando = false; }
  const m = nuvemMeta(); m.base = r.revisao; m.pendente = false; m.ultimaSync = new Date().toISOString(); nuvemSalvarMeta(m);
  render();
  toast(op.primeira ? 'Dados da nuvem carregados (' + state.dados.items.length + ' itens)' : 'Atualizado com as mudanças de ' + (r.dispositivo || 'outro aparelho'));
  return 'ok';
}
/** Guarda a versão descartada num conflito (as 3 mais recentes). */
function nuvemGuardarCopia(dados, origem){
  try{
    const chaves = [];
    for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.indexOf('gestor.conflito.') === 0) chaves.push(k); }
    chaves.sort().slice(0, Math.max(0, chaves.length - 2)).forEach(k => localStorage.removeItem(k));
    localStorage.setItem('gestor.conflito.' + new Date().toISOString(), JSON.stringify({schemaVersion:SCHEMA_VERSION, origem, dados}));
  }catch(e){ console.warn('Não foi possível guardar a cópia do conflito', e); }
}

/* --- Senha: "Esqueci a senha" (link por e-mail) e "Alterar senha" (com login) ---
   O link do e-mail volta para o app com os tokens no hash (#access_token=…&type=recovery). */
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('[data-esqueci]'); if(!b) return;
  const f = b.closest('form'), campo = $('input[type=email]', f), email = campo.value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    toast('Digite seu e-mail no campo acima e toque de novo em “Esqueci a senha”');
    campo.focus();
    return;
  }
  b.disabled = true; b.textContent = 'Enviando…';
  nuvemFetch('/auth/v1/recover?redirect_to=' + encodeURIComponent(location.origin + location.pathname),
    {method:'POST', headers:{apikey:NUVEM_CHAVE, 'Content-Type':'application/json'}, body:JSON.stringify({email})}
  ).then(function(){
    toast('Se esse e-mail tiver conta, chega um link para criar uma senha nova. Confira também o spam.', null, {label:'OK', fn(){}});
  }).catch(function(err){
    toast(err.message === 'offline' ? 'Sem conexão com a internet'
      : err.status === 429 ? 'Muitos pedidos seguidos. Espere alguns minutos e tente de novo.'
      : 'Não foi possível enviar o e-mail: ' + err.message);
  }).finally(function(){ b.disabled = false; b.textContent = 'Esqueci a senha'; });
});

/** recuperacao: veio do link do e-mail (não pede a senha atual; a sincronização espera o sheet fechar). */
function abrirNovaSenha(recuperacao){
  const s = nuvemSessao(); if(!s) return;
  abrirSheet({titulo: recuperacao ? 'Criar nova senha' : 'Alterar senha', autofoco:'sempre',
    corpo:'<form id="novaSenhaForm" autocomplete="on" novalidate>' +
      (recuperacao ? '<p style="font-size:14px;color:var(--text-2);margin-bottom:12px">Você entrou pelo link do e-mail. Escolha a senha nova para <b>' + esc(s.email || '') + '</b>.</p>' : '') +
      '<input type="email" name="email" autocomplete="username" value="' + esc(s.email || '') + '" hidden>' +
      '<div class="field"><label for="novaSenha1">Nova senha</label><input class="inp" id="novaSenha1" type="password" autocomplete="new-password" minlength="6"></div>' +
      '<div class="field"><label for="novaSenha2">Repita a nova senha</label><input class="inp" id="novaSenha2" type="password" autocomplete="new-password"></div>' +
      '<p class="hint" style="margin-bottom:12px">' + ic('info',13) + '<span>Pelo menos 6 caracteres. Nos outros aparelhos você continua conectado.</span></p>' +
      '<button type="submit" class="btn prim blk">Salvar senha</button>' +
    '</form>',
    aoMontar(el){
      $('#novaSenhaForm', el).addEventListener('submit', function(ev){
        ev.preventDefault();
        const s1 = $('#novaSenha1', el).value, s2 = $('#novaSenha2', el).value, b = $('button[type=submit]', el);
        if(s1.length < 6){ toast('A senha precisa ter pelo menos 6 caracteres'); $('#novaSenha1', el).focus(); return; }
        if(s1 !== s2){ toast('As duas senhas não são iguais'); $('#novaSenha2', el).focus(); return; }
        b.disabled = true; b.textContent = 'Salvando…';
        nuvemTrocarSenha(s1).then(function(){
          fecharSheet();
          toast('Senha alterada. Use a nova senha para entrar nos outros aparelhos.');
        }).catch(function(err){
          b.disabled = false; b.textContent = 'Salvar senha';
          const msg = String(err.message || '');
          toast(msg === 'offline' ? 'Sem conexão com a internet'
            : msg === 'expirou' ? 'A sessão expirou. Entre de novo ou peça outro link em “Esqueci a senha”.'
            : /different/i.test(msg) ? 'A nova senha precisa ser diferente da atual'
            : /reauthenticat/i.test(msg) ? 'Por segurança, saia e entre de novo antes de trocar a senha'
            : /weak|at least|characters/i.test(msg) ? 'Senha fraca. Use mais caracteres, misturando letras e números.'
            : 'Não foi possível trocar a senha: ' + msg);
        });
      });
    },
    aoFechar(){
      if(!recuperacao) return;
      nuvem.pausada = false;
      render();
      nuvemSincronizar({primeira:true});
    }});
}
async function nuvemTrocarSenha(senha){
  for(let i = 0; i < 2; i++){
    const tk = await nuvemToken(i > 0);
    try{
      return await nuvemFetch('/auth/v1/user', {method:'PUT', headers:{apikey:NUVEM_CHAVE, Authorization:'Bearer ' + tk, 'Content-Type':'application/json'},
        body:JSON.stringify({password:senha})});
    }catch(e){ if(e.status !== 401 || i > 0) throw e; }
  }
}
/** Chamada no boot, antes do roteamento: tira os tokens (ou o erro) do endereço. */
function nuvemLerRetornoEmail(){
  const h = location.hash.replace(/^#/, ''), q = location.search.replace(/^\?/, '');
  const temHash = /(^|&)(access_token|error|error_code)=/.test(h), temQuery = /(^|&)(error|error_code)=/.test(q);
  if(!temHash && !temQuery) return;
  const p = new URLSearchParams(temHash ? h : q);
  nuvem.retorno = {tipo:p.get('type'), access_token:p.get('access_token'), refresh_token:p.get('refresh_token'),
    expires_in:Number(p.get('expires_in')) || 3600, expires_at:Number(p.get('expires_at')) || null,
    erro:p.get('error_code') || p.get('error'), erroTxt:p.get('error_description')};
  history.replaceState(null, '', location.pathname + (temQuery ? '' : location.search) + '#/hoje');
}
/** Devolve true se tratou um retorno do link do e-mail (aí as boas-vindas não abrem). */
function nuvemTratarRetorno(){
  const r = nuvem.retorno; nuvem.retorno = null;
  if(!r) return false;
  try{ localStorage.setItem(LS_BOAS_VINDAS, 'visto'); }catch(e){}
  if(r.erro || !r.access_token){
    console.warn('Link do e-mail', r.erro, r.erroTxt);
    toast(r.erro === 'otp_expired' ? 'Esse link expirou ou já foi usado. Peça outro em “Esqueci a senha”.' : 'O link do e-mail não funcionou. Peça outro em “Esqueci a senha”.', null,
      nuvemSessao() ? null : {label:'Entrar', fn:mostrarBoasVindas});
    return true;
  }
  nuvem.pausada = r.tipo === 'recovery';
  nuvemFetch('/auth/v1/user', {headers:{apikey:NUVEM_CHAVE, Authorization:'Bearer ' + r.access_token}}).then(function(user){
    return nuvemAbrirSessao({access_token:r.access_token, refresh_token:r.refresh_token, expires_in:r.expires_in, expires_at:r.expires_at, user}, null, nuvem.pausada);
  }).then(function(){
    render();
    if(nuvem.pausada) abrirNovaSenha(true);
  }).catch(function(err){
    nuvem.pausada = false;
    toast(err.message === 'offline' ? 'Sem conexão com a internet. Abra o link do e-mail de novo quando a internet voltar.' : 'O link do e-mail não funcionou. Peça outro em “Esqueci a senha”.');
  });
  return true;
}
